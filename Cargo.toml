[package]
name = "joy"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
rand = { version = "0.8", features = ["getrandom"] }
axum = { version = "0.8.8", features = ["multipart"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
nanoid = "0.5.0"
rusty_paseto = { version = "0.9.0", features = ["batteries_included"] }
serde = {version = "1.0.228", features=["derive"]}
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "sqlite", "runtime-tokio-rustls", "migrate"] }
redis = { version = "1.0.3", features = ["tokio-comp", "connection-manager"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.6.8", features = ["trace", "compression-gzip", "cors", "fs", "compression-br", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = {version="0.3.22", features=["env-filter"]}
prost = "0.14.3"
prost-types = "0.14.3"
time = { version = "0.3.36", features = ["formatting", "parsing", "macros", "serde-human-readable"] }
regex = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
flate2 = "1.1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
rusty-s3 = { version = "0.11", default-features = false, features = ["rustcrypto", "xml"] }

[profile.release]
opt-level = 3
# Fat LTO + one codegen unit: slower to build, smaller and faster binary (the deploy build is the only one that matters).
lto = "fat"
codegen-units = 1
strip = true
# unwind (not abort) so CatchPanicLayer turns a stray panic into a 500 instead of killing the server.
panic = "unwind"

[build-dependencies]
prost-build = "0.14.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
