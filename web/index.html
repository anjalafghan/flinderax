<!doctype html>
<html lang="en">
    <head>
        <!-- Character encoding & viewport -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

        <!-- Primary SEO Meta Tags -->
        <title>joy - Your money and your dates</title>
        <meta
            name="description"
            content="joy is a money planner and a date jar for two: see what you can safely spend until payday, and pick the next date when you can't decide."
        />
        <meta
            name="keywords"
            content="credit card tracker, balance tracker, finance management, spending tracker, credit card balance, personal finance, joy, date ideas"
        />
        <meta name="author" content="joy" />
        <meta name="robots" content="noindex, nofollow" />

        <!-- Canonical URL (update __SITE_URL__ in production) -->
        <link rel="canonical" href="__SITE_URL__" />

        <!-- Theme & App Meta -->
        <meta
            name="theme-color"
            content="#16140F"
            media="(prefers-color-scheme: dark)"
        />
        <meta
            name="theme-color"
            content="#F6F1E9"
            media="(prefers-color-scheme: light)"
        />
        <meta name="color-scheme" content="dark light" />
        <meta name="application-name" content="joy" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="__SITE_URL__" />
        <meta
            property="og:title"
            content="joy - Your money and your dates"
        />
        <meta
            property="og:description"
            content="Your money and your dates, in one place."
        />
        <meta property="og:image" content="__SITE_URL__/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:site_name" content="joy" />
        <meta property="og:locale" content="en_US" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:url" content="__SITE_URL__" />
        <meta
            name="twitter:title"
            content="joy - Your money and your dates"
        />
        <meta
            name="twitter:description"
            content="Your money and your dates, in one place."
        />
        <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

        <!-- Preconnect to API origin for faster critical request initiation -->
        <link rel="preconnect" href="__SITE_URL__" />
        <link rel="dns-prefetch" href="__SITE_URL__" />

        <!-- Favicon & Icons -->
        <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
        <link rel="apple-touch-icon" href="./public/favicon.svg" />

        <!-- Apply the saved theme before first paint, so dark mode doesn't flash light on every load. -->
        <script>
            try {
                var t = localStorage.getItem("vite-ui-theme");
                document.documentElement.classList.add(t === "light" ? "light" : "dark"); // ThemeProvider defaults to dark
            } catch (e) {}
        </script>

        <!-- Fonts: Newsreader (display, numbers) and Figtree (UI) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=Figtree:wght@400;500;600&display=swap" />

        <!-- Stylesheet -->
        <link rel="stylesheet" href="./src/index.css" />

        <!-- Structured Data (JSON-LD) for SEO -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebApplication",
                "name": "joy",
                "description": "A money planner and a date jar for two: what you can safely spend until payday, and the next date to go on.",
                "url": "__SITE_URL__",
                "applicationCategory": "FinanceApplication",
                "operatingSystem": "Web",
                "offers": {
                    "@type": "Offer",
                    "price": "0",
                    "priceCurrency": "USD"
                },
                "featureList": [
                    "Safe-to-spend until payday",
                    "Credit cards, bills and goals",
                    "A date jar for two",
                    "Dark mode support"
                ]
            }
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.tsx"></script>
    </body>
</html>
