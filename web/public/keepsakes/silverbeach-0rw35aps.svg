 d="M160 62 l6 7 l12 -16" fill="none" stroke="#2f6db5" stroke-width="2.6" stroke-linecap="round"></path><path class="mk" style="--d:1.45s" pathLength="1" d="M310 62 l6 7 l12 -16" fill="none" stroke="#2f6db5" stroke-width="2.6" stroke-linecap="round"></path><g class="fl1"><rect x="0" width="150" height="300" fill="#2f6db5"></rect><rect x="8" y="8" width="134" height="284" fill="none" stroke="#fff" stroke-opacity=".5"></rect></g><g class="fl2"><rect x="300" width="150" height="300" fill="#2f6db5"></rect><rect x="308" y="8" width="134" height="284" fill="none" stroke="#fff" stroke-opacity=".5"></rect></g><g class="mid"><rect x="150" width="150" height="300" fill="#2f6db5"></rect><rect x="158" y="8" width="134" height="284" fill="none" stroke="#fff" stroke-opacity=".5"></rect><g><text x="225.0" y="120" font-family="Fraunces, serif" font-size="20.3" font-weight="700" fill="#fff" text-anchor="middle">Silver Beach</text><text x="225.0" y="150" font-family="'Space Mono', monospace" font-size="10" fill="#fff" text-anchor="middle">Juhu, by the sand</text><g transform="translate(225 220) scale(0.6)"><circle r="18" fill="#f2c230"></circle><path d="M0 -26 V-36" stroke="#f2c230" stroke-width="4" stroke-linecap="round" transform="rotate(0)"></path><path d="M0 -26 V-36" stroke="#f2c230" stroke-width="4" stroke-linecap="round" transform="rotate(45)"></path><path d="M0 -26 V-36" stroke="#f2c230" stroke-width="4" stroke-linecap="round" transform="rotate(90)"></path><path d="M0 -26 V-36" stroke="#f2c230" stroke-width="4" stroke-linecap="round" transform="rotate(135)"></path><path d="M0 -26 V-36" stroke="#f2c230" stroke-width="4" stroke-linecap="round" transform="rotate(180)"></path><path d="M0 -26 V-36" stroke="#f2c230" stroke-width="4" stroke-linecap="round" transform="rotate(225)"></path><path d="M0 -26 V-36" stroke="#f2c230" stroke-width="4" stroke-linecap="round" transform="rotate(270)"></path><path d="M0 -26 V-36" stroke="#f2c230" stroke-width="4" stroke-linecap="round" transform=