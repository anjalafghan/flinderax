<svg xmlns="http://www.w3.org/2000/svg" viewBox="108 148 406 279" aria-hidden="true" focusable="false"><style>.joy .ksc-artdeco .card{transform-box:fill-box;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.joy .ksc-artdeco .pb{opacity:0;transition:opacity 0s .35s}
.joy .ksc-artdeco .pf{transition:opacity 0s .35s}
.joy .ksc-artdeco.open .card{transform:scaleX(-1) rotate(-3deg);transition:transform .7s cubic-bezier(.4,0,.2,1) .7s}
.joy .ksc-artdeco.open .pb{opacity:1;transition:opacity 0s 1.05s}
.joy .ksc-artdeco.open .pf{opacity:0;transition:opacity 0s 1.05s}
.joy .ksc-artdeco .frank{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-artdeco.open .frank{animation:frk_artdeco .25s ease-out .15s both}
@keyframes frk_artdeco{0%{opacity:0;transform:scale(1.7)}100%{opacity:.85;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-artdeco .card,.joy .ksc-artdeco .pb,.joy .ksc-artdeco .pf,.joy .ksc-artdeco .frank{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><clipPath id="artdeco-pc-c"><rect width="360" height="230" rx="6"></rect></clipPath><linearGradient id="artdeco-pc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd3e0"></stop><stop offset="1" stop-color="#f6e1c4"></stop></linearGradient></defs><g transform="translate(120 186) rotate(-4)"><g class="card"><g class="pf"><g clip-path="url(#artdeco-pc-c)"><rect width="360" height="230" fill="url(#artdeco-pc-sky)"></rect><path d="M0 160 C90 150 270 170 360 156 V230 H0 Z" fill="#5a8fa0"></path><g transform="translate(120 150) scale(1.6)"><path d="M-50 24 V2 H-40 V-14 H-30 V4 H-22 V-30 H-12 V-6 H-4 V-20 H8 V-40 L12 -48 L16 -40 V0 H24 V-12 H34 V6 H42 V-8 H50 V24 Z" fill="#f1e7d0"></path></g><g transform="translate(260 152) scale(1.5)"><path d="M-50 24 V2 H-40 V-14 H-30 V4 H-22 V-30 H-12 V-6 H-4 V-20 H8 V-40 L12 -48 L16 -40 V0 H24 V-12 H34 V6 H42 V-8 H50 V24 Z" fill="#e9d6b3"></path></g><g transform="translate(300 60) scale(0.6)"><circle r="18" fill="#f6a04d"></circle><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(0)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(45)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(90)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(135)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(180)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(225)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(270)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(315)"></path></g></g><rect x="8" y="8" width="344" height="214" rx="4" fill="none" stroke="#fff" stroke-width="6"></rect><path d="M14 178 H300 L308 196 L300 214 H14 Z" fill="#fbf6ea"></path><text x="24" y="204" font-family="Caveat, cursive" font-size="28" font-weight="700" fill="#2a3f7a" text-anchor="start">Art Deco, Churchgate</text><g transform="translate(290 40) rotate(-12)"><g class="frank"><circle r="26" fill="none" stroke="#2a2a2a" stroke-width="2.4"></circle><path d="M30 -12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 -4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path></g></g></g><g class="pb" transform="translate(360 0) scale(-1 1)"><rect width="360" height="230" rx="6" fill="#fbf6ea"></rect><path d="M190.0 24 V206" stroke="#c9b48a"></path><text x="20" y="60" font-family="Kalam, cursive" font-size="17.6" fill="#2a3f7a" text-anchor="start">Curved balconies,</text><text x="20" y="90" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">sunburst gates,</text><text x="20" y="120" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">the Eros at the</text><text x="20" y="150" font-family="Kalam, cursive" font-size="15.0" fill="#2a3f7a" text-anchor="start">corner. Walked slow.</text><rect x="290" y="18" width="52" height="62" fill="#f2e3b3" stroke="#c0392b" stroke-dasharray="3 2"></rect><g transform="translate(316 49) scale(.5)"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#f1c84b"></path></g><path d="M204.0 120 H336" stroke="#c9b48a"></path><path d="M204.0 150 H336" stroke="#c9b48a"></path><path d="M204.0 180 H336" stroke="#c9b48a"></path><text x="208.0" y="114" font-family="Kalam, cursive" font-size="18" fill="#2a3f7a" text-anchor="start">to us</text></g></g></g></svg>
