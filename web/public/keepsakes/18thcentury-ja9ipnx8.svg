<svg xmlns="http://www.w3.org/2000/svg" viewBox="158 -5 303 536" aria-hidden="true" focusable="false"><style>.joy .ksc-18thcentury .ly{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-18thcentury.open .ly{animation:k118_18thcentury 2.2s ease-in-out 0s 1}
@keyframes k118_18thcentury{0%,100%{transform:rotate(0)}20%{transform:rotate(6deg)}45%{transform:rotate(-4.800000000000001deg)}70%{transform:rotate(2.7deg)}88%{transform:rotate(-1.2000000000000002deg)}}
.joy .ksc-18thcentury .glow{opacity:0}
.joy .ksc-18thcentury.open .glow{animation:gl_18thcentury 1.2s ease-out .3s}
@keyframes gl_18thcentury{30%{opacity:.35}100%{opacity:0}}
