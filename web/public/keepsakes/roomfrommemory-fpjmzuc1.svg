<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 81 355 409" aria-hidden="true" focusable="false"><style>.joy .ksc-roomfrommemory .pol{transform-box:fill-box}
.joy .ksc-roomfrommemory.open .pol{animation:k160_roomfrommemory .09s linear 0s 5}
@keyframes k160_roomfrommemory{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-roomfrommemory .dev{transition:opacity .3s}
.joy .ksc-roomfrommemory.open .dev{opacity:0;transition:opacity 1.6s ease-in .5s}
@media (prefers-reduced-motion:reduce){.joy .ksc-roomfrommemory .dev,.joy .ksc-roomfrommemory .pol{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pol"><g transform="translate(150 120) rotate(-5)"><path d="M0 0 H300 V326 Q292 354 260 360 H0 Z" fill="#fbfaf6"></path><path d="M300 326 Q292 354 260 360 Q278 338 300 326 Z" fill="#d9d4c6"></path><clipPath id="roomfrommemory-pl-c"><rect x="20" y="20" width="260" height="260"></rect></clipPath><linearGradient id="roomfrommemory-pl-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf6"></stop><stop offset="1" stop-color="#f3efe6"></stop></linearGradient><g clip-path="url(#roomfrommemory-pl-c)"><rect x="20" y="20" width="260" height="260" fill="url(#roomfrommemory-pl-s)"></rect><path d="M20 210 C100 196 200 220 280 204 V280 H20 Z" fill="#f3efe6"></path><g transform="translate(20 20)"><g transform="translate(130 140) scale(2)"><path d="M-26 24 V-4 L0 -26 L26 -4 V24 Z" fill="#f6efe0"></path><path d="M-32 0 L0 -30 L32 0" fill="none" stroke="#2b2b30" stroke-width="5" stroke-linecap="round"></path><rect x="-6" y="6" width="12" height="18" fill="#2b2b30"></rect></g><g transform="translate(60 60) scale(0.8)"><path d="M-12 -24 H12 L16 20 H-16 Z" fill="#f2c230" fill-opacity=".9"></path><path d="M-14 -24 H14 M-18 20 H18 M0 -24 V-34" stroke="#3a2a1a" stroke-width="3"></path><path d="M-8 -30 a8 6 0 0 1 16 0" fill="none" stroke="#3a2a1a" stroke-width="2"></path></g></g></g><rect class="dev" x="20" y="20" width="260" height="260" fill="#2b2a2e"></rect><text x="150.0" y="330" font-family="Caveat, cursive" font-size="30" font-weight="700" fill="#2b2b30" text-anchor="middle">the bed is not there</text></g></g></svg>
