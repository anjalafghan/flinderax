<svg xmlns="http://www.w3.org/2000/svg" viewBox="108 148 406 279" aria-hidden="true" focusable="false"><style>.joy .ksc-lonavala .card{transform-box:fill-box;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.joy .ksc-lonavala .pb{opacity:0;transition:opacity 0s .35s}
.joy .ksc-lonavala .pf{transition:opacity 0s .35s}
.joy .ksc-lonavala.open .card{transform:scaleX(-1) rotate(-3deg);transition:transform .7s cubic-bezier(.4,0,.2,1) .7s}
.joy .ksc-lonavala.open .pb{opacity:1;transition:opacity 0s 1.05s}
.joy .ksc-lonavala.open .pf{opacity:0;transition:opacity 0s 1.05s}
.joy .ksc-lonavala .frank{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-lonavala.open .frank{animation:frk_lonavala .25s ease-out .15s both}
@keyframes frk_lonavala{0%{opacity:0;transform:scale(1.7)}100%{opacity:.85;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-lonavala .card,.joy .ksc-lonavala .pb,.joy .ksc-lonavala .pf,.joy .ksc-lonavala .frank{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><clipPath id="lonavala-pc-c"><rect width="360" height="230" rx="6"></rect></clipPath><linearGradient id="lonavala-pc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d6c4"></stop><stop offset="1" stop-color="#e9ddc0"></stop></linearGradient></defs><g transform="translate(120 186) rotate(-4)"><g class="card"><g class="pf"><g clip-path="url(#lonavala-pc-c)"><rect width="360" height="230" fill="url(#lonavala-pc-sky)"></rect><path d="M0 160 C90 150 270 170 360 156 V230 H0 Z" fill="#3f553b"></path><g transform="translate(120 140) scale(2.2)"><path d="M-50 28 C-30 -10 -10 -26 10 -6 C24 -30 40 -34 50 -10 V28 Z" fill="#4f7a45"></path><path d="M-30 28 C-10 16 20 18 4 6 C-12 -4 26 -8 10 -18 C0 -24 20 -28 30 -30" fill="none" stroke="#3c3c3c" stroke-width="4" stroke-linecap="round"></path><path d="M-30 28 C-10 16 20 18 4 6 C-12 -4 26 -8 10 -18 C0 -24 20 -28 30 -30" fill="none" stroke="#fff" stroke-width=".8" stroke-dasharray="3 3"></path></g><g transform="translate(250 90) scale(1.2)"><path d="M-40 -8 h50" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path><path d="M-10 4 h46" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path><path d="M-34 16 h40" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path></g><g transform="translate(70 70) scale(0.9)"><path d="M-40 -8 h50" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path><path d="M-10 4 h46" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path><path d="M-34 16 h40" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path></g><g transform="translate(300 150) scale(1.4)"><path d="M-50 20 C-30 -20