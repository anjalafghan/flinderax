<svg xmlns="http://www.w3.org/2000/svg" viewBox="149 99 302 437" aria-hidden="true" focusable="false"><style>.joy .ksc-cranes .shine{opacity:0}
.joy .ksc-cranes.open .shine{animation:shn_cranes .9s ease-out .2s}
@keyframes shn_cranes{0%{opacity:0;transform:translateX(0)}30%{opacity:.6}100%{opacity:0;transform:translateX(160px)}}
.joy .ksc-cranes .bd{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-cranes.open .bd{animation:k156_cranes 2.2s ease-in-out 0s 1}
@keyframes k156_cranes{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}45%{transform:rotate(-4.0deg)}70%{transform:rotate(2.25deg)}88%{transform:rotate(-1.0deg)}}
.joy .ksc-cranes .tails{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-cranes.open .tails{animation:flut_cranes .3s ease-in-out 5 alternate}
@keyframes flut_cranes{to{transform:skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-cranes .tails,.joy .ksc-cranes .shine,.joy .ksc-cranes .bd{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="bd"><g transform="translate(300 250) rotate(-6)"><g class="tails"><path d="M-60 80 L-90 260 L-60 236 L-36 266 L-10 96 Z" fill="#2f6db5"></path><path d="M60 80 L90 260 L60 236 L36 266 L10 96 Z" fill="#e46f2a"></path></g><circle cx="124.0" cy="0.0" r="14" fill="#e46f2a"></circle><circle cx="119.8" cy="32.1" r="14" fill="#e46f2a"></circle><circle cx="107.4" cy="62.0" r="14" fill="#e46f2a"></circle><circle cx="87.7" cy="87.7" r="14" fill="#e46f2a"></circle><circle cx="62.0" cy="107.4" r="14" fill="#e46f2a"></circle><circle cx="32.1" cy="119.8" r="14" fill="#e46f2a"></circle><circle cx="0.0" cy="124.0" r="14" fill="#e46f2a"></circle><circle cx="-32.1" cy="119.8" r="14" fill="#e46f2a"></circle><circle cx="-62.0" cy="107.4" r="14" fill="#e46f2a"></circle><circle cx="-87.7" cy="87.7" r="14" fill="#e46f2a"></circle><circle cx="-107.4" cy="62.0" r="14" fill="#e46f2a"></circle><circle cx="-119.8" cy="32.1" r="14" fill="#e46f2a"></circle><circle cx="-124.0" cy="0.0" r="14" fill="#e46f2a"></circle><circle cx="-119.8" cy="-32.1" r="14" fill="#e46f2a"></circle><circle cx="-107.4" cy="-62.0" r="14" fill="#e46f2a"></circle><circle cx="-87.7" cy="-87.7" r="14" fill="#e46f2a"></circle><circle cx="-62.0" cy="-107.4" r="14" fill="#e46f2a"></circle><circle cx="-32.1" cy="-119.8" r="14" fill="#e46f2a"></circle><circle cx="-0.0" cy="-124.0" r="14" fill="#e46f2a"></circle><circle cx="32.1" cy="-119.8" r="14" fill="#e46f2a"></circle><circle cx="62.0" cy="-107.4" r="14" fill="#e46f2a"></circle><circle cx="87.7" cy="-87.7" r="14" fill="#e46f2a"></circle><circle cx="107.4" cy="-62.0" r="14" fill="#e46f2a"></circle><circle cx="119.8" cy="-32.1" r="14" fill="#e46f2a"></circle><circle r="120" fill="#f6efe0"></circle><circle r="108" fill="none" stroke="#2b2b30" stroke-opacity=".4" stroke-dasharray="3 5"></circle><text x="0" y="-44" font-family="'Young Serif', serif" font-size="26" fill="#2b2b30" text-anchor="middle">cranes</text><text x="0" y="20" font-family="Fraunces, serif" font-size="52" font-weight="800" fill="#2b2b30" text-anchor="middle">100</text><text x="0" y="56" font-family="'Space Mono', monospace" font-size="11" fill="#2b2b30" text-anchor="middle">one fold, then a race</text><g transform="translate(0 86) scale(0.9)"><path d="M-36 6 L0 -6 L36 6 L6 2 L0 22 L-6 2 Z" fill="#e46f2a"></path><path d="M0 -6 L-10 -30 L-4 -10 Z" fill="#e46f2a" opacity=".8"></path></g><path class="shine" d="M-90 -40 L-40 -110 L-20 -110 L-70 -40 Z" fill="#fff" opacity="0"></path></g></g></svg>
