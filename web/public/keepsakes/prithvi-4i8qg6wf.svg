<svg xmlns="http://www.w3.org/2000/svg" viewBox="87 143 471 337" aria-hidden="true" focusable="false"><style>.joy .ksc-prithvi .tear{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-prithvi.open .tear{transform:translate(46px,22px) rotate(9deg);transition:transform 0.7s cubic-bezier(.3,1.2,.5,1) 0.2s}
.joy .ksc-prithvi .punch{opacity:0;transition:opacity .15s}
.joy .ksc-prithvi.open .punch{opacity:1;transition:opacity 0.3s ease-out calc(0.1s + var(--d, 0s))}
.joy .ksc-prithvi .tk{transform-box:fill-box;transform-origin:0% 50%}
.joy .ksc-prithvi.open .tk{animation:k22_prithvi 2.2s ease-in-out 0.2s 1}
@keyframes k22_prithvi{0%,100%{transform:rotate(0)}20%{transform:rotate(3deg)}45%{transform:rotate(-2.4000000000000004deg)}70%{transform:rotate(1.35deg)}88%{transform:rotate(-0.6000000000000001deg)}}
.joy .ksc-prithvi .note{opacity:0;transition:opacity .15s}
.joy .ksc-prithvi.open .note{opacity:1;transition:opacity 0.3s ease-out calc(0.7s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-prithvi .tear,.joy .ksc-prithvi .punch,.joy .ksc-prithvi .tk,.joy .ksc-prithvi .note{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="tk"><g transform="translate(100 190) rotate(-5)"><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="#f6eddc"></path><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="none" stroke="#00000018" stroke-width="1.2"></path><path d="M0 0 H288 V44 H0 Z" fill="#7a1a16"></path><text x="150" y="30" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">JUHU, THRUST STAGE</text><text x="150" y="92" font-family="Fraunces, serif" font-size="30" font-weight="700" fill="#24303a" text-anchor="middle">Prithvi Theatre</text><text x="20" y="126" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">row C, as close as it gets</text><text x="20" y="148" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">Irish coffee at the café first</text><text x="20" y="170" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">house full</text><g transform="translate(260 160) scale(0.6)"><path d="M-20 -14 H20 L16 18 H-16 Z" fill="#f6f3ec"></path><ellipse cy="-14" rx="20" ry="5" fill="#6b3a1f"></ellipse><path d="M20 -6 C32 -6 32 10 18 10" fill="none" stroke="#f6f3ec" stroke-width="4"></path><ellipse cy="20" rx="26" ry="5" fill="#f6f3ec" opacity=".9"></ellipse></g><path d="M300 14 V196" stroke="#5a4a3a" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="3 5"></path><g class="tear"><path d="M312 0 H400 V210 H312 A12 12 0 0 0 312 210 Z" fill="#f6eddc"></path><path d="M312 0 H400 V44 H312 Z" fill="#7a1a16"></path><g transform="translate(356 120) rotate(-90)"><text x="0" y="6" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#24303a" text-anchor="middle">ADMIT 2</text></g><path class="punch" d="M356 54 l3 7 l8 1 l-6 5 l2 8 l-7 -4 l-7 4 l2 -8 l-6 -5 l8 -1 Z" fill="#1d1a16"></path></g><text class="note" x="200" y="268" font-family="Kalam, cursive" font-size="22" fill="#fff8ea" text-anchor="middle" transform="rotate(-3 200 268)">the café after, obviously</text></g></g></svg>
