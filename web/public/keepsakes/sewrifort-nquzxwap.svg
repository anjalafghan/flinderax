<svg xmlns="http://www.w3.org/2000/svg" viewBox="107 148 406 279" aria-hidden="true" focusable="false"><style>.joy .ksc-sewrifort .card{transform-box:fill-box;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.joy .ksc-sewrifort .pb{opacity:0;transition:opacity 0s .35s}
.joy .ksc-sewrifort .pf{transition:opacity 0s .35s}
.joy .ksc-sewrifort.open .card{transform:scaleX(-1) rotate(-3deg);transition:transform .7s cubic-bezier(.4,0,.2,1) .7s}
.joy .ksc-sewrifort.open .pb{opacity:1;transition:opacity 0s 1.05s}
.joy .ksc-sewrifort.open .pf{opacity:0;transition:opacity 0s 1.05s}
.joy .ksc-sewrifort .frank{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-sewrifort.open .frank{animation:frk_sewrifort .25s ease-out .15s both}
@keyframes frk_sewrifort{0%{opacity:0;transform:scale(1.7)}100%{opacity:.85;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-sewrifort .card,.joy .ksc-sewrifort .pb,.joy .ksc-sewrifort .pf,.joy .ksc-sewrifort .frank{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><clipPath id="sewrifort-pc-c"><rect width="360" height="230" rx="6"></rect></clipPath><linearGradient id="sewrifort-pc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d8b0"></stop><stop offset="1" stop-color="#f3e1c4"></stop></linearGradient></defs><g transform="translate(120 186) rotate(-4)"><g class="card"><g class="pf"><g clip-path="url(#sewrifort-pc-c)"><rect width="360" height="230" fill="url(#sewrifort-pc-sky)"></rect><path d="M0 160 C90 150 270 170 360 156 V230 H0 Z" fill="#8a7a68"></path><g transform="translate(110 140) scale(1.6)"><path d="M-46 26 V-4 H-38 V-12 H-30 V-4 H-22 V-12 H-14 V-4 H-6 V-12 H2 V-4 H10 V-12 H18 V-4 H26 V-12 H34 V-4 H46 V26 Z" fill="#a08060"></path><path d="M-8 26 V10 a8 8 0 0 1 16 0 V26 Z" fill="#7a5c40"></path></g><g transform="translate(260 170) scale(0.8)"><path d="M-4 30 V2 M4 30 L0 2" stroke="#3a2a2a" stroke-width="2"></path><ellipse cx="0" cy="-4" rx="20" ry="12" fill="#f48aa6"></ellipse><path d="M14 -10 C24 -24 20 -40 10 -40 C2 -40 2 -30 10 -30" fill="none" stroke="#f48aa6" stroke-width="5" stroke-linecap="round"></path><path d="M10 -40 l-8 6 l6 2 Z" fill="#3a2a2a"></path></g><g transform="translate(300 176) scale(0.7)"><path d="M-4 30 V2 M4 30 L0 2" stroke="#3a2a2a" stroke-width="2"></path><ellipse cx="0" cy="-4" rx="20" ry="12" fill="#f48aa6"></ellipse><path d="M14 -10 C24 -24 20 -40 10 -40 C2 -40 2 -30 10 -30" fill="none" stroke="#f48aa6" stroke-width="5" stroke-linecap="round"></path><path d="M10 -40 l-8 6 l6 2 Z" fill="#3a2a2a"></path></g></g><rect x="8" y="8" width="344" height="214" rx="4" fill="none" stroke="#fff" stroke-width="6"></rect><path d="M14 178 H222 L230 196 L222 214 H14 Z" fill="#fbf6ea"></path><text x="24" y="204" font-family="Caveat, cursive" font-size="28" font-weight="700" fill="#2a3f7a" text-anchor="start">Sewri mudflats</text><g transform="translate(290 40) rotate(-12)"><g class="frank"><circle r="26" fill="none" stroke="#2a2a2a" stroke-width="2.4"></circle><path d="M30 -12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 -4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path></g></g></g><g class="pb" transform="translate(360 0) scale(-1 1)"><rect width="360" height="230" rx="6" fill="#fbf6ea"></rect><path d="M190.0 24 V206" stroke="#c9b48a"></path><text x="20" y="60" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">Late afternoon,</text><text x="20" y="90" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">soft light, the</text><text x="20" y="120" font-family="Kalam, cursive" font-size="16.7" fill="#2a3f7a" text-anchor="start">harbour and a line</text><text x="20" y="150" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">of flamingos.</text><rect x="290" y="18" width="52" height="62" fill="#f2e3b3" stroke="#c0392b" stroke-dasharray="3 2"></rect><g transform="translate(316 49) scale(.5)"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#f1c84b"></path></g><path d="M204.0 120 H336" stroke="#c9b48a"></path><path d="M204.0 150 H336" stroke="#c9b48a"></path><path d="M204.0 180 H336" stroke="#c9b48a"></path><text x="208.0" y="114" font-family="Kalam, cursive" font-size="18" fill="#2a3f7a" text-anchor="start">to us</text></g></g></g></svg>
