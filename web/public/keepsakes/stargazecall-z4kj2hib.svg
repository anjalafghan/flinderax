<svg xmlns="http://www.w3.org/2000/svg" viewBox="139 138 319 315" aria-hidden="true" focusable="false"><style>.joy .ksc-stargazecall .spk{opacity:0;transition:opacity .15s}
.joy .ksc-stargazecall.open .spk{opacity:1;transition:opacity 0.3s ease-out calc(0.3s + var(--d, 0s))}
.joy .ksc-stargazecall .dc-e *{fill:#1f2b4d!important;stroke:#1f2b4d!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-stargazecall .dc-s *{fill:none!important;stroke:#fff8e8!important;stroke-width:var(--w)!important;stroke-dasharray:4 5!important;fill-opacity:1!important;stroke-opacity:.8!important;opacity:1!important}
.joy .ksc-stargazecall .pc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-stargazecall.open .pc{animation:pt_stargazecall .5s ease-out}
@keyframes pt_stargazecall{40%{transform:scale(.95)}100%{transform:none}}
