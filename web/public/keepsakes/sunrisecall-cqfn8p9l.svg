<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 81 355 409" aria-hidden="true" focusable="false"><style>.joy .ksc-sunrisecall .pol{transform-box:fill-box}
.joy .ksc-sunrisecall.open .pol{animation:k113_sunrisecall .09s linear 0s 5}
@keyframes k113_sunrisecall{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-sunrisecall .dev{transition:opacity .3s}
.joy .ksc-sunrisecall.open .dev{opacity:0;transition:opacity 1.6s ease-in .5s}
@media (prefers-reduced-motion:reduce){.joy .ksc-sunrisecall .dev,.joy .ksc-sunrisecall .pol{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pol"><g transform="translate(150 120) rotate(-5)"><path d="M0 0 H300 V326 Q292 354 260 360 H0 Z" fill="#fbfaf6"></path><path d="M300 326 Q292 354 260 360 Q278 338 300 326 Z" fill="#d9d4c6"></path><clipPath id="sunrisecall-pl-c"><rect x="20" y="20" width="260" height="260"></rect></clipPath><linearGradient id="sunrisecall-pl-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7b267"></stop><stop offset="1" stop-color="#fbe3c4"></stop></linearGradient><g clip-path="url(#sunrisecall-pl-c)"><rect x="20" y="20" width="260" height="260" fill="url(#sunrisecall-pl-s)"></rect><path d="M20 210 C100 196 200 220 280 204 V280 H20 Z" fill="#3a2a40"></path><g transform="translate(20 20)"><g transform="translate(130 140) scale(1.4)"><circle r="18" fill="#f6a04d"></circle><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(0)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(45)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(90)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(135)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(180)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(225)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(270)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(315)"></path></g><g transform="translate(70 200) scale(1.2)"><path d="M-50 24 V2 H-40 V-14 H-30 V4 H-22 V-30 H-12 V-6 H-4 V-20 H8 V-40 L12 -48 L16 -40 V0 H24 V-12 H34 V6 H42 V-8 H50 V24 Z" fill="#3a2a40"></path></g><g transform="translate(200 202) scale(1.1)"><path d="M-50 24 V2 H-40 V-14 H-30 V4 H-22 V-30 H-12 V-6 H-4 V-20 H8 V-40 L12 -48 L16 -40 V0 H24 V-12 H34 V6 H42 V-8 H50 V24 Z" fill="#4a3a50"></path></g></g></g><rect class="dev" x="20" y="20" width="260" height="260" fill="#2b2a2e"></rect><text x="150.0" y="330" font-family="Caveat, cursive" font-size="30" font-weight="700" fill="#2b2b30" text-anchor="middle">then back to sleep</text></g></g></svg>
