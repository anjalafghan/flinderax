<svg xmlns="http://www.w3.org/2000/svg" viewBox="155 78 302 346" aria-hidden="true" focusable="false"><style>.joy .ksc-polaroidshoot .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-polaroidshoot.open .pc{animation:k61_polaroidshoot 2.2s ease-in-out 0s 1}
@keyframes k61_polaroidshoot{0%,100%{transform:rotate(0)}20%{transform:rotate(10deg)}45%{transform:rotate(-8.0deg)}70%{transform:rotate(4.5deg)}88%{transform:rotate(-2.0deg)}}
.joy .ksc-polaroidshoot .dc-e *{fill:#eef3f6!important;stroke:#eef3f6!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
@media (prefers-reduced-motion:reduce){.joy .ksc-polaroidshoot .pc{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g class="ring"><circle cx="0" cy="-174.0" r="24" fill="none" stroke="#a9adb4" stroke-width="6"></circle><path d="M0 -150.0 V-38.0" stroke="#a9adb4" stroke-width="5" stroke-dasharray="7 3"></path></g><g class="dc-e"><g transform="translate(0 -20) scale(3.6)" style="--w:4.44px"><rect x="-30" y="-16" width="60" height="38" rx="6" fill="#f4ecd8"></rect><rect x="-14" y="-24" width="20" height="10" rx="2" fill="#f4ecd8"></rect><circle cy="3" r="12" fill="#1e6a66"></circle><circle cy="3" r="6" fill="#f4ecd8"></circle></g><g transform="translate(0 80) rotate(-2)" style="--w:8px"><path d="M-137.0 -20.0 H137.0 L127.0 2 L137.0 28.0 H-137.0 L-127.0 2 Z" fill="#000" opacity=".85"></path><path d="M-125.0 -24.0 H125.0 V24.0 Q0 30.0 -125.0 24.0 Z" fill="#000"></path></g></g><g transform="translate(0 -20) scale(3.6)"><rect x="-30" y="-16" width="60" height="38" rx="6" fill="#f4ecd8"></rect><rect x="-14" y="-24" width="20" height="10" rx="2" fill="#f4ecd8"></rect><circle cy="3" r="12" fill="#1e6a66"></circle><circle cy="3" r="6" fill="#f4ecd8"></circle></g><g transform="translate(0 80) rotate(-2)"><path d="M-137.0 -20.0 H137.0 L127.0 2 L137.0 28.0 H-137.0 L-127.0 2 Z" fill="#1e6a66" opacity=".85"></path><path d="M-125.0 -24.0 H125.0 V24.0 Q0 30.0 -125.0 24.0 Z" fill="#1e6a66"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="20.3" fill="#fbf8f1" text-anchor="middle">photoshoot at home</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">10 shots, 2 good</text></g></g></g></svg>
