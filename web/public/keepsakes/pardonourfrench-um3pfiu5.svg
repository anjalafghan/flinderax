<svg xmlns="http://www.w3.org/2000/svg" viewBox="154 107 302 307" aria-hidden="true" focusable="false"><style>.joy .ksc-pardonourfrench .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-pardonourfrench.open .pc{animation:k37_pardonourfrench 2.2s ease-in-out 0s 1}
@keyframes k37_pardonourfrench{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-pardonourfrench .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-pardonourfrench .shine{opacity:0}
.joy .ksc-pardonourfrench.open .shine{animation:shn_pardonourfrench 1s ease-out .15s}
@keyframes shn_pardonourfrench{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-pardonourfrench .shine,.joy .ksc-pardonourfrench .pc{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g opacity=".9"><path d="M-30 -8 H30" stroke="#8a8f96" stroke-width="4"></path></g><g class="dc-e"><g transform="translate(0 -20) scale(3.6)" style="--w:2.78px"><path d="M-34 20 L30 -20 V20 Z" fill="#f2e3b3"></path><path d="M-34 20 L30 -20 V-8 L-30 26 Z" fill="#8a5a2e"></path><path d="M-34 6 L30 -34 V-20 L-34 20 Z" fill="#8a5a2e" opacity=".8"></path><circle cx="20" cy="-34" r="6" fill="#d6334a"></circle></g><g transform="translate(0 70) rotate(-2)" style="--w:5px"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#000" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#000"></path></g></g><g transform="translate(0 -20) scale(3.6)"><path d="M-34 20 L30 -20 V20 Z" fill="#f2e3b3"></path><path d="M-34 20 L30 -20 V-8 L-30 26 Z" fill="#8a5a2e"></path><path d="M-34 6 L30 -34 V-20 L-34 20 Z" fill="#8a5a2e" opacity=".8"></path><circle cx="20" cy="-34" r="6" fill="#d6334a"></circle></g><g transform="translate(0 70) rotate(-2)"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#43244a" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#43244a"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="21.5" fill="#fbf8f1" text-anchor="middle">Pardon Our French</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">brown butter cake</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
