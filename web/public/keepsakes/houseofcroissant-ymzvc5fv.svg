<svg xmlns="http://www.w3.org/2000/svg" viewBox="104 142 360 272" aria-hidden="true" focusable="false"><style>.joy .ksc-houseofcroissant .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-houseofcroissant .pc{transform-box:fill-box;transform-origin:0% 100%}
.joy .ksc-houseofcroissant.open .pc{transform:rotate(-7deg) translate(-4px,-14px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.joy .ksc-houseofcroissant .pc{transition:transform .3s}
.joy .ksc-houseofcroissant .shine{opacity:0}
.joy .ksc-houseofcroissant.open .shine{animation:shn_houseofcroissant 1s ease-out .2s}
@keyframes shn_houseofcroissant{0%{opacity:0;transform:translateX(0)}30%{opacity:.45}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-houseofcroissant .pc,.joy .ksc-houseofcroissant .shine{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g class="dc-e"><g transform="translate(0 -20) scale(4.2)" style="--w:4.29px"><path d="M-36 8 C-30 -20 30 -20 36 8 C26 0 -26 0 -36 8 Z" fill="#d9963a"></path><path d="M-18 -8 L-12 6 M0 -12 V4 M18 -8 L12 6" stroke="#b5702a" stroke-width="3" stroke-linecap="round"></path></g><g transform="translate(0 70) rotate(-2)" style="--w:9px"><path d="M-137.0 -20.0 H137.0 L127.0 2 L137.0 28.0 H-137.0 L-127.0 2 Z" fill="#000" opacity=".85"></path><path d="M-125.0 -24.0 H125.0 V24.0 Q0 30.0 -125.0 24.0 Z" fill="#000"></path></g></g><g transform="translate(0 -20) scale(4.2)"><path d="M-36 8 C-30 -20 30 -20 36 8 C26 0 -26 0 -36 8 Z" fill="#d9963a"></path><path d="M-18 -8 L-12 6 M0 -12 V4 M18 -8 L12 6" stroke="#b5702a" stroke-width="3" stroke-linecap="round"></path></g><g transform="translate(0 70) rotate(-2)"><path d="M-137.0 -20.0 H137.0 L127.0 2 L137.0 28.0 H-137.0 L-127.0 2 Z" fill="#5b3a1f" opacity=".85"></path><path d="M-125.0 -24.0 H125.0 V24.0 Q0 30.0 -125.0 24.0 Z" fill="#5b3a1f"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="20.3" fill="#fbf8f1" text-anchor="middle">House of Croissant</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">one plain, one almond</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
