<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 169 304 332" aria-hidden="true" focusable="false"><style>.joy .ksc-farzi .fx{opacity:0;transform-box:fill-box}
.joy .ksc-farzi.open .fx{animation:k271_farzi 1.8s ease-out var(--d, 0s) 3}
@keyframes k271_farzi{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-farzi .lb{transform-box:fill-box}
.joy .ksc-farzi.open .lb{animation:k274_farzi .09s linear 0s 4}
@keyframes k274_farzi{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-farzi .fx,.joy .ksc-farzi .lb{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><linearGradient id="farzi-lb-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".35"></stop><stop offset=".25" stop-color="#fff" stop-opacity="0"></stop><stop offset=".85" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity=".2"></stop></linearGradient></defs><g class="lb"><g transform="translate(290 330) rotate(-4)"><path d="M-130 -100 L-100 -140 H100 L130 -100 V150 H-130 Z" fill="#2b2d33"></path><rect x="-110" y="-86" width="220" height="200" rx="6" fill="#f6efe0"></rect><rect x="-104" y="-80" width="208" height="188" rx="4" fill="none" stroke="#3a2a20" stroke-opacity=".4"></rect><text x="0" y="-46" font-family="'Young Serif', serif" font-size="24" fill="#3a2a20" text-anchor="middle">Farzi Café</text><text x="0" y="-16" font-family="Kalam, cursive" font-size="16" fill="#3a2a20" text-anchor="middle">Oberoi Mall</text><text x="0" y="6" font-family="Kalam, cursive" font-size="16" fill="#3a2a20" text-anchor="middle">the smoke, the show</text><text x="0" y="28" font-family="Kalam, cursive" font-size="16" fill="#3a2a20" text-anchor="middle">the food was good too</text><path class="fx" style="--d:0.0s" d="M-30 -200 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="fx" style="--d:0.4s" d="M0 -200 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="fx" style="--d:0.8s" d="M30 -200 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path></g></g></svg>
