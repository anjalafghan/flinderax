<svg xmlns="http://www.w3.org/2000/svg" viewBox="158 -5 303 536" aria-hidden="true" focusable="false"><style>.joy .ksc-flamingo .ly{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-flamingo.open .ly{animation:k24_flamingo 2.2s ease-in-out 0s 1}
@keyframes k24_flamingo{0%,100%{transform:rotate(0)}20%{transform:rotate(6deg)}45%{transform:rotate(-4.800000000000001deg)}70%{transform:rotate(2.7deg)}88%{transform:rotate(-1.2000000000000002deg)}}
.joy .ksc-flamingo .glow{opacity:0}
.joy .ksc-flamingo.open .glow{animation:gl_flamingo 1.2s ease-out .3s}
@keyframes gl_flamingo{30%{opacity:.35}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.joy .ksc-flamingo .ly,.joy .ksc-flamingo .glow{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="ly"><g transform="translate(300 160) rotate(-3)"><path d="M-40 -150 C-60 -80 -60 -30 -50 0 M40 -150 C60 -80 60 -30 50 0" fill="none" stroke="#111111" stroke-width="12"></path><rect x="-16" y="-10" width="32" height="24" rx="4" fill="#9aa0a6"></rect><path d="M-130 30 Q-130 0 -100 0 H100 Q130 0 130 30 V300 Q130 330 100 330 H30 L0 352 L-30 330 H-100 Q-130 330 -130 300 Z" fill="#f48aa6"></path><rect x="-30" y="16" width="60" height="10" rx="5" fill="#00000044"></rect><text x="0" y="90" font-family="Fraunces, serif" font-size="30" font-weight="800" fill="#3a1a28" text-anchor="middle">Flamingo boat</text><text x="0" y="116" font-family="'Space Mono', monospace" font-size="11" fill="#3a1a28" text-anchor="middle">Thane Creek, high tide</text><text x="0" y="220" font-family="'Permanent Marker', cursive" font-size="44" fill="#3a1a28" text-anchor="middle">pink!</text><g transform="translate(-60 290) scale(0.8)"><path d="M-4 30 V2 M4 30 L0 2" stroke="#3a1a28" stroke-width="2"></path><ellipse cx="0" cy="-4" rx="20" ry="12" fill="#ffffff"></ellipse><path d="M14 -10 C24 -24 20 -40 10 -40 C2 -40 2 -30 10 -30" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"></path><path d="M10 -40 l-8 6 l6 2 Z" fill="#3a1a28"></path></g><g transform="translate(50 300) scale(0.6)"><path d="M-44 -8 q11 -8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></path><path d="M-44 6 q11 -8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></path><path d="M-44 20 q11 -8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></path></g><path class="glow" d="M-130 30 Q-130 0 -100 0 H100 Q130 0 130 30 V300 Q130 330 100 330 H30 L0 352 L-30 330 H-100 Q-130 330 -130 300 Z" fill="#fff"></path></g></g></svg>
