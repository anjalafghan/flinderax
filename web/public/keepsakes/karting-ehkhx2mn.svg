<svg xmlns="http://www.w3.org/2000/svg" viewBox="117 -41 426 553" aria-hidden="true" focusable="false"><style>.joy .ksc-karting .paper{transform:translateY(-150px);transition:transform .3s}
.joy .ksc-karting .lap,.joy .ksc-karting .star{opacity:0}
.joy .ksc-karting .wave{transform-box:fill-box;transform-origin:0 50%}
.joy .ksc-karting.open .paper{transform:none;transition:transform 1.8s steps(14)}
.joy .ksc-karting.open .lap{opacity:1;transition:opacity 0s var(--d)}
.joy .ksc-karting.open .star{opacity:1;transition:opacity .1s 2s}
.joy .ksc-karting.open .busy{animation:bl_karting .2s steps(2) 9}
.joy .ksc-karting.open .wave{animation:flap_karting .6s ease-in-out 1.8s 3}
@keyframes bl_karting{50%{opacity:0}}
@keyframes flap_karting{50%{transform:skewY(8deg) scaleX(.9)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-karting .paper,.joy .ksc-karting .lap,.joy .ksc-karting .star,.joy .ksc-karting .busy,.joy .ksc-karting .wave{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><filter id="karting-k-g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0.1 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter><clipPath id="karting-k-feed"><rect x="0" y="0" width="260" height="420"></rect></clipPath></defs>
