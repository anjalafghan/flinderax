<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 245 289" aria-hidden="true" focusable="false"><style>.joy .ksc-janjira .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-janjira .fb{opacity:0}
.joy .ksc-janjira.open .cf{animation:cfs_janjira .275s linear 5}
.joy .ksc-janjira.open .fa{animation:cfa_janjira 1.375s step-end both}
.joy .ksc-janjira.open .fb{animation:cfb_janjira 1.375s step-end both}
@keyframes cfs_janjira{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_janjira{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_janjira{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-janjira.open .toss{animation:tossup_janjira 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_janjira{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-janjira .cf,.joy .ksc-janjira .fa,.joy .ksc-janjira .fb,.joy .ksc-janjira .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#c9ced3" stroke="#6b7280" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#6b7280" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#1d2b30" text-anchor="middle">Rajpuri jetty</text><text x="0" y="16" font-family="Fraunces, serif" font-size="40" font-weight="700" fill="#1d2b30" text-anchor="middle">Janjira</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#1d2b30" text-anchor="middle">by sailboat</text><g transform="translate(0 -78) scale(0.5)"><path d="M-34 6 H34 L24 22 H-24 Z" fill="#c8362a"></path><path d="M0 4 V-34 L22 0 Z" fill="#f4ecd8"></path><path d="M0 4 V-34" stroke="#3a2a1a" stroke-width="2"></path></g></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="24.2" font-weight="700" fill="#1d2b30" text-anchor="middle">the sea fort</text><text x="0" y="36" font-family="Kalam, cursive" font-size="18" fill="#1d2b30" text-anchor="middle">never captured</text></g></g></g></g></svg>
