<svg xmlns="http://www.w3.org/2000/svg" viewBox="57 158 465 384" aria-hidden="true" focusable="false"><style>.joy .ksc-breakfastbed .sm{opacity:0;transform-box:fill-box}
.joy .ksc-breakfastbed.open .sm{animation:k136_breakfastbed 1.8s ease-out var(--d, 0s) 3}
@keyframes k136_breakfastbed{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-breakfastbed .gn{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-breakfastbed.open .gn{animation:k137_breakfastbed .5s cubic-bezier(.3,1.6,.5,1) calc(0.3s + var(--d, 0s)) both}
@keyframes k137_breakfastbed{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-breakfastbed .sm,.joy .ksc-breakfastbed .gn{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><rect x="90" y="170" width="420" height="300" rx="26" fill="#f6efe0"></rect><rect x="108" y="188" width="384" height="264" rx="18" fill="none" stroke="#c9b48a" stroke-width="3"></rect><g transform="translate(250 320) scale(2.6)"><ellipse rx="40" ry="16" fill="#f6f3ec"></ellipse><ellipse rx="28" ry="10" fill="none" stroke="#c9c4b8"></ellipse><ellipse cy="-3" rx="18" ry="7" fill="#f2c14e"></ellipse></g><g transform="translate(420 270) scale(1.6)"><path d="M-20 -14 H20 L16 18 H-16 Z" fill="#f6f3ec"></path><ellipse cy="-14" rx="20" ry="5" fill="#6b3a1f"></ellipse><path d="M20 -6 C32 -6 32 10 18 10" fill="none" stroke="#f6f3ec" stroke-width="4"></path><ellipse cy="20" rx="26" ry="5" fill="#f6f3ec" opacity=".9"></ellipse></g><g transform="translate(420 390) scale(1.2)"><ellipse cy="-14" rx="8" ry="14" fill="#f29ab8" transform="rotate(0)"></ellipse><ellipse cy="-14" rx="8" ry="14" fill="#f29ab8" transform="rotate(45)"></ellipse><ellipse cy="-14" rx="8" ry="14" fill="#f29ab8" transform="rotate(90)"></ellipse><ellipse cy="-14" rx="8" ry="14" fill="#f29ab8" transform="rotate(135)"></ellipse><ellipse cy="-14" rx="8" ry="14" fill="#f29ab8" transform="rotate(180)"></ellipse><ellipse cy="-14" rx="8" ry="14" fill="#f29ab8" transform="rotate(225)"></ellipse><ellipse cy="-14" rx="8" ry="14" fill="#f29ab8" transform="rotate(270)"></ellipse><ellipse cy="-14" rx="8" ry="14" fill="#f29ab8" transform="rotate(315)"></ellipse><circle r="8" fill="#c2185b"></circle></g><path class="sm" style="--d:0.00s" d="M240 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M300 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M360 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><g transform="translate(70 470) rotate(-6)"><path d="M0 0 H210 V60 H0 Z" fill="#fbf6ec"></path><text x="105" y="28" font-family="'Young Serif', serif" font-size="18" fill="#5a1d0c" text-anchor="middle">Breakfast in bed</text><text x="105" y="46" font-family="'Space Mono', monospace" font-size="9" fill="#4a3a30" text-anchor="middle">Saturday you, Sunday me</text></g></svg>
