<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 244 288" aria-hidden="true" focusable="false"><style>.joy .ksc-ludoonline .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-ludoonline .fb{opacity:0}
.joy .ksc-ludoonline.open .cf{animation:cfs_ludoonline .275s linear 5}
.joy .ksc-ludoonline.open .fa{animation:cfa_ludoonline 1.375s step-end both}
.joy .ksc-ludoonline.open .fb{animation:cfb_ludoonline 1.375s step-end both}
@keyframes cfs_ludoonline{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_ludoonline{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_ludoonline{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-ludoonline.open .toss{animation:tossup_ludoonline 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_ludoonline{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-ludoonline .cf,.joy .ksc-ludoonline .fa,.joy .ksc-ludoonline .fb,.joy .ksc-ludoonline .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#c0392b" stroke="#7a1a16" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#7a1a16" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#fff" text-anchor="middle">online, Ludo</text><text x="0" y="16" font-family="Fraunces, serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">home!</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#fff" text-anchor="middle">loser picks the movie</text></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">six!</text><text x="0" y="36" font-family="Kalam, cursive" font-size="18" fill="#fff" text-anchor="middle">roll again</text></g></g></g></g></svg>
