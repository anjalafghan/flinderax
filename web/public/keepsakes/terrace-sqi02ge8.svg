<svg xmlns="http://www.w3.org/2000/svg" viewBox="126 136 327 327" aria-hidden="true" focusable="false"><style>.joy .ksc-terrace .ring{opacity:0}
.joy .ksc-terrace.open .ring{opacity:1;transition:opacity .4s 1.1s}
.joy .ksc-terrace .gl{transform-box:fill-box;opacity:0}
.joy .ksc-terrace.open .gl{animation:gld_terrace 1.6s ease-in-out both}
@keyframes gld_terrace{0%{opacity:0;transform:translate(60px,-160px)}35%{opacity:1;transform:translate(0,0)}70%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(80px,-140px)}}
.joy .ksc-terrace .cs{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-terrace.open .cs{animation:csp_terrace .7s ease-out .9s}
@keyframes csp_terrace{40%{transform:rotate(9deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-terrace .ring,.joy .ksc-terrace .gl,.joy .ksc-terrace .cs{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cs"><g transform="translate(290 300) rotate(-8)"><circle cx="132.0" cy="0.0" r="16" fill="#c0392b"></circle><circle cx="124.0" cy="45.1" r="16" fill="#c0392b"></circle><circle cx="101.1" cy="84.8" r="16" fill="#c0392b"></circle><circle cx="66.0" cy="114.3" r="16" fill="#c0392b"></circle><circle cx="22.9" cy="130.0" r="16" fill="#c0392b"></circle><circle cx="-22.9" cy="130.0" r="16" fill="#c0392b"></circle><circle cx="-66.0" cy="114.3" r="16" fill="#c0392b"></circle><circle cx="-101.1" cy="84.8" r="16" fill="#c0392b"></circle><circle cx="-124.0" cy="45.1" r="16" fill="#c0392b"></circle><circle cx="-132.0" cy="0.0" r="16" fill="#c0392b"></circle><circle cx="-124.0" cy="-45.1" r="16" fill="#c0392b"></circle><circle cx="-101.1" cy="-84.8" r="16" fill="#c0392b"></circle><circle cx="-66.0" cy="-114.3" r="16" fill="#c0392b"></circle><circle cx="-22.9" cy="-130.0" r="16" fill="#c0392b"></circle><circle cx="22.9" cy="-130.0" r="16" fill="#c0392b"></circle><circle cx="66.0" cy="-114.3" r="16" fill="#c0392b"></circle><circle cx="101.1" cy="-84.8" r="16" fill="#c0392b"></circle><circle cx="124.0" cy="-45.1" r="16" fill="#c0392b"></circle><circle r="134" fill="#c0392b"></circle><text x="0" y="-30" font-family="Fraunces, serif" font-size="36" font-weight="800" fill="#fff6ea" text-anchor="middle">The Terrace</text><text x="0" y="0" font-family="'Space Mono', monospace" font-size="12" fill="#fff6ea" text-anchor="middle">6th floor, Lokhandwala</text><circle class="ring" r="48" cx="56" cy="74" fill="none" stroke="#6b4a2a" stroke-opacity=".45" stroke-width="7"></circle></g></g><g class="gl"><g transform="translate(340 320) scale(2.4)"><path d="M-6 -36 H6 V-22 C16 -16 16 -8 16 0 V30 H-16 V0 C-16 -8 -16 -16 -6 -22 Z" fill="#2f6d57"></path><rect x="-14" y="2" width="28" height="18" fill="#f6efe0"></rect></g></g></svg>
