<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 58 414 431" aria-hidden="true" focusable="false"><style>.joy .ksc-houserules .wax{opacity:0;transition:opacity .15s}
.joy .ksc-houserules.open .wax{opacity:1;transition:opacity 0.3s ease-out calc(0.8s + var(--d, 0s))}
.joy .ksc-houserules .hrc{transition:height .4s}
.joy .ksc-houserules.open .hrc{height:340px;transition:height .8s ease-out .1s}
.joy .ksc-houserules .bot{transform-box:view-box;transition:transform .4s}
.joy .ksc-houserules.open .bot{transform:translateY(150px);transition:transform .8s ease-out .1s}
@media (prefers-reduced-motion:reduce){.joy .ksc-houserules .hrc,.joy .ksc-houserules .bot,.joy .ksc-houserules .wax{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(300 250) rotate(-4)"><clipPath id="houserules-hr-c"><rect class="hrc" x="-150" y="-150" width="300" height="190"></rect></clipPath><g clip-path="url(#houserules-hr-c)"><rect x="-150" y="-150" width="300" height="330" fill="#f3e6c8"></rect><text x="0" y="-110" font-family="Fraunces, serif" font-size="30" font-weight="700" fill="#5a2d16" text-anchor="middle">House Rules</text><text x="-120" y="-70" font-family="Kalam, cursive" font-size="18" fill="#3a2414" text-anchor="start">1. shoes off, always</text><text x="-120" y="-40" font-family="Kalam, cursive" font-size="18" fill="#3a2414" text-anchor="start">2. last chai is shared</text><text x="-120" y="-10" font-family="Kalam, cursive" font-size="18" fill="#3a2414" text-anchor="start">3. no phones at dinner</text><text x="-120" y="20" font-family="Kalam, cursive" font-size="18" fill="#3a2414" text-anchor="start">4. sorry before sleep</text><text x="-120" y="50" font-family="Kalam, cursive" font-size="18" fill="#3a2414" text-anchor="start">5. Sunday is ours</text><path d="M-120 140 c20 -16 30 6 46 -6 s20 -10 30 4 M40 140 c10 -20 26 -2 34 -12 c8 -8 16 6 30 -4" fill="none" stroke="#2a3f7a" stroke-width="3"></path><text x="-70" y="164" font-family="'Space Mono', monospace" font-size="10" fill="#5a2d16" text-anchor="middle">me</text><text x="70" y="164" font-family="'Space Mono', monospace" font-size="10" fill="#5a2d16" text-anchor="middle">you</text></g><g><rect x="-166" y="-168" width="332" height="36" rx="18" fill="#e3cfa4"></rect><rect x="-166" y="-156" width="332" height="6" fill="#fff" opacity=".3"></rect><circle cx="-170" cy="-150" r="12" fill="#7a3a1a"></circle><circle cx="170" cy="-150" r="12" fill="#7a3a1a"></circle></g><g class="bot"><rect x="-166" y="30" width="332" height="36" rx="18" fill="#e3cfa4"></rect><rect x="-166" y="42" width="332" height="6" fill="#fff" opacity=".3"></rect><circle cx="-170" cy="48" r="12" fill="#7a3a1a"></circle><circle cx="170" cy="48" r="12" fill="#7a3a1a"></circle></g><g class="wax" transform="translate(110 150)"><circle r="22" fill="#a8321f"></circle><text x="0" y="6" font-family="'Young Serif', serif" font-size="16" fill="#fbe6d6" text-anchor="middle">us</text></g></g></svg>
