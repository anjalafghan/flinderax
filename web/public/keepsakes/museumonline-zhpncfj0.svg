<svg xmlns="http://www.w3.org/2000/svg" viewBox="159 149 297 305" aria-hidden="true" focusable="false"><style>.joy .ksc-museumonline .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-museumonline.open .pc{animation:k44_museumonline 2.2s ease-in-out 0s 1}
@keyframes k44_museumonline{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-museumonline .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-museumonline .shine{opacity:0}
.joy .ksc-museumonline.open .shine{animation:shn_museumonline 1s ease-out .15s}
@keyframes shn_museumonline{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-museumonline .shine,.joy .ksc-museumonline .pc{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g opacity=".9"><path d="M-30 -8 H30" stroke="#8a8f96" stroke-width="4"></path></g><g class="dc-e"><g transform="translate(0 -40) scale(3.0)" style="--w:3.33px"><path d="M-30 10 C-30 -40 30 -40 30 10" fill="none" stroke="#3a2a5a" stroke-width="7"></path><rect x="-38" y="0" width="16" height="30" rx="6" fill="#e9c46a"></rect><rect x="22" y="0" width="16" height="30" rx="6" fill="#e9c46a"></rect></g><g transform="translate(0 30) scale(2.0)" style="--w:5.00px"><rect x="-30" y="-26" width="60" height="38" rx="3" fill="#9aa0a6"></rect><rect x="-26" y="-22" width="52" height="30" fill="#f6efe0"></rect><path d="M-40 12 H40 L34 20 H-34 Z" fill="#9aa0a6"></path></g><g transform="translate(0 110) rotate(-2)" style="--w:5px"><path d="M-134.52 -20.0 H134.52 L124.52000000000001 2 L134.52 28.0 H-134.52 L-124.52000000000001 2 Z" fill="#000" opacity=".85"></path><path d="M-122.52000000000001 -24.0 H122.52000000000001 V24.0 Q0 30.0 -122.52000000000001 24.0 Z" fill="#000"></path></g></g><g transform="translate(0 -40) scale(3.0)"><path d="M-30 10 C-30 -40 30 -40 30 10" fill="none" stroke="#3a2a5a" stroke-width="7"></path><rect x="-38" y="0" width="16" height="30" rx="6" fill="#e9c46a"></rect><rect x="22" y="0" width="16" height="30" rx="6" fill="#e9c46a"></rect></g><g transform="translate(0 30) scale(2.0)"><rect x="-30" y="-26" width="60" height="38" rx="3" fill="#9aa0a6"></rect><rect x="-26" y="-22" width="52" height="30" fill="#f6efe0"></rect><path d="M-40 12 H40 L34 20 H-34 Z" fill="#9aa0a6"></path></g><g transform="translate(0 110) rotate(-2)"><path d="M-134.52 -20.0 H134.52 L124.52000000000001 2 L134.52 28.0 H-134.52 L-124.52000000000001 2 Z" fill="#3a2a5a" opacity=".85"></path><path d="M-122.52000000000001 -24.0 H122.52000000000001 V24.0 Q0 30.0 -122.52000000000001 24.0 Z" fill="#3a2a5a"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">museum, online</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">room 4 was our favourite</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
