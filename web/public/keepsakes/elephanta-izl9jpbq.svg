<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 143 471 269" aria-hidden="true" focusable="false"><style>.joy .ksc-elephanta .tear{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-elephanta.open .tear{transform:translate(46px,22px) rotate(9deg);transition:transform 0.7s cubic-bezier(.3,1.2,.5,1) 0.2s}
.joy .ksc-elephanta .punch{opacity:0;transition:opacity .15s}
.joy .ksc-elephanta.open .punch{opacity:1;transition:opacity 0.3s ease-out calc(0.1s + var(--d, 0s))}
.joy .ksc-elephanta .tk{transform-box:fill-box;transform-origin:0% 50%}
.joy .ksc-elephanta.open .tk{animation:k23_elephanta 2.2s ease-in-out 0.2s 1}
@keyframes k23_elephanta{0%,100%{transform:rotate(0)}20%{transform:rotate(3deg)}45%{transform:rotate(-2.4000000000000004deg)}70%{transform:rotate(1.35deg)}88%{transform:rotate(-0.6000000000000001deg)}}
.joy .ksc-elephanta .note{opacity:0;transition:opacity .15s}
.joy .ksc-elephanta.open .note{opacity:1;transition:opacity 0.3s ease-out calc(0.7s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-elephanta .tear,.joy .ksc-elephanta .punch,.joy .ksc-elephanta .tk,.joy .ksc-elephanta .note{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="tk"><g transform="translate(100 190) rotate(-5)"><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="#eef4f6"></path><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="none" stroke="#00000018" stroke-width="1.2"></path><path d="M0 0 H288 V44 H0 Z" fill="#2f6db5"></path><text x="150" y="30" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">FERRY, ONE HOUR EACH WAY</text><text x="150" y="92" font-family="Fraunces, serif" font-size="23.6" font-weight="700" fill="#24303a" text-anchor="middle">Gateway to Elephanta</text><text x="20" y="126" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">first boat around 9</text><text x="20" y="148" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">the toy train up the jetty</text><text x="20" y="170" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">closed Mondays</text><g transform="translate(250 160) scale(0.7)"><path d="M-44 8 H44 L36 24 H-36 Z" fill="#2f6db5"></path><rect x="-30" y="-10" width="56" height="18" rx="3" fill="#f4ecd8"></rect><rect x="-12" y="-22" width="22" height="12" rx="2" fill="#f4ecd8"></rect><g fill="#2f6db5"><rect x="-24" y="-6" width="8" height="7"></rect><rect x="-10" y="-6" width="8" height="7"></rect><rect x="4" y="-6" width="8" height="7"></rect></g></g><g transform="translate(210 150) scale(0.45)"><path d="M-50 26 C-46 -20 -20 -36 0 -36 C20 -36 46 -20 50 26 Z" fill="#9a8a78"></path><path d="M-20 26 C-20 0 -10 -12 0 -12 C10 -12 20 0 20 26 Z" fill="#2a221a"></path><path d="M-36 0 h10 M28 -6 h10 M-30 14 h8" stroke="#2a221a" stroke-width="2" opacity=".5"></path></g><path d="M300 14 V196" stroke="#5a4a3a" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="3 5"></path><g class="tear"><path d="M312 0 H400 V210 H312 A12 12 0 0 0 312 210 Z" fill="#eef4f6"></path><path d="M312 0 H400 V44 H312 Z" fill="#2f6db5"></path><g transform="translate(356 120) rotate(-90)"><text x="0" y="6" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#24303a" text-anchor="middle">RETURN</text></g><path class="punch" d="M356 54 l3 7 l8 1 l-6 5 l2 8 l-7 -4 l-7 4 l2 -8 l-6 -5 l8 -1 Z" fill="#1d1a16"></path></g></g></g></svg>
