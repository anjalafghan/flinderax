<svg xmlns="http://www.w3.org/2000/svg" viewBox="63 114 490 348" aria-hidden="true" focusable="false"><style>.joy .ksc-nextvisit .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-nextvisit.open .mk{stroke-dashoffset:0;transition:stroke-dashoffset 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-nextvisit .fl1,.joy .ksc-nextvisit .fl2{transform-box:fill-box;transition:transform .45s .15s}
.joy .ksc-nextvisit .fl1{transform-origin:0% 50%}
.joy .ksc-nextvisit .fl2{transform-origin:100% 50%}
.joy .ksc-nextvisit.open .fl1,.joy .ksc-nextvisit.open .fl2{transform:scaleX(0);transition:transform .5s cubic-bezier(.4,0,.2,1) .25s}
.joy .ksc-nextvisit .mid{transition:opacity .25s .5s}
.joy .ksc-nextvisit.open .mid{opacity:0;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.joy .ksc-nextvisit .fl1,.joy .ksc-nextvisit .fl2,.joy .ksc-nextvisit .mid,.joy .ksc-nextvisit .mk{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(75 150) rotate(-3)"><path d="M0 8 L150 0 L300 8 L450 0 V300 L300 292 L150 300 L0 292 Z" fill="#f6efe0"></path><path d="M150 10 V290" stroke="#2b2b30" stroke-opacity=".2"></path><path d="M300 10 V290" stroke="#2b2b30" stroke-opacity=".2"></path><text x="75.0" y="70" font-family="'Young Serif', serif" font-size="15" fill="#2b2b30" text-anchor="middle">9 am, chai</text><text x="75.0" y="100" font-family="'Young Serif', serif" font-size="14.5" fill="#2b2b30" text-anchor="middle">11, the market</text><text x="75.0" y="130" font-family="'Young Serif', serif" font-size="15" fill="#2b2b30" text-anchor="middle">1 pm, lunch</text><text x="225.0" y="70" font-family="'Young Serif', serif" font-size="15" fill="#2b2b30" text-anchor="middle">4, the sea</text><text x="225.0" y="100" font-family="'Young Serif', serif" font-size="15" fill="#2b2b30" text-anchor="middle">6, sunset</text><text x="225.0" y="130" font-family="'Young Serif', serif" font-size="15" fill="#2b2b30" text-anchor="middle">8, dinner</text><text x="375.0" y="70" font-family="'Young Serif', serif" font-size="15" fill="#2b2b30" text-anchor="middle">day two</text><text x="375.0" y="100" font-family="'Young Serif', serif" font-size="15" fill="#2b2b30" text-anchor="middle">no plans</text><text x="375.0" y="130" font-family="'Young Serif', serif" font-size="15" fill="#2b2b30" text-anchor="middle">at all</text><path class="mk" style="--d:0.70s" pathLength="1" d="M10 62 l6 7 l12 -16" fill="none" stroke="#2f6db5" stroke-width="2.6" stroke-linecap="round"></path><path class="mk" style="--d:0.95s" pathLength="1" d="M160 92 l6 7 l12 -16" fill="none" stroke="#2f6db5" stroke-width="2.6" stroke-linecap="round"></path><path class="mk" style="--d:1.20s" pathLength="1" d="M310 122 l6 7 l12 -16" fill="none" stroke="#2f6db5" stroke-width="2.6" stroke-linecap="round"></path><g class="fl1"><rect x="0" width="150" height="300" fill="#2f6db5"></rect><rect x="8" y="8" width="134" height="284" fill="none" stroke="#fff" stroke-opacity=".5"></rect></g><g class="fl2"><rect x="300" width="150" height="300" fill="#2f6db5"></rect><rect x="308" y="8" width="134" height="284" fill="none" stroke="#fff" stroke-opacity=".5"></rect></g><g class="mid"><rect x="150" width="150" height="300" fill="#2f6db5"></rect><rect x="158" y="8" width="134" height="284" fill="none" stroke="#fff" stroke-opacity=".5"></rect><g><text x="225.0" y="120" font-family="Fraunces, serif" font-size="24.4" font-weight="700" fill="#fff" text-anchor="middle">Next visit</text><text x="225.0" y="150" font-family="'Space Mono', monospace" font-size="10" fill="#fff" text-anchor="middle">hour by hour</text></g></g></g></svg>
