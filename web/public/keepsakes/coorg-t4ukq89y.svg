<svg xmlns="http://www.w3.org/2000/svg" viewBox="127 55 333 475" aria-hidden="true" focusable="false"><style>.joy .ksc-coorg .fx{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-coorg.open .fx{animation:k255_coorg .5s cubic-bezier(.3,1.6,.5,1) calc(0.2s + var(--d, 0s)) both}
@keyframes k255_coorg{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
.joy .ksc-coorg .lb{transform-box:fill-box}
.joy .ksc-coorg.open .lb{animation:k257_coorg .09s linear 0s 4}
@keyframes k257_coorg{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
