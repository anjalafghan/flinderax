<svg xmlns="http://www.w3.org/2000/svg" viewBox="158 210 282 222" aria-hidden="true" focusable="false"><style>.joy .ksc-clayset .spk{opacity:0;transition:opacity .15s}
.joy .ksc-clayset.open .spk{opacity:1;transition:opacity 0.3s ease-out calc(0.3s + var(--d, 0s))}
.joy .ksc-clayset .dc-e *{fill:#7e6c53!important;stroke:#7e6c53!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-clayset .dc-s *{fill:none!important;stroke:#fff8e8!important;stroke-width:var(--w)!important;stroke-dasharray:4 5!important;fill-opacity:1!important;stroke-opacity:.8!important;opacity:1!important}
.joy .ksc-clayset .pc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-clayset.open .pc{animation:pt_clayset .5s ease-out}
@keyframes pt_clayset{40%{transform:scale(.95)}100%{transform:none}}
