<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 244 288" aria-hidden="true" focusable="false"><style>.joy .ksc-imagicaa .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-imagicaa .fb{opacity:0}
.joy .ksc-imagicaa.open .cf{animation:cfs_imagicaa .275s linear 5}
.joy .ksc-imagicaa.open .fa{animation:cfa_imagicaa 1.375s step-end both}
.joy .ksc-imagicaa.open .fb{animation:cfb_imagicaa 1.375s step-end both}
@keyframes cfs_imagicaa{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_imagicaa{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_imagicaa{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-imagicaa.open .toss{animation:tossup_imagicaa 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_imagicaa{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-imagicaa .cf,.joy .ksc-imagicaa .fa,.joy .ksc-imagicaa .fb,.joy .ksc-imagicaa .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#e9c46a" stroke="#9c7a2a" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#9c7a2a" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#5a3a10" text-anchor="middle">Imagicaa, Khopoli</text><text x="0" y="16" font-family="Fraunces, serif" font-size="40" font-weight="700" fill="#5a3a10" text-anchor="middle">1 RIDE</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#5a3a10" text-anchor="middle">keep arms inside</text><g transform="translate(0 -78) scale(0.5)"><path d="M-50 28 C-30 -10 -10 -26 10 -6 C24 -30 40 -34 50 -10 V28 Z" fill="#e9c46a"></path><path d="M-30 28 C-10 16 20 18 4 6 C-12 -4 26 -8 10 -18 C0 -24 20 -28 30 -30" fill="none" stroke="#5a3a10" stroke-width="4" stroke-linecap="round"></path><path d="M-30 28 C-10 16 20 18 4 6 C-12 -4 26 -8 10 -18 C0 -24 20 -28 30 -30" fill="none" stroke="#fff" stroke-width=".8" stroke-dasharray="3 3"></path></g></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="34" font-weight="700" fill="#5a3a10" text-anchor="middle">again!</text><text x="0" y="36" font-family="Kalam, cursive" font-size="18" fill="#5a3a10" text-anchor="middle">one more go</text></g></g></g></g></svg>
