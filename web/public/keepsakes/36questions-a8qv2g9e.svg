<svg xmlns="http://www.w3.org/2000/svg" viewBox="85 105 478 351" aria-hidden="true" focusable="false"><style>.joy .ksc-36questions .tc{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-36questions.open .tc{transform:translate(150px,-30px) rotate(18deg);transition:transform 0.6s cubic-bezier(.3,1.2,.5,1) 0.1s}
@media (prefers-reduced-motion:reduce){.joy .ksc-36questions .tc{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(300 280) rotate(-2)"><g transform="rotate(-24 0 160)"><rect x="-90" y="-130" width="180" height="250" rx="14" fill="#5d3564" stroke="#fbf4f8" stroke-width="5"></rect></g><g transform="rotate(-14 0 160)"><rect x="-90" y="-130" width="180" height="250" rx="14" fill="#7a4a80" stroke="#fbf4f8" stroke-width="5"></rect></g><g transform="rotate(-4 0 160)"><rect x="-90" y="-130" width="180" height="250" rx="14" fill="#8a5a90" stroke="#fbf4f8" stroke-width="5"></rect></g><g transform="rotate(6 0 160)"><rect x="-90" y="-130" width="180" height="250" rx="14" fill="#fbf4f8" stroke="#fbf4f8" stroke-width="5"></rect></g><g class="tc"><g transform="rotate(6 0 160)"><rect x="-90" y="-130" width="180" height="250" rx="14" fill="#fbf4f8" stroke="#5d3564" stroke-width="3"></rect><text x="0" y="-80" font-family="Fraunces, serif" font-size="34" font-weight="800" fill="#5d3564" text-anchor="middle">No. 36</text><text x="0" y="-30" font-family="Kalam, cursive" font-size="17" fill="#3a1430" text-anchor="middle">Share a problem</text><text x="0" y="-4" font-family="Kalam, cursive" font-size="17" fill="#3a1430" text-anchor="middle">and ask how they</text><text x="0" y="22" font-family="Kalam, cursive" font-size="17" fill="#3a1430" text-anchor="middle">would handle it.</text><text x="0" y="92" font-family="'Space Mono', monospace" font-size="9" fill="#5d3564" text-anchor="middle">then: four minutes, eyes only</text></g></g></g></svg>
