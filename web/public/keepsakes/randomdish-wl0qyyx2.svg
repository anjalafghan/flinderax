<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 244 288" aria-hidden="true" focusable="false"><style>.joy .ksc-randomdish .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-randomdish .fb{opacity:0}
.joy .ksc-randomdish.open .cf{animation:cfs_randomdish .275s linear 5}
.joy .ksc-randomdish.open .fa{animation:cfa_randomdish 1.375s step-end both}
.joy .ksc-randomdish.open .fb{animation:cfb_randomdish 1.375s step-end both}
@keyframes cfs_randomdish{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_randomdish{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_randomdish{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-randomdish.open .toss{animation:tossup_randomdish 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_randomdish{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-randomdish .cf,.joy .ksc-randomdish .fa,.joy .ksc-randomdish .fb,.joy .ksc-randomdish .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#5aa4d6" stroke="#2f6db5" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#2f6db5" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#0f2a4a" text-anchor="middle">spin the globe</text><text x="0" y="16" font-family="Fraunces, serif" font-size="40" font-weight="700" fill="#0f2a4a" text-anchor="middle">?</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#0f2a4a" text-anchor="middle">cook what it lands on</text><g transform="translate(0 -78) scale(0.5)"><circle r="26" fill="#5aa4d6"></circle><path d="M-14 -16 C-4 -20 6 -10 0 -2 C-8 4 -18 -4 -14 -16 Z M6 6 C16 2 22 10 14 20 C8 22 2 14 6 6 Z" fill="#4f8a3a"></path><ellipse rx="26" ry="10" fill="none" stroke="#fff" stroke-opacity=".5"></ellipse></g></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="34" font-weight="700" fill="#0f2a4a" text-anchor="middle">landed!</text><text x="0" y="36" font-family="Kalam, cursive" font-size="18" fill="#0f2a4a" text-anchor="middle">rate each other</text></g></g></g></g></svg>
