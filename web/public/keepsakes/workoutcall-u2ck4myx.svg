<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 177 337 237" aria-hidden="true" focusable="false"><style>.joy .ksc-workoutcall .spk{opacity:0;transition:opacity .15s}
.joy .ksc-workoutcall.open .spk{opacity:1;transition:opacity 0.3s ease-out calc(0.3s + var(--d, 0s))}
.joy .ksc-workoutcall .dc-e *{fill:#92261e!important;stroke:#92261e!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-workoutcall .dc-s *{fill:none!important;stroke:#fff8e8!important;stroke-width:var(--w)!important;stroke-dasharray:4 5!important;fill-opacity:1!important;stroke-opacity:.8!important;opacity:1!important}
.joy .ksc-workoutcall .pc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-workoutcall.open .pc{animation:pt_workoutcall .5s ease-out}
@keyframes pt_workoutcall{40%{transform:scale(.95)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-workoutcall .pc,.joy .ksc-workoutcall .spk{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g class="dc-e"><g transform="translate(0 -20) scale(4.0)" style="--w:5.00px"><rect x="-24" y="-3" width="48" height="6" fill="#fdeeea"></rect><rect x="-38" y="-16" width="12" height="32" rx="3" fill="#16161a"></rect><rect x="26" y="-16" width="12" height="32" rx="3" fill="#16161a"></rect><rect x="-26" y="-11" width="6" height="22" rx="2" fill="#16161a"></rect><rect x="20" y="-11" width="6" height="22" rx="2" fill="#16161a"></rect></g><ellipse cy="-20" rx="150" ry="70" style="--w:10px"></ellipse><g transform="translate(0 70) rotate(-2)" style="--w:10px"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#000" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#000"></path></g></g><g class="dc-s"><g transform="translate(0 -20) scale(4.0)" style="--w:1.75px"><rect x="-24" y="-3" width="48" height="6" fill="#fdeeea"></rect><rect x="-38" y="-16" width="12" height="32" rx="3" fill="#16161a"></rect><rect x="26" y="-16" width="12" height="32" rx="3" fill="#16161a"></rect><rect x="-26" y="-11" width="6" height="22" rx="2" fill="#16161a"></rect><rect x="20" y="-11" width="6" height="22" rx="2" fill="#16161a"></rect></g><ellipse cy="-20" rx="150" ry="70" style="--w:10px"></ellipse><g transform="translate(0 70) rotate(-2)" style="--w:3.5px"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#000" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#000"></path></g></g><ellipse cy="-20" rx="150" ry="70" fill="#fdeeea"></ellipse><g transform="translate(0 -20) scale(4.0)"><rect x="-24" y="-3" width="48" height="6" fill="#fdeeea"></rect><rect x="-38" y="-16" width="12" height="32" rx="3" fill="#16161a"></rect><rect x="26" y="-16" width="12" height="32" rx="3" fill="#16161a"></rect><rect x="-26" y="-11" width="6" height="22" rx="2" fill="#16161a"></rect><rect x="20" y="-11" width="6" height="22" rx="2" fill="#16161a"></rect></g><g transform="translate(0 70) rotate(-2)"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#92261e" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#92261e"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="21.5" fill="#fbf8f1" text-anchor="middle">3 sets, on a call</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">no one skipped</text></g></g></g></svg>
