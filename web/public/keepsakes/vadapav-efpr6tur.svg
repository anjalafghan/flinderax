<svg xmlns="http://www.w3.org/2000/svg" viewBox="83 83 409 404" aria-hidden="true" focusable="false"><style>.joy .ksc-vadapav .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
