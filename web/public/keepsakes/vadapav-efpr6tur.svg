.joy .ksc-vadapav .mw{opacity:0;transition:opacity .15s}
.joy .ksc-vadapav.open .mw{opacity:1;transition:opacity 0.15s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-vadapav .ring{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-vadapav.open .ring{stroke-dashoffset:0;transition:stroke-dashoffset 0.6s ease-out calc(1.1s + var(--d, 0s))}
