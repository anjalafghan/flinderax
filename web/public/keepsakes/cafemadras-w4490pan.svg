<svg xmlns="http://www.w3.org/2000/svg" viewBox="47 127 544 415" aria-hidden="true" focusable="false"><style>.joy .ksc-cafemadras .sm{opacity:0;transform-box:fill-box}
.joy .ksc-cafemadras.open .sm{animation:k199_cafemadras 1.8s ease-out var(--d, 0s) 3}
@keyframes k199_cafemadras{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-cafemadras .gn{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-cafemadras.open .gn{animation:k200_cafemadras .5s cubic-bezier(.3,1.6,.5,1) calc(0.3s + var(--d, 0s)) both}
@keyframes k200_cafemadras{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-cafemadras .sm,.joy .ksc-cafemadras .gn{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><path d="M60 340 C60 230 160 150 320 140 C440 132 540 190 580 280 C540 280 530 300 560 330 C520 430 420 480 300 488 C160 496 60 440 60 340 Z" fill="#3f7d2c"></path><path d="M64 340 C220 300 420 290 576 284" stroke="#a8cf7a" stroke-width="4" fill="none"></path><g transform="translate(280 300) scale(3.4)"><ellipse cy="10" rx="44" ry="12" fill="#f6f3ec"></ellipse><path d="M-40 6 C-20 -14 20 -14 40 6 C20 0 -20 0 -40 6 Z" fill="#e0a64a"></path><ellipse cx="22" cy="10" rx="8" ry="4" fill="#f3e6a0"></ellipse></g><g transform="translate(450 360) scale(2)"><path d="M-14 -24 H14 L11 10 H-11 Z" fill="#c9ced3"></path><ellipse cy="-24" rx="14" ry="4" fill="#8a5a2e"></ellipse><path d="M-30 10 H30 L24 24 H-24 Z" fill="#c9ced3"></path><ellipse cy="10" rx="30" ry="5" fill="#9aa0a6"></ellipse></g><path class="sm" style="--d:0.00s" d="M240 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M300 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M360 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><g transform="translate(70 470) rotate(-6)"><path d="M0 0 H210 V60 H0 Z" fill="#fbf6ec"></path><text x="105" y="28" font-family="'Young Serif', serif" font-size="14.8" fill="#5a1d0c" text-anchor="middle">Cafe Madras, Matunga</text><text x="105" y="46" font-family="'Space Mono', monospace" font-size="9" fill="#4a3a30" text-anchor="middle">masala dosa, filter coffee, early</text></g></svg>
