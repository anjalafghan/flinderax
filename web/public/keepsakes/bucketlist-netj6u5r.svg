</g><g transform="translate(10 -130) scale(0.9)"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fbe7a8"></path></g><g transform="translate(0 110) rotate(-2)"><path d="M-136.92 -20.0 H136.92 L126.91999999999999 2 L136.92 28.0 H-136.92 L-126.91999999999999 2 Z" fill="#326174" opacity=".85"></path><path d="M-124.91999999999999 -24.0 H124.91999999999999 V24.0 Q0 30.0 -124.91999999999999 24.0 Z" fill="#326174"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">bucket list: 50</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">same city, someday</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
