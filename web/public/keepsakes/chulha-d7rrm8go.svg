<svg xmlns="http://www.w3.org/2000/svg" viewBox="57 97 464 445" aria-hidden="true" focusable="false"><style>.joy .ksc-chulha .sm{opacity:0;transform-box:fill-box}
.joy .ksc-chulha.open .sm{animation:k125_chulha 1.8s ease-out var(--d, 0s) 3}
@keyframes k125_chulha{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-chulha .gn{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-chulha.open .gn{animation:k126_chulha .5s cubic-bezier(.3,1.6,.5,1) calc(0.3s + var(--d, 0s)) both}
@keyframes k126_chulha{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
