<svg xmlns="http://www.w3.org/2000/svg" viewBox="157 159 302 295" aria-hidden="true" focusable="false"><style>.joy .ksc-doughjoe .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-doughjoe.open .pc{animation:k40_doughjoe 2.2s ease-in-out 0s 1}
@keyframes k40_doughjoe{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-doughjoe .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-doughjoe .shine{opacity:0}
.joy .ksc-doughjoe.open .shine{animation:shn_doughjoe 1s ease-out .15s}
@keyframes shn_doughjoe{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
