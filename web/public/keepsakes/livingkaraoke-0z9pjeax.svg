<svg xmlns="http://www.w3.org/2000/svg" viewBox="83 83 409 404" aria-hidden="true" focusable="false"><style>.joy .ksc-livingkaraoke .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-livingkaraoke.open .mk{stroke-dashoffset:0;transition:stroke-dashoffset 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-livingkaraoke .mw{opacity:0;transition:opacity .15s}
.joy .ksc-livingkaraoke.open .mw{opacity:1;transition:opacity 0.15s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-livingkaraoke .ring{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-livingkaraoke.open .ring{stroke-dashoffset:0;transition:stroke-dashoffset 0.6s ease-out calc(1.1s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-livingkaraoke .mk,.joy .ksc-livingkaraoke .mw,.joy .ksc-livingkaraoke .ring{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(115.0 145.0) rotate(-3)"><rect x="-18" y="-24" width="366" height="354" rx="14" fill="#b07c45"></rect><g transform="translate(115.0 -38)"><rect width="100" height="40" rx="8" fill="#c9ccd1"></rect></g><path d="M0 0 H330 V310 H0 Z" fill="#fbf8ef"></path><text x="20" y="46" font-family="'Young Serif', serif" font-size="23.8" fill="#2b2b30" text-anchor="start">Living-room karaoke</text><text x="20" y="70" font-family="'Space Mono', monospace" font-size="10" fill="#6b6658" text-anchor="start">pick a decade, score each other</text><text x="240" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#1f4bb5" text-anchor="middle">me</text><text x="290" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#c0392b" text-anchor="middle">you</text><text x="20" y="130" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">the 90s duet</text><path d="M16 143 H314" stroke="#c9c2b0"></path><text style="--d:0.15s" class="mw" x="240" y="130" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">9</text><text style="--d:0.25s" class="mw" x="290" y="130" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">8</text><text x="20" y="170" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">the sad one</text><path d="M16 183 H314" stroke="#c9c2b0"></path><text style="--d:0.35s" class="mw" x="240" y="170" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">7</text><text style="--d:0.45s" class="mw" x="290" y="170" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">10</text><text x="20" y="210" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">the dance number</text><path d="M16 223 H314" stroke="#c9c2b0"></path><text style="--d:0.55s" class="mw" x="240" y="210" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">10</text><text style="--d:0.65s" class="mw" x="290" y="210" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">9</text><text x="20" y="250" font-family="Kalam, cursive" font-size="14.2" fill="#2b2b30" text-anchor="start">the one we both forgot</text><path d="M16 263 H314" stroke="#c9c2b0"></path><text style="--d:0.75s" class="mw" x="240" y="250" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">5</text><text style="--d:0.85s" class="mw" x="290" y="250" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">6</text><path class="ring" pathLength="1" d="M12 214 C40 188 300 186 322 208 C330 230 40 232 10 216" fill="none" stroke="#2c7a3f" stroke-width="2.4"></path><g transform="translate(290 40) scale(0.6)"><rect x="-6" y="-2" width="12" height="38" rx="5" fill="#1f2026"></rect><circle cy="-14" r="14" fill="#a9adb4"></circle></g></g></svg>
