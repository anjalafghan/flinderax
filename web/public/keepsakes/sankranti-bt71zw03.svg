@media (prefers-reduced-motion:reduce){.joy .ksc-sankranti .ly,.joy .ksc-sankranti .glow{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="ly"><g transform="translate(300 160) rotate(-3)"><path d="M-40 -150 C-60 -80 -60 -30 -50 0 M40 -150 C60 -80 60 -30 50 0" fill="none" stroke="#f2c230" stroke-width="12"></path><rect x="-16" y="-10" width="32" height="24" rx="4" fill="#9aa0a6"></rect><path d="M-130 30 Q-130 0 -100 0 H100 Q130 0 130 30 V300 Q130 330 100 330 H30 L0 352 L-30 330 H-100 Q-130 330 -130 300 Z" fill="#e0245e"></path><rect x="-30" y="16" width="60" height="10" rx="5" fill="#00000044"></rect><text x="0" y="90" font-family="Fraunces, serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">Sankranti</text><text x="0" y="116" font-family="'Space Mono', monospace" font-size="11" fill="#fff" text-anchor="middle">one flies, one holds the spool</text><text x="0" y="220" font-family="'Permanent Marker', cursive" font-size="44" fill="#fff" text-anchor="middle">kaipo!</text><g transform="translate(0 260) scale(1)"><path d="M0 -34 L24 0 L0 34 L-24 0 Z" fill="#f2c230"></path><path d="M0 -34 V34 M-24 0 H24" stroke="#fff" stroke-width="2"></path><path d="M0 34 C10 44 -6 52 6 62" fill="none" stroke="#fff" stroke-width="2"></path></g><path class="glow" d="M-130 30 Q-130 0 -100 0 H100 Q130 0 130 30 V300 Q130 330 100 330 H30 L0 352 L-30 330 H-100 Q-130 330 -130 300 Z" fill="#fff"></path></g></g></svg>
