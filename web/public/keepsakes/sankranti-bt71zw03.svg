<svg xmlns="http://www.w3.org/2000/svg" viewBox="158 -5 303 536" aria-hidden="true" focusable="false"><style>.joy .ksc-sankranti .ly{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-sankranti.open .ly{animation:k94_sankranti 2.2s ease-in-out 0s 1}
@keyframes k94_sankranti{0%,100%{transform:rotate(0)}20%{transform:rotate(6deg)}45%{transform:rotate(-4.800000000000001deg)}70%{transform:rotate(2.7deg)}88%{transform:rotate(-1.2000000000000002deg)}}
