<svg xmlns="http://www.w3.org/2000/svg" viewBox="149 99 302 437" aria-hidden="true" focusable="false"><style>.joy .ksc-midnightride .shine{opacity:0}
.joy .ksc-midnightride.open .shine{animation:shn_midnightride .9s ease-out .2s}
@keyframes shn_midnightride{0%{opacity:0;transform:translateX(0)}30%{opacity:.6}100%{opacity:0;transform:translateX(160px)}}
.joy .ksc-midnightride .bd{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-midnightride.open .bd{animation:k7_midnightride 2.2s ease-in-out 0s 1}
@keyframes k7_midnightride{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}45%{transform:rotate(-4.0deg)}70%{transform:rotate(2.25deg)}88%{transform:rotate(-1.0deg)}}
.joy .ksc-midnightride .tails{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-midnightride.open .tails{animation:flut_midnightride .3s ease-in-out 5 alternate}
@keyframes flut_midnightride{to{transform:skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-midnightride .tails,.joy .ksc-midnightride .shine,.joy .ksc-midnightride .bd{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="bd"><g transform="translate(300 250) rotate(-6)"><g class="tails"><path d="M-60 80 L-90 260 L-60 236 L-36 266 L-10 96 Z" fill="#f2c230"></path><path d="M60 80 L90 260 L60 236 L36 266 L10 96 Z" fill="#1f2b4d"></path></g><circle cx="124.0" cy="0.0" r="14" fill="#1f2b4d"></circle><circle cx="119.8" cy="32.1" r="14" fill="#1f2b4d"></circle><circle cx="107.4" cy="62.0" r="14" fill="#1f2b4d"></circle><circle cx="87.7" cy="87.7" r="14" fill="#1f2b4d"></circle><circle cx="62.0" cy="107.4" r="14" fill="#1f2b4d"></circle><circle cx="32.1" cy="119.8" r="14" fill="#1f2b4d"></circle><circle cx="0.0" cy="124.0" r="14" fill="#1f2b4d"></circle><circle cx="-32.1" cy="119.8" r="14" fill="#1f2b4d"></circle><circle cx="-62.0" cy="107.4" r="14" fill="#1f2b4d"></circle><circle cx="-87.7" cy="87.7" r="14" fill="#1f2b4d"></circle><circle cx="-107.4" cy="62.0" r="14" fill="#1f2b4d"></circle><circle cx="-119.8" cy="32.1" r="14" fill="#1f2b4d"></circle><circle cx="-124.0" cy="0.0" r="14" fill="#1f2b4d"></circle><circle cx="-119.8" cy="-32.1" r="14" fill="#1f2b4d"></circle><circle cx="-107.4" cy="-62.0" r="14" fill="#1f2b4d"></circle><circle cx="-87.7" cy="-87.7" r="14" fill="#1f2b4d"></circle><circle cx="-62.0" cy="-107.4" r="14" fill="#1f2b4d"></circle><circle cx="-32.1" cy="-119.8" r="14" fill="#1f2b4d"></circle><circle cx="-0.0" cy="-124.0" r="14" fill="#1f2b4d"></circle><circle cx="32.1" cy="-119.8" r="14" fill="#1f2b4d"></circle><circle cx="62.0" cy="-107.4" r="14" fill="#1f2b4d"></circle><circle cx="87.7" cy="-87.7" r="14" fill="#1f2b4d"></circle><circle cx="107.4" cy="-62.0" r="14" fill="#1f2b4d"></circle><circle cx="119.8" cy="-32.1" r="14" fill="#1f2b4d"></circle><circle r="120" fill="#eef0f8"></circle><circle r="108" fill="none" stroke="#2b2b30" stroke-opacity=".4" stroke-dasharray="3 5"></circle><text x="0" y="-44" font-family="'Young Serif', serif" font-size="24.0" fill="#2b2b30" text-anchor="middle">Midnight ride</text><text x="0" y="20" font-family="Fraunces, serif" font-size="52" font-weight="800" fill="#2b2b30" text-anchor="middle">25 km</text><text x="0" y="56" font-family="'Space Mono', monospace" font-size="11" fill="#2b2b30" text-anchor="middle">Colaba, 10 pm to 5 am</text><g transform="translate(70 -70) scale(0.45)"><path d="M10 -24 A26 26 0 1 0 10 24 A20 20 0 1 1 10 -24 Z" fill="#f5edc8"></path></g><g transform="translate(0 86) scale(0.55)"><circle cx="-24" cy="10" r="16" fill="none" stroke="#222" stroke-width="3"></circle><circle cx="24" cy="10" r="16" fill="none" stroke="#222" stroke-width="3"></circle><path d="M-24 10 L-6 -14 H16 L24 10 M-6 -14 L2 10 L16 -14 M-10 -20 H0 M16 -14 L12 -26 H20" fill="none" stroke="#c8362a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></g><path class="shine" d="M-90 -40 L-40 -110 L-20 -110 L-70 -40 Z" fill="#fff" opacity="0"></path></g></g></svg>
