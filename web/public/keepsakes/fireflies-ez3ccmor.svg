<svg xmlns="http://www.w3.org/2000/svg" viewBox="127 55 333 480" aria-hidden="true" focusable="false"><style>.joy .ksc-fireflies .fx{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-fireflies.open .fx{animation:k70_fireflies .5s cubic-bezier(.3,1.6,.5,1) calc(0.2s + var(--d, 0s)) both}
@keyframes k70_fireflies{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
.joy .ksc-fireflies .lb{transform-box:fill-box}
.joy .ksc-fireflies.open .lb{animation:k72_fireflies .09s linear 0s 4}
@keyframes k72_fireflies{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-fireflies .fx,.joy .ksc-fireflies .lb{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><linearGradient id="fireflies-lb-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".35"></stop><stop offset=".25" stop-color="#fff" stop-opacity="0"></stop><stop offset=".85" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity=".2"></stop></linearGradient></defs><g class="lb"><g transform="translate(290 330) rotate(-4)"><path d="M-70 -120 H70 V-96 C96 -90 104 -70 104 -40 V160 Q104 186 78 186 H-78 Q-104 186 -104 160 V-40 C-104 -70 -96 -90 -70 -96 Z" fill="#1f2b4d"></path><path d="M-70 -120 H70 V-96 C96 -90 104 -70 104 -40 V160 Q104 186 78 186 H-78 Q-104 186 -104 160 V-40 C-104 -70 -96 -90 -70 -96 Z" fill="url(#fireflies-lb-shine)"></path><rect x="-78" y="-150" width="156" height="34" rx="6" fill="#3a2a20"></rect><rect x="-84" y="-40" width="168" height="160" rx="6" fill="#f6efe0"></rect><rect x="-78" y="-34" width="156" height="148" rx="4" fill="none" stroke="#3a2a20" stroke-opacity=".4"></rect><text x="0" y="0" font-family="'Young Serif', serif" font-size="20.5" fill="#3a2a20" text-anchor="middle">Bhandardara</text><text x="0" y="30" font-family="Kalam, cursive" font-size="13.7" fill="#3a2a20" text-anchor="middle">Arthur Lake, late May</text><text x="0" y="52" font-family="Kalam, cursive" font-size="16" fill="#3a2a20" text-anchor="middle">the trees lit up</text><text x="0" y="74" font-family="Kalam, cursive" font-size="13.1" fill="#3a2a20" text-anchor="middle">lights off, no torches</text><g transform="translate(0 -110) scale(1.6)"><circle cx="-24" cy="-10" r="2.4" fill="#f6f08a" opacity=".9"></circle><circle cx="-24" cy="-10" r="7.199999999999999" fill="#f6f08a" opacity=".18"></circle><circle cx="6" cy="-24" r="2" fill="#f6f08a" opacity=".9"></circle><circle cx="6" cy="-24" r="6" fill="#f6f08a" opacity=".18"></circle><circle cx="20" cy="8" r="2.6" fill="#f6f08a" opacity=".9"></circle><circle cx="20" cy="8" r="7.800000000000001" fill="#f6f08a" opacity=".18"></circle><circle cx="-6" cy="18" r="1.8" fill="#f6f08a" opacity=".9"></circle><circle cx="-6" cy="18" r="5.4" fill="#f6f08a" opacity=".18"></circle></g><g transform="translate(-110 -150)"><g class="fx" style="--d:0.0s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g><g transform="translate(120 -120)"><g class="fx" style="--d:0.2s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g><g transform="translate(-130 40)"><g class="fx" style="--d:0.4s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g><g transform="translate(130 70)"><g class="fx" style="--d:0.6s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g><g transform="translate(0 -240)"><g class="fx" style="--d:0.8s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g></g></g></svg>
