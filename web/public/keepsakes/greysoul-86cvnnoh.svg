ke-width="2.4" transform="rotate(20)"></path></g><g transform="translate(0 60) rotate(-2)"><path d="M-96.12 -20.0 H96.12 L86.12 2 L96.12 28.0 H-96.12 L-86.12 2 Z" fill="#26292e" opacity=".85"></path><path d="M-84.12 -24.0 H84.12 V24.0 Q0 30.0 -84.12 24.0 Z" fill="#26292e"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">Grey Soul</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">light roast, Kala Ghoda</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
