<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 81 355 409" aria-hidden="true" focusable="false"><style>.joy .ksc-firstdate .pol{transform-box:fill-box}
.joy .ksc-firstdate.open .pol{animation:k34_firstdate .09s linear 0s 5}
@keyframes k34_firstdate{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-firstdate .dev{transition:opacity .3s}
.joy .ksc-firstdate.open .dev{opacity:0;transition:opacity 1.6s ease-in .5s}
@media (prefers-reduced-motion:reduce){.joy .ksc-firstdate .dev,.joy .ksc-firstdate .pol{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pol"><g transform="translate(150 120) rotate(-5)"><path d="M0 0 H300 V326 Q292 354 260 360 H0 Z" fill="#fbfaf6"></path><path d="M300 326 Q292 354 260 360 Q278 338 300 326 Z" fill="#d9d4c6"></path><clipPath id="firstdate-pl-c"><rect x="20" y="20" width="260" height="260"></rect></clipPath><linearGradient id="firstdate-pl-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d3564"></stop><stop offset="1" stop-color="#a86a8a"></stop></linearGradient><g clip-path="url(#firstdate-pl-c)"><rect x="20" y="20" width="260" height="260" fill="url(#firstdate-pl-s)"></rect><path d="M20 210 C100 196 200 220 280 204 V280 H20 Z" fill="#3a2030"></path><g transform="translate(20 20)"><g transform="translate(90 150) scale(1.2)"><rect x="-8" y="-6" width="16" height="36" rx="2" fill="#f6efe0"></rect><path d="M0 -8 C-7 -18 -2 -26 0 -32 C4 -24 7 -18 0 -8 Z" fill="#ffb347"></path></g><g transform="translate(170 150) scale(1.2)"><rect x="-8" y="-6" width="16" height="36" rx="2" fill="#f6efe0"></rect><path d="M0 -8 C-7 -18 -2 -26 0 -32 C4 -24 7 -18 0 -8 Z" fill="#ffb347"></path></g><g transform="translate(130 70) scale(1)"><path d="M0 22 C-30 0 -26 -24 -10 -24 C-4 -24 0 -18 0 -14 C0 -18 4 -24 10 -24 C26 -24 30 0 0 22 Z" fill="#e0245e"></path></g><g transform="translate(130 200) scale(1.4)"><ellipse rx="40" ry="16" fill="#f6f3ec"></ellipse><ellipse rx="28" ry="10" fill="none" stroke="#c9c4b8"></ellipse><ellipse cy="-3" rx="18" ry="7" fill="#d9a85c"></ellipse></g></g></g><rect class="dev" x="20" y="20" width="260" height="260" fill="#2b2a2e"></rect><text x="150.0" y="330" font-family="Caveat, cursive" font-size="30" font-weight="700" fill="#2b2b30" text-anchor="middle">first date, take two</text></g></g></svg>
