<svg xmlns="http://www.w3.org/2000/svg" viewBox="109 134 378 295" aria-hidden="true" focusable="false"><style>.joy .ksc-kanheri .spk{opacity:0;transition:opacity .15s}
.joy .ksc-kanheri.open .spk{opacity:1;transition:opacity 0.3s ease-out calc(0.3s + var(--d, 0s))}
.joy .ksc-kanheri .dc-e *{fill:#3e5036!important;stroke:#3e5036!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-kanheri .dc-s *{fill:none!important;stroke:#fff8e8!important;stroke-width:var(--w)!important;stroke-dasharray:4 5!important;fill-opacity:1!important;stroke-opacity:.8!important;opacity:1!important}
.joy .ksc-kanheri .pc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-kanheri.open .pc{animation:pt_kanheri .5s ease-out}
@keyframes pt_kanheri{40%{transform:scale(.95)}100%{transform:none}}
