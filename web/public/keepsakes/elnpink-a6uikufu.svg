<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 246 327 257" aria-hidden="true" focusable="false"><style>.joy .ksc-elnpink .cu{transform-box:fill-box}
.joy .ksc-elnpink.open .cu{animation:k80_elnpink .09s linear 0.1s 4}
@keyframes k80_elnpink{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-elnpink .sm{opacity:0;transform-box:fill-box}
.joy .ksc-elnpink.open .sm{animation:k81_elnpink 1.8s ease-out var(--d, 0s) 3}
@keyframes k81_elnpink{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-70px)}}
