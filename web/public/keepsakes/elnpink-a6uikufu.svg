="rotate(270)"></ellipse><ellipse cy="-14" rx="8" ry="14" fill="#f29ab8" transform="rotate(315)"></ellipse><circle r="8" fill="#c2185b"></circle></g><g transform="translate(0 140)"><text x="0" y="0" font-family="Caveat, cursive" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">EL&amp;N</text><text x="0" y="24" font-family="'Space Mono', monospace" font-size="10" fill="#fff" text-anchor="middle">Jio World Plaza, BKC</text></g><path class="sm" style="--d:0.00s" d="M-30 -60 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M0 -60 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M30 -60 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path></g></g></svg>
