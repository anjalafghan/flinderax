 -16" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linecap="round"></path><g class="fl1"><rect x="0" width="150" height="300" fill="#c0392b"></rect><rect x="8" y="8" width="134" height="284" fill="none" stroke="#fff" stroke-opacity=".5"></rect></g><g class="fl2"><rect x="300" width="150" height="300" fill="#c0392b"></rect><rect x="308" y="8" width="134" height="284" fill="none" stroke="#fff" stroke-opacity=".5"></rect></g><g class="mid"><rect x="150" width="150" height="300" fill="#c0392b"></rect><rect x="158" y="8" width="134" height="284" fill="none" stroke="#fff" stroke-opacity=".5"></rect><g><text x="225.0" y="120" font-family="Fraunces, serif" font-size="20.3" font-weight="700" fill="#fff" text-anchor="middle">Step 1 of 64</text><text x="225.0" y="150" font-family="'Space Mono', monospace" font-size="10" fill="#fff" text-anchor="middle">same set, two tables</text></g></g></g></svg>
