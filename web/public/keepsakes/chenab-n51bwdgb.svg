<svg xmlns="http://www.w3.org/2000/svg" viewBox="217 215 182 301" aria-hidden="true" focusable="false"><style>.joy .ksc-chenab .cu{transform-box:fill-box}
.joy .ksc-chenab.open .cu{animation:k105_chenab .09s linear 0.1s 6}
@keyframes k105_chenab{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-chenab .sm{opacity:0;transform-box:fill-box}
.joy .ksc-chenab.open .sm{animation:k106_chenab 1.8s ease-out var(--d, 0s) 3}
@keyframes k106_chenab{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-70px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-chenab .cu,.joy .ksc-chenab .sm{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cu"><g transform="translate(300 320) rotate(-3)"><path d="M-50 -90 H50 L40 90 H-40 Z" fill="#ffffff" fill-opacity=".25" stroke="#fff" stroke-width="2"></path><path d="M-46 -40 H46 L40 88 H-40 Z" fill="#e0245e"></path><path d="M-30 -86 L-24 86" stroke="#fff" stroke-opacity=".35" stroke-width="3"></path><path d="M-10 -86 L-8 86" stroke="#fff" stroke-opacity=".35" stroke-width="3"></path><path d="M10 -86 L8 86" stroke="#fff" stroke-opacity=".35" stroke-width="3"></path><path d="M30 -86 L24 86" stroke="#fff" stroke-opacity=".35" stroke-width="3"></path><ellipse cy="-40" rx="46" ry="6" fill="#c98a4a"></ellipse><g transform="translate(0 150)"><text x="0" y="0" font-family="Kalam, cursive" font-size="26" fill="#fff" text-anchor="middle">Chenab, Vashi</text><text x="0" y="26" font-family="'Space Mono', monospace" font-size="10" fill="#fff" text-anchor="middle">mocktails, open-air seats</text></g><path class="sm" style="--d:0.00s" d="M-30 -96 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M0 -96 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M30 -96 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path></g></g></svg>
