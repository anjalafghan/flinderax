<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 106 554 385" aria-hidden="true" focusable="false"><style>.joy .ksc-duetonline .disc{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-duetonline.open .disc{transform:translate(90px,0px) rotate(0deg);transition:transform 0.8s cubic-bezier(.3,1.2,.5,1) 0s}
.joy .ksc-duetonline .disc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-duetonline.open .disc{transform:translateX(90px);animation:k108_duetonline 2.2s cubic-bezier(.3,0,.3,1) 0.6s}
@keyframes k108_duetonline{to{transform:rotate(1080deg)}}
.joy .ksc-duetonline .nt{opacity:0;transform-box:fill-box}
.joy .ksc-duetonline.open .nt{animation:k109_duetonline 2s ease-out var(--d, 0s) 2}
@keyframes k109_duetonline{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-90px)}}
