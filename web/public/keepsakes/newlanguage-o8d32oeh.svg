<svg xmlns="http://www.w3.org/2000/svg" viewBox="131 127 324 307" aria-hidden="true" focusable="false"><style>.joy .ksc-newlanguage .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
