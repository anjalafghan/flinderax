<svg xmlns="http://www.w3.org/2000/svg" viewBox="118 57 365 474" aria-hidden="true" focusable="false"><style>.joy .ksc-shooting .tgt{transform-box:view-box;transform-origin:300px 70px}
.joy .ksc-shooting .hole{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-shooting .score{opacity:0}
.joy .ksc-shooting.open .hole{animation:hit_shooting .12s ease-out var(--d) both}
.joy .ksc-shooting.open .tgt{animation:jolt_shooting .25s ease-out .3s 5}
.joy .ksc-shooting.open .score{opacity:1;transition:opacity .3s 2s}
@keyframes hit_shooting{from{opacity:0;transform:scale(2.4)}to{opacity:1;transform:scale(1)}}
@keyframes jolt_shooting{40%{transform:rotate(1.4deg)}80%{transform:rotate(-.6deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-shooting .tgt,.joy .ksc-shooting .hole,.joy .ksc-shooting .score{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><filter id="shooting-sr-g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.12 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter></defs>
<path d="M60 70 H540" stroke="#555" stroke-width="3"></path>
<g class="tgt"><g transform="translate(300 300)">
<path d="M-170 -210 H170 V200 L150 220 H-170 Z" fill="#efe8d6"></path><path d="M-170 -210 H170 V200 L150 220 H-170 Z" filter="url(#shooting-sr-g)"></path>
<path d="M150 220 L170 200 L150 200 Z" fill="#d6ccb3"></path>
