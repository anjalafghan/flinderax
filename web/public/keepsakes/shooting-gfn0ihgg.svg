<path d="M-160 0 H160 M0 -160 V160" stroke="#7a7466" stroke-width=".8" stroke-dasharray="4 4"></path>
<g transform="translate(-8 6)"><g class="hole" style="--d:0.3s"><circle r="8.5" fill="#f4efe2" opacity=".9"></circle><circle r="6" fill="#3a2a14"></circle><circle r="6" fill="none" stroke="#a89878" stroke-width="1.2"></circle></g></g><g transform="translate(14 -10)"><g class="hole" style="--d:0.6s"><circle r="8.5" fill="#f4efe2" opacity=".9"></circle><circle r="6" fill="#3a2a14"></circle><circle r="6" fill="none" stroke="#a89878" stroke-width="1.2"></circle></g></g><g transform="translate(4 18)"><g class="hole" style="--d:0.8999999999999999s"><circle r="8.5" fill="#f4efe2" opacity=".9"></circle><circle r="6" fill="#3a2a14"></circle><circle r="6" fill="none" stroke="#a89878" stroke-width="1.2"></circle></g></g><g transform="translate(-20 -16)"><g class="hole" style="--d:1.2s"><circle r="8.5" fill="#f4efe2" opacity=".9"></circle><circle r="6" fill="#3a2a14"></circle><circle r="6" fill="none" stroke="#a89878" stroke-width="1.2"></circle></g></g><g transform="translate(26 22)"><g class="hole" style="--d:1.5s"><circle r="8.5" fill="#f4efe2" opacity=".9"></circle><circle r="6" fill="#3a2a14"></circle><circle r="6" fill="none" stroke="#a89878" stroke-width="1.2"></circle></g></g>
