@keyframes k164_vajreshwari{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-vajreshwari .lb{transform-box:fill-box}
.joy .ksc-vajreshwari.open .lb{animation:k167_vajreshwari .09s linear 0s 4}
@keyframes k167_vajreshwari{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
