="#f7c9d4"></rect></g><path d="M-8 0 h16" stroke="#fff" stroke-width="2" stroke-dasharray="2 3"></path></g><g class="stp"><g transform="translate(210 124) rotate(-10)"><g opacity=".88"><circle r="30" fill="none" stroke="#3a2a5a" stroke-width="2.6"></circle><circle r="24.0" fill="none" stroke="#3a2a5a" stroke-width="1"></circle><text x="0" y="0" font-family="'Space Mono', monospace" font-size="12.6" font-weight="700" fill="#3a2a5a" text-anchor="middle">VIEWED</text><text x="0" y="12.6" font-family="'Space Mono', monospace" font-size="7.800000000000001" fill="#3a2a5a" text-anchor="middle">two cities</text></g></g></g></g></g></svg>
