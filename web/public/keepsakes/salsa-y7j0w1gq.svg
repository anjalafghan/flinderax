<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 68 314 375" aria-hidden="true" focusable="false"><style>.joy .ksc-salsa .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-salsa .pc{transform-box:fill-box;transform-origin:0% 100%}
.joy .ksc-salsa.open .pc{transform:rotate(-7deg) translate(-4px,-14px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.joy .ksc-salsa .pc{transition:transform .3s}
.joy .ksc-salsa .shine{opacity:0}
.joy .ksc-salsa.open .shine{animation:shn_salsa 1s ease-out .2s}
@keyframes shn_salsa{0%{opacity:0;transform:translateX(0)}30%{opacity:.45}100%{opacity:0;transform:translateX(280px)}}
