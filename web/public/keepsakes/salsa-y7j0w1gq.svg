/ellipse><circle cy="-18" r="4" fill="#16161a"></circle></g></g><g transform="translate(110 -100) scale(1.4)"><path d="M-6 14 V-20 L18 -26 V8" fill="none" stroke="#d8483a" stroke-width="3"></path><ellipse cx="-11" cy="14" rx="7" ry="5" fill="#d8483a"></ellipse><ellipse cx="13" cy="8" rx="7" ry="5" fill="#d8483a"></ellipse></g><g transform="translate(0 100) rotate(-2)"><path d="M-119.16 -20.0 H119.16 L109.16 2 L119.16 28.0 H-119.16 L-109.16 2 Z" fill="#92261e" opacity=".85"></path><path d="M-107.16 -24.0 H107.16 V24.0 Q0 30.0 -107.16 24.0 Z" fill="#92261e"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">1-2-3, 5-6-7</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">the turn: finally</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
