<svg xmlns="http://www.w3.org/2000/svg" viewBox="121 -16 376 496" aria-hidden="true" focusable="false"><style>.joy .ksc-houseofcroissant .rb{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-houseofcroissant.open .rb{transform:translate(0px,-40px) rotate(0deg);transition:transform 0.3s cubic-bezier(.3,1.2,.5,1) 0s}
.joy .ksc-houseofcroissant .rb{transition:opacity .2s}
.joy .ksc-houseofcroissant.open .rb{opacity:0;transition:opacity 0.2s calc(0.15s + var(--d, 0s))}
.joy .ksc-houseofcroissant .lid{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-houseofcroissant.open .lid{transform:translate(40px,-150px) rotate(-12deg);transition:transform 0.6s cubic-bezier(.3,1.2,.5,1) 0.35s}
.joy .ksc-houseofcroissant .tr{opacity:0;transition:opacity .15s}
.joy .ksc-houseofcroissant.open .tr{opacity:1;transition:opacity 0.3s ease-out calc(0.5s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-houseofcroissant .rb,.joy .ksc-houseofcroissant .rb,.joy .ksc-houseofcroissant .lid,.joy .ksc-houseofcroissant .tr{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(300 330) rotate(-4)"><path d="M-150 -60 H150 L138 120 Q136 128 128 128 H-128 Q-136 128 -138 120 Z" fill="#efe1c0" stroke="#00000022"></path><path d="M-150 -60 L-138 120 M150 -60 L138 120" stroke="#00000018" stroke-width="6"></path><g class="tr"><g transform="translate(0 -70) scale(2)"><path d="M-36 8 C-30 -20 30 -20 36 8 C26 0 -26 0 -36 8 Z" fill="#d9963a"></path><path d="M-18 -8 L-12 6 M0 -12 V4 M18 -8 L12 6" stroke="#b5702a" stroke-width="3" stroke-linecap="round"></path></g></g><path d="M-150 -60 H150 V-20 H-150 Z" fill="#efe1c0" opacity=".0"></path><g class="lid"><path d="M-160 -96 Q-160 -104 -152 -104 H152 Q160 -104 160 -96 L156 -50 H-156 Z" fill="#efe1c0" stroke="#00000022"></path><text x="16" y="-70" font-family="Caveat, cursive" font-size="30.4" font-weight="700" fill="#3a2414" text-anchor="middle">House of Croissant</text></g><g class="rb"><path d="M-160 -56 H160" stroke="#7a4a2a" stroke-width="8"></path><path d="M-112 -104 V126" stroke="#7a4a2a" stroke-width="10"></path><path d="M-112 -104 C-152 -154 -182 -114 -112 -104 C-42 -114 -72 -154 -112 -104 Z" fill="#7a4a2a"></path></g><g transform="translate(20 96)"><text x="0" y="0" font-family="'Space Mono', monospace" font-size="11" fill="#3a2414" text-anchor="middle">near Mount Mary, from 8:30</text></g></g></svg>
