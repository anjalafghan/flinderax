<svg xmlns="http://www.w3.org/2000/svg" viewBox="119 129 341 341" aria-hidden="true" focusable="false"><style>.joy .ksc-skylounge .ring{opacity:0}
.joy .ksc-skylounge.open .ring{opacity:1;transition:opacity .4s 1.1s}
.joy .ksc-skylounge .gl{transform-box:fill-box;opacity:0}
.joy .ksc-skylounge.open .gl{animation:gld_skylounge 1.6s ease-in-out both}
@keyframes gld_skylounge{0%{opacity:0;transform:translate(60px,-160px)}35%{opacity:1;transform:translate(0,0)}70%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(80px,-140px)}}
.joy .ksc-skylounge .cs{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-skylounge.open .cs{animation:csp_skylounge .7s ease-out .9s}
@keyframes csp_skylounge{40%{transform:rotate(9deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-skylounge .ring,.joy .ksc-skylounge .gl,.joy .ksc-skylounge .cs{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cs"><g transform="translate(290 300) rotate(-8)"><circle r="140" fill="#1f2b4d"></circle><circle r="124" fill="none" stroke="#f2d38c" stroke-opacity=".35" stroke-width="2"></circle><text x="0" y="-30" font-family="Fraunces, serif" font-size="36" font-weight="800" fill="#f2d38c" text-anchor="middle">Sky Lounge</text><text x="0" y="0" font-family="'Space Mono', monospace" font-size="12" fill="#f2d38c" text-anchor="middle">Palm Beach Galleria, Vashi</text><g transform="translate(0 70) scale(1)"><path d="M-50 -10 C-25 10 25 10 50 -10" fill="none" stroke="#3a3a3a" stroke-width="1.5"></path><circle cx="-40" cy="-6.4" r="4" fill="#ffe08a"></circle><circle cx="-24" cy="-2.3" r="4" fill="#ffe08a"></circle><circle cx="-8" cy="-0.3" r="4" fill="#ffe08a"></circle><circle cx="8" cy="-0.3" r="4" fill="#ffe08a"></circle><circle cx="24" cy="-2.3" r="4" fill="#ffe08a"></circle><circle cx="40" cy="-6.4" r="4" fill="#ffe08a"></circle></g><circle class="ring" r="48" cx="56" cy="74" fill="none" stroke="#6b4a2a" stroke-opacity=".45" stroke-width="7"></circle></g></g><g class="gl"><g transform="translate(340 320) scale(2.4)"><path d="M-24 -24 H24 L0 4 Z" fill="#e0245e"></path><path d="M-24 -24 H24 L0 4 Z" fill="none" stroke="#ffffff" stroke-width="2"></path><path d="M0 4 V24 M-12 26 H12" stroke="#ffffff" stroke-width="3"></path><circle cx="16" cy="-26" r="6" fill="#9ccc4a"></circle></g></g></svg>
