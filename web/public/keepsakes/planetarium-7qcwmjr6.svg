4 A20 20 0 1 1 10 -24 Z" fill="#e9c46a"></path></g><g transform="translate(70 -120) scale(0.9)"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#f1c84b"></path></g><g transform="translate(110 -80) scale(0.6)"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#f1c84b"></path></g><g transform="translate(0 110) rotate(-2)"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#1f2b4d" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#1f2b4d"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="21.5" fill="#fbf8f1" text-anchor="middle">Nehru Planetarium</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">we found Orion</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
