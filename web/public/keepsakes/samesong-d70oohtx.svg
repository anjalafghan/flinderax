<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 106 554 385" aria-hidden="true" focusable="false"><style>.joy .ksc-samesong .disc{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-samesong.open .disc{transform:translate(90px,0px) rotate(0deg);transition:transform 0.8s cubic-bezier(.3,1.2,.5,1) 0s}
.joy .ksc-samesong .disc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-samesong.open .disc{transform:translateX(90px);animation:k161_samesong 2.2s cubic-bezier(.3,0,.3,1) 0.6s}
@keyframes k161_samesong{to{transform:rotate(1080deg)}}
.joy .ksc-samesong .nt{opacity:0;transform-box:fill-box}
.joy .ksc-samesong.open .nt{animation:k162_samesong 2s ease-out var(--d, 0s) 2}
@keyframes k162_samesong{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-90px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-samesong .disc,.joy .ksc-samesong .nt{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="md"><g transform="translate(270 300) rotate(-6)"><g transform="translate(70 0)"><g class="disc"><circle r="150" fill="#141416"></circle><circle r="60" fill="none" stroke="#2a2a2e" stroke-width="1.4"></circle><circle r="70" fill="none" stroke="#2a2a2e" stroke-width="1.4"></circle><circle r="80" fill="none" stroke="#2a2a2e" stroke-width="1.4"></circle><circle r="90" fill="none" stroke="#2a2a2e" stroke-width="1.4"></circle><circle r="100" fill="none" stroke="#2a2a2e" stroke-width="1.4"></circle><circle r="110" fill="none" stroke="#2a2a2e" stroke-width="1.4"></circle><circle r="120" fill="none" stroke="#2a2a2e" stroke-width="1.4"></circle><circle r="130" fill="none" stroke="#2a2a2e" stroke-width="1.4"></circle><circle r="140" fill="none" stroke="#2a2a2e" stroke-width="1.4"></circle><circle r="54" fill="#6f5282"></circle><text x="0" y="-6" font-family="'Young Serif', serif" font-size="14" fill="#fff" text-anchor="middle">One song</text><text x="0" y="14" font-family="'Space Mono', monospace" font-size="8" fill="#fff" text-anchor="middle">learnt apart</text><circle r="5" fill="#141416"></circle></g></g><path d="M-182 -160 H-50 A20 20 0 0 0 -10 -160 H122 Q130 -160 130 -152 V152 Q130 160 122 160 H-182 Q-190 160 -190 152 V-152 Q-190 -160 -182 -160 Z" fill="#f7eefb"></path><text x="-30" y="-100" font-family="Fraunces, serif" font-size="34" font-weight="700" fill="#2b2b30" text-anchor="middle">One song</text><text x="-170" y="-50" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">voice and guitar</text><text x="-170" y="-24" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">performed on a call</text><text x="-170" y="2" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">applause: two</text></g></g><g transform="translate(420 150) scale(.7)"><g class="nt" style="--d:0.0s"><path d="M-6 14 V-20 L18 -26 V8" fill="none" stroke="#fff" stroke-width="3"></path><ellipse cx="-11" cy="14" rx="7" ry="5" fill="#fff"></ellipse><ellipse cx="13" cy="8" rx="7" ry="5" fill="#fff"></ellipse></g></g><g transform="translate(450 120) scale(.7)"><g class="nt" style="--d:0.4s"><path d="M-6 14 V-20 L18 -26 V8" fill="none" stroke="#fff" stroke-width="3"></path><ellipse cx="-11" cy="14" rx="7" ry="5" fill="#fff"></ellipse><ellipse cx="13" cy="8" rx="7" ry="5" fill="#fff"></ellipse></g></g><g transform="translate(480 150) scale(.7)"><g class="nt" style="--d:0.8s"><path d="M-6 14 V-20 L18 -26 V8" fill="none" stroke="#fff" stroke-width="3"></path><ellipse cx="-11" cy="14" rx="7" ry="5" fill="#fff"></ellipse><ellipse cx="13" cy="8" rx="7" ry="5" fill="#fff"></ellipse></g></g></svg>
