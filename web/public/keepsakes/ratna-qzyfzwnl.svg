<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 244 289" aria-hidden="true" focusable="false"><style>.joy .ksc-ratna .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-ratna .fb{opacity:0}
.joy .ksc-ratna.open .cf{animation:cfs_ratna .275s linear 5}
.joy .ksc-ratna.open .fa{animation:cfa_ratna 1.375s step-end both}
.joy .ksc-ratna.open .fb{animation:cfb_ratna 1.375s step-end both}
@keyframes cfs_ratna{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_ratna{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_ratna{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-ratna.open .toss{animation:tossup_ratna 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_ratna{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-ratna .cf,.joy .ksc-ratna .fa,.joy .ksc-ratna .fb,.joy .ksc-ratna .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#f6f3ec" stroke="#9aa0a6" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#9aa0a6" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#1f2b4d" text-anchor="middle">Ratna, SV Road</text><text x="0" y="16" font-family="Fraunces, serif" font-size="40" font-weight="700" fill="#1f2b4d" text-anchor="middle">11:58</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#1f2b4d" text-anchor="middle">idli, just in time</text><g transform="translate(0 -78) scale(0.5)"><path d="M10 -24 A26 26 0 1 0 10 24 A20 20 0 1 1 10 -24 Z" fill="#f5edc8"></path></g></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="34" font-weight="700" fill="#1f2b4d" text-anchor="middle">idli</text><text x="0" y="36" font-family="Kalam, cursive" font-size="17.8" fill="#1f2b4d" text-anchor="middle">with extra chutney</text></g></g></g></g></svg>
