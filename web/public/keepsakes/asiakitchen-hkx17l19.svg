@keyframes k186_asiakitchen{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-asiakitchen .gn{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-asiakitchen.open .gn{animation:k187_asiakitchen .5s cubic-bezier(.3,1.6,.5,1) calc(0.3s + var(--d, 0s)) both}
