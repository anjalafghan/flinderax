M-136.92 -20.0 H136.92 L126.91999999999999 2 L136.92 28.0 H-136.92 L-126.91999999999999 2 Z" fill="#7a1a16" opacity=".85"></path><path d="M-124.91999999999999 -24.0 H124.91999999999999 V24.0 Q0 30.0 -124.91999999999999 24.0 Z" fill="#7a1a16"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">Prithvi Theatre</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">row C, house full</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
