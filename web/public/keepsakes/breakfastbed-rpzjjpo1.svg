.joy .ksc-breakfastbed .pc{transform-box:fill-box}
.joy .ksc-breakfastbed.open .pc{animation:mg_breakfastbed .7s cubic-bezier(.3,0,.4,1)}
@keyframes mg_breakfastbed{0%{transform:translateY(0)}35%{transform:translateY(-34px) rotate(2deg)}70%{transform:translateY(0)}84%{transform:translateY(-8px)}100%{transform:none}}
