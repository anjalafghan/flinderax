<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 143 471 269" aria-hidden="true" focusable="false"><style>.joy .ksc-pizzaexpress .tear{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-pizzaexpress.open .tear{transform:translate(46px,22px) rotate(9deg);transition:transform 0.7s cubic-bezier(.3,1.2,.5,1) 0.2s}
.joy .ksc-pizzaexpress .punch{opacity:0;transition:opacity .15s}
.joy .ksc-pizzaexpress.open .punch{opacity:1;transition:opacity 0.3s ease-out calc(0.1s + var(--d, 0s))}
.joy .ksc-pizzaexpress .tk{transform-box:fill-box;transform-origin:0% 50%}
.joy .ksc-pizzaexpress.open .tk{animation:k269_pizzaexpress 2.2s ease-in-out 0.2s 1}
@keyframes k269_pizzaexpress{0%,100%{transform:rotate(0)}20%{transform:rotate(3deg)}45%{transform:rotate(-2.4000000000000004deg)}70%{transform:rotate(1.35deg)}88%{transform:rotate(-0.6000000000000001deg)}}
.joy .ksc-pizzaexpress .note{opacity:0;transition:opacity .15s}
.joy .ksc-pizzaexpress.open .note{opacity:1;transition:opacity 0.3s ease-out calc(0.7s + var(--d, 0s))}
