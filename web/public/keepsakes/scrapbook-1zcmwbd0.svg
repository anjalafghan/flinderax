<svg xmlns="http://www.w3.org/2000/svg" viewBox="133 123 325 320" aria-hidden="true" focusable="false"><style>.joy .ksc-scrapbook .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-scrapbook .pc{transform-box:fill-box;transform-origin:0% 100%}
.joy .ksc-scrapbook.open .pc{transform:rotate(-7deg) translate(-4px,-14px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.joy .ksc-scrapbook .pc{transition:transform .3s}
.joy .ksc-scrapbook .shine{opacity:0}
.joy .ksc-scrapbook.open .shine{animation:shn_scrapbook 1s ease-out .2s}
@keyframes shn_scrapbook{0%{opacity:0;transform:translateX(0)}30%{opacity:.45}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-scrapbook .pc,.joy .ksc-scrapbook .shine{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g class="dc-e"><g transform="translate(-60 -40) scale(2.4)" style="--w:7.50px"><path d="M0 22 C-30 0 -26 -24 -10 -24 C-4 -24 0 -18 0 -14 C0 -18 4 -24 10 -24 C26 -24 30 0 0 22 Z" fill="#e0245e"></path></g><g transform="translate(40 -70) scale(1.6)" style="--w:11.25px"><path d="M0 22 C-30 0 -26 -24 -10 -24 C-4 -24 0 -18 0 -14 C0 -18 4 -24 10 -24 C26 -24 30 0 0 22 Z" fill="#f2c230"></path></g><g transform="translate(50 10) scale(2.2)" style="--w:8.18px"><rect x="-30" y="-16" width="60" height="38" rx="6" fill="#3a2a5a"></rect><rect x="-14" y="-24" width="20" height="10" rx="2" fill="#3a2a5a"></rect><circle cy="3" r="12" fill="#f3efe2"></circle><circle cy="3" r="6" fill="#3a2a5a"></circle></g><g transform="translate(0 100) rotate(-2)" style="--w:9px"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#000" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#000"></path></g></g><g transform="translate(-60 -40) scale(2.4)"><path d="M0 22 C-30 0 -26 -24 -10 -24 C-4 -24 0 -18 0 -14 C0 -18 4 -24 10 -24 C26 -24 30 0 0 22 Z" fill="#e0245e"></path></g><g transform="translate(40 -70) scale(1.6)"><path d="M0 22 C-30 0 -26 -24 -10 -24 C-4 -24 0 -18 0 -14 C0 -18 4 -24 10 -24 C26 -24 30 0 0 22 Z" fill="#f2c230"></path></g><g transform="translate(50 10) scale(2.2)"><rect x="-30" y="-16" width="60" height="38" rx="6" fill="#3a2a5a"></rect><rect x="-14" y="-24" width="20" height="10" rx="2" fill="#3a2a5a"></rect><circle cy="3" r="12" fill="#f3efe2"></circle><circle cy="3" r="6" fill="#3a2a5a"></circle></g><g transform="translate(0 100) rotate(-2)"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#3a2a5a" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#3a2a5a"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="21.5" fill="#fbf8f1" text-anchor="middle">a scrapbook of us</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">washi tape everywhere</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
