<svg xmlns="http://www.w3.org/2000/svg" viewBox="202 168 208 281" aria-hidden="true" focusable="false"><style>.joy .ksc-duetonline .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-duetonline.open .pc{animation:k52_duetonline 2.2s ease-in-out 0s 1}
@keyframes k52_duetonline{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-duetonline .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-duetonline .shine{opacity:0}
.joy .ksc-duetonline.open .shine{animation:shn_duetonline 1s ease-out .15s}
@keyframes shn_duetonline{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-duetonline .shine,.joy .ksc-duetonline .pc{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g opacity=".9"><path d="M-30 -8 H30" stroke="#8a8f96" stroke-width="4"></path></g><g class="dc-e"><g transform="translate(-36 -20) scale(3.0)" style="--w:3.33px"><rect x="-6" y="-2" width="12" height="38" rx="5" fill="#3a1430"></rect><circle cy="-14" r="14" fill="#f7b9cf"></circle></g><g transform="translate(36 -20) scale(3.0)" style="--w:3.33px"><rect x="-6" y="-2" width="12" height="38" rx="5" fill="#3a1430"></rect><circle cy="-14" r="14" fill="#ffd5e6"></circle></g><g transform="translate(0 110) rotate(-2)" style="--w:5px"><path d="M-88.44 -20.0 H88.44 L78.44 2 L88.44 28.0 H-88.44 L-78.44 2 Z" fill="#000" opacity=".85"></path><path d="M-76.44 -24.0 H76.44 V24.0 Q0 30.0 -76.44 24.0 Z" fill="#000"></path></g></g><g transform="translate(-36 -20) scale(3.0)"><rect x="-6" y="-2" width="12" height="38" rx="5" fill="#3a1430"></rect><circle cy="-14" r="14" fill="#f7b9cf"></circle></g><g transform="translate(36 -20) scale(3.0)"><rect x="-6" y="-2" width="12" height="38" rx="5" fill="#3a1430"></rect><circle cy="-14" r="14" fill="#ffd5e6"></circle></g><g transform="translate(0 110) rotate(-2)"><path d="M-88.44 -20.0 H88.44 L78.44 2 L88.44 28.0 H-88.44 L-78.44 2 Z" fill="#5d3564" opacity=".85"></path><path d="M-76.44 -24.0 H76.44 V24.0 Q0 30.0 -76.44 24.0 Z" fill="#5d3564"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">the duet</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">you took the high part</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
