<svg xmlns="http://www.w3.org/2000/svg" viewBox="57 157 474 384" aria-hidden="true" focusable="false"><style>.joy .ksc-persiandarbar .sm{opacity:0;transform-box:fill-box}
.joy .ksc-persiandarbar.open .sm{animation:k286_persiandarbar 1.8s ease-out var(--d, 0s) 3}
@keyframes k286_persiandarbar{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-persiandarbar .gn{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-persiandarbar.open .gn{animation:k287_persiandarbar .5s cubic-bezier(.3,1.6,.5,1) calc(0.3s + var(--d, 0s)) both}
@keyframes k287_persiandarbar{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-persiandarbar .sm,.joy .ksc-persiandarbar .gn{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="320" rx="220" ry="150" fill="#c9ced3"></ellipse><ellipse cx="300" cy="320" rx="170" ry="112" fill="none" stroke="#9aa0a6" stroke-width="2"></ellipse><g transform="translate(290 300) scale(3)"><path d="M-30 -6 C-36 24 36 24 30 -6 Z" fill="#7a3a1a"></path><ellipse cy="-6" rx="30" ry="7" fill="#e9c46a"></ellipse><path d="M-20 -14 C-10 -22 10 -22 20 -14" fill="none" stroke="#e9c46a" stroke-width="4"></path></g><g transform="translate(300 420) scale(1.6)"><path d="M-44 0 H44" stroke="#9aa1a4" stroke-width="3"></path><path d="M-30 0 H30" stroke="#8c4a22" stroke-width="12" stroke-linecap="round"></path><g stroke="#3d1a0a" stroke-width="2" opacity=".6"><path d="M-18 -5 l-4 10 M-4 -5 l-4 10 M10 -5 l-4 10"></path></g></g><path class="sm" style="--d:0.00s" d="M240 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M300 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M360 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><g transform="translate(70 470) rotate(-6)"><path d="M0 0 H210 V60 H0 Z" fill="#fbf6ec"></path><text x="105" y="28" font-family="'Young Serif', serif" font-size="18" fill="#5a1d0c" text-anchor="middle">Persian Darbar</text><text x="105" y="46" font-family="'Space Mono', monospace" font-size="9" fill="#4a3a30" text-anchor="middle">biryani and kebabs, Lokhandwala</text></g></svg>
