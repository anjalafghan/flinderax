<svg xmlns="http://www.w3.org/2000/svg" viewBox="97 -30 396 561" aria-hidden="true" focusable="false"><style>.joy .ksc-bedtimestory .seal{transition:opacity .2s}
.joy .ksc-bedtimestory.open .seal{opacity:0;transition:opacity 0.15s calc(0s + var(--d, 0s))}
.joy .ksc-bedtimestory .lt{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-bedtimestory.open .lt{transform:translate(0px,-250px) rotate(0deg);transition:transform 0.8s cubic-bezier(.3,1.2,.5,1) 0.4s}
.joy .ksc-bedtimestory .flap{transform-box:fill-box;transform-origin:50% 0%;transition:transform .4s .3s,opacity 0s .3s}
.joy .ksc-bedtimestory.open .flap{transform:scaleY(-1);opacity:0;transition:transform .4s,opacity .25s .4s}
@media (prefers-reduced-motion:reduce){.joy .ksc-bedtimestory .flap,.joy .ksc-bedtimestory .seal,.joy .ksc-bedtimestory .lt{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><filter id="bedtimestory-e-sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".2"></feDropShadow></filter></defs><g transform="translate(110 240) rotate(-3)"><clipPath id="bedtimestory-ev-c"><rect x="-10" y="-400" width="380" height="630"></rect></clipPath><rect width="360" height="230" rx="12" fill="#f6efe0" filter="url(#bedtimestory-e-sh)"></rect><g clip-path="url(#bedtimestory-ev-c)"><g class="lt"><rect x="20" y="10" width="320" height="270" rx="4" fill="#fffdf6"></rect><text x="40" y="50" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">Once there was a cat</text><text x="40" y="80" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">who could not sleep, so</text><text x="40" y="110" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">she called the moon,</text><text x="40" y="140" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">who was also awake,</text><text x="40" y="170" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">and then you fell asleep.</text></g></g><path d="M0 230 L180.0 110 L360 230 Z" fill="#f6efe0" stroke="#d8c8a6"></path><path d="M0 0 L180.0 130 L0 230 Z M360 0 L180.0 130 L360 230 Z" fill="#f6efe0" stroke="#d8c8a6"></path><g class="flap"><path d="M0 0 H360 L180.0 140 Z" fill="#efe4cc" stroke="#d8c8a6"></path></g><g class="seal"><circle cx="180.0" cy="136" r="24" fill="#1f2b4d"></circle><circle cx="180.0" cy="136" r="17" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"></circle><g transform="translate(180 136) scale(0.4)"><path d="M10 -24 A26 26 0 1 0 10 24 A20 20 0 1 1 10 -24 Z" fill="#f5edc8"></path></g></g><text x="180.0" y="204" font-family="Kalam, cursive" font-size="22" fill="#2a3f7a" text-anchor="middle">once upon a time, sort of</text></g></svg>
