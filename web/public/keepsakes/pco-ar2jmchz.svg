<svg xmlns="http://www.w3.org/2000/svg" viewBox="117 55 394 466" aria-hidden="true" focusable="false"><style>.joy .ksc-pco .coin,.joy .ksc-pco .foil,.joy .ksc-pco .door,.joy .ksc-pco .flakes rect{transform-box:fill-box}
.joy .ksc-pco .foil{transform-origin:100% 50%;transition:transform .3s}
.joy .ksc-pco .door{transform-origin:0% 50%;transition:transform .5s}
.joy .ksc-pco .flakes rect{opacity:0}
.joy .ksc-pco.open .coin{animation:scrape_pco 1.3s ease-in-out both}
.joy .ksc-pco.open .foil{transform:scaleX(0);transition:transform 1.1s cubic-bezier(.5,0,.5,1) .15s}
.joy .ksc-pco.open .flakes rect{animation:flake_pco 1s ease-out .3s both}
.joy .ksc-pco.open .flakes rect:nth-child(2n){animation-delay:.6s}
.joy .ksc-pco.open .glow{opacity:1;transition:opacity .6s 1.3s}
.joy .ksc-pco.open .door{transform:scaleX(.18);transition:transform .7s cubic-bezier(.3,1,.4,1) 1.3s}
@keyframes scrape_pco{0%{transform:translate(0,0)}15%{transform:translate(-190px,-160px)}35%{transform:translate(-300px,-160px) rotate(-20deg)}55%{transform:translate(-210px,-150px) rotate(10deg)}75%{transform:translate(-330px,-154px) rotate(-10deg)}100%{transform:translate(0,0)}}
@keyframes flake_pco{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(6px,60px) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-pco .coin,.joy .ksc-pco .foil,.joy .ksc-pco .door,.joy .ksc-pco .flakes rect,.joy .ksc-pco .glow{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><filter id="pco-p-g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.3  0 0 0 0 0.3  0 0 0 0.1 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter>
<linearGradient id="pco-p-silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9ebee"></stop><stop offset=".5" stop-color="#a8adb5"></stop><stop offset="1" stop-color="#d9dce0"></stop></linearGradient>
<radialGradient id="pco-p-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".9"></stop><stop offset="1" stop-color="#ffcf6a" stop-opacity="0"></stop></radialGradient>
<radialGradient id="pco-p-coin" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f6e2a0"></stop><stop offset="1" stop-color="#9c7a2a"></stop></radialGradient>
<clipPath id="pco-p-panel"><rect x="60" y="250" width="200" height="54" rx="6"></rect></clipPath></defs>
<g transform="translate(130 90) rotate(-4)">
<path d="M0 130 C0 50 70 0 160 0 C250 0 320 50 320 130 V400 Q320 420 300 420 H20 Q0 420 0 400 Z" fill="#121214"></path><path d="M0 130 C0 50 70 0 160 0 C250 0 320 50 320 130 V400 Q320 420 300 420 H20 Q0 420 0 400 Z" filter="url(#pco-p-g)"></path><path d="M0 130 C0 50 70 0 160 0 C250 0 320 50 320 130 V400 Q320 420 300 420 H20 Q0 420 0 400 Z" fill="none" stroke="#f2c230" stroke-opacity=".35" stroke-width="1.5" transform="translate(8 8) scale(.95)"></path>
<g transform="translate(110 54)">
<ellipse class="glow" cx="50" cy="90" rx="120" ry="110" fill="url(#pco-p-glow)" opacity=".15"></ellipse>
<rect x="-6" y="0" width="112" height="30" fill="#f2c230"></rect>
<text x="50" y="21" font-family="'Space Mono', monospace" font-weight="700" font-size="14" fill="#7a1010" text-anchor="middle">STD·ISD·PCO</text>
<rect x="0" y="30" width="100" height="150" fill="#2a2a30" stroke="#f2c230" stroke-width="3"></rect>
<g class="door"><rect x="4" y="34" width="92" height="142" fill="#1b1b20"></rect><rect x="14" y="44" width="72" height="80" fill="#32353d"></rect><circle cx="82" cy="110" r="4" fill="#f2c230"></circle></g>
<g transform="translate(50 120)"><rect x="-22" y="-6" width="44" height="30" rx="5" fill="#f2c230"></rect><circle cy="9" r="9" fill="#121214"></circle><path d="M-26 -10 C-26 -24 26 -24 26 -10" stroke="#f2c230" stroke-width="8" fill="none" stroke-linecap="round"></path></g>
</g>
<text x="160" y="250" font-family="'Young Serif', serif" font-size="26" fill="#f2ecdf" text-anchor="middle" dy="-16">PCO</text>
<text x="160" y="320" font-family="'Space Mono', monospace" font-size="10" fill="#9a9aa0" text-anchor="middle" dy="28">password only · Kamala Mills</text>
<g transform="translate(0 0)">
<text x="160" y="286" font-family="'Permanent Marker', cursive" font-size="26" fill="#f2c230" text-anchor="middle">trunk call</text>
<g clip-path="url(#pco-p-panel)"><g class="foil"><rect x="60" y="250" width="200" height="54" fill="url(#pco-p-silver)"></rect>
<path d="M60 262 h200 M60 276 h200 M60 290 h200" stroke="#fff" stroke-opacity=".35"></path>
<text x="160" y="282" font-family="'Space Mono', monospace" font-size="10" fill="#5d626b" text-anchor="middle">scratch for tonight’s word</text></g></g>
<rect x="60" y="250" width="200" height="54" rx="6" fill="none" stroke="#5d626b" stroke-dasharray="3 3"></rect></g>
</g>
<g class="coin"><g transform="translate(470 470)"><circle r="30" fill="url(#pco-p-coin)" stroke="#7a5a1a" stroke-width="2"></circle><text y="9" font-family="'Young Serif', serif" font-size="24" fill="#6b4c12" text-anchor="middle">₹1</text></g></g>
<g class="flakes" fill="#c9cdd3"><rect x="200" y="380" width="5" height="3"></rect><rect x="240" y="392" width="4" height="4"></rect><rect x="290" y="384" width="6" height="3"></rect><rect x="330" y="396" width="4" height="3"></rect></g></svg>
