amily="'Space Mono', monospace" font-size="8" fill="#fbf8f1" text-anchor="middle">the floating matcha bar</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
