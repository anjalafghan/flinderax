<svg xmlns="http://www.w3.org/2000/svg" viewBox="192 189 258 248" aria-hidden="true" focusable="false"><style>.joy .ksc-hotchocbar .cu{transform-box:fill-box}
.joy .ksc-hotchocbar.open .cu{animation:k64_hotchocbar .09s linear 0.1s 4}
@keyframes k64_hotchocbar{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-hotchocbar .sm{opacity:0;transform-box:fill-box}
.joy .ksc-hotchocbar.open .sm{animation:k65_hotchocbar 1.8s ease-out var(--d, 0s) 3}
@keyframes k65_hotchocbar{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-70px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-hotchocbar .cu,.joy .ksc-hotchocbar .sm{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cu"><g transform="translate(300 320) rotate(-3)"><rect x="-90" y="-100" width="180" height="200" rx="24" fill="#c0392b"></rect><path d="M90 -50 C150 -50 150 50 90 50" fill="none" stroke="#c0392b" stroke-width="22"></path><ellipse cy="-100" rx="90" ry="14" fill="#4a2414"></ellipse><text x="0" y="0" font-family="Fraunces, serif" font-size="22.4" font-weight="800" fill="#fff" text-anchor="middle">built for you</text><text x="0" y="30" font-family="'Space Mono', monospace" font-size="9.0" fill="#fff" text-anchor="middle">marshmallow, cinnamon, chilli</text><g transform="translate(60 60) scale(0.6)"><path d="M-24 -10 C-10 0 14 4 26 22 C6 22 -18 8 -24 -10 Z" fill="#f2c230"></path><path d="M-24 -10 l-6 -8" stroke="#3f7d2c" stroke-width="4" stroke-linecap="round"></path></g><path class="sm" style="--d:0.00s" d="M-30 -110 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M0 -110 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M30 -110 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path></g></g></svg>
