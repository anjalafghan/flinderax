<svg xmlns="http://www.w3.org/2000/svg" viewBox="69 71 403 373" aria-hidden="true" focusable="false"><style>.joy .ksc-bedsheetcinema .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-bedsheetcinema .pc{transform-box:fill-box;transform-origin:0% 100%}
.joy .ksc-bedsheetcinema.open .pc{transform:rotate(-7deg) translate(-4px,-14px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.joy .ksc-bedsheetcinema .pc{transition:transform .3s}
.joy .ksc-bedsheetcinema .shine{opacity:0}
.joy .ksc-bedsheetcinema.open .shine{animation:shn_bedsheetcinema 1s ease-out .2s}
@keyframes shn_bedsheetcinema{0%{opacity:0;transform:translateX(0)}30%{opacity:.45}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-bedsheetcinema .pc,.joy .ksc-bedsheetcinema .shine{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g class="dc-e"><g transform="translate(0 -40) scale(3.4)" style="--w:5.29px"><path d="M-50 -30 H50" stroke="#e9f0f7" stroke-width="2"></path><path d="M-14 -28 L-34 -18 L-26 -4 L-18 -8 V30 H18 V-8 L26 -4 L34 -18 L14 -28 C8 -20 -8 -20 -14 -28 Z" fill="#e9f0f7"></path><rect x="-16" y="-34" width="5" height="12" fill="#d9b27a"></rect><rect x="11" y="-34" width="5" height="12" fill="#d9b27a"></rect></g><g transform="translate(80 30) scale(1.6)" style="--w:11.25px"><path d="M-20 -14 H20 L16 18 H-16 Z" fill="#f6f3ec"></path><ellipse cy="-14" rx="20" ry="5" fill="#f2c230"></ellipse><path d="M20 -6 C32 -6 32 10 18 10" fill="none" stroke="#f6f3ec" stroke-width="4"></path><ellipse cy="20" rx="26" ry="5" fill="#f6f3ec" opacity=".9"></ellipse></g><g transform="translate(0 100) rotate(-2)" style="--w:9px"><path d="M-136.92 -20.0 H136.92 L126.91999999999999 2 L136.92 28.0 H-136.92 L-126.91999999999999 2 Z" fill="#000" opacity=".85"></path><path d="M-124.91999999999999 -24.0 H124.91999999999999 V24.0 Q0 30.0 -124.91999999999999 24.0 Z" fill="#000"></path></g></g><g transform="translate(0 -40) scale(3.4)"><path d="M-50 -30 H50" stroke="#e9f0f7" stroke-width="2"></path><path d="M-14 -28 L-34 -18 L-26 -4 L-18 -8 V30 H18 V-8 L26 -4 L34 -18 L14 -28 C8 -20 -8 -20 -14 -28 Z" fill="#e9f0f7"></path><rect x="-16" y="-34" width="5" height="12" fill="#d9b27a"></rect><rect x="11" y="-34" width="5" height="12" fill="#d9b27a"></rect></g><g transform="translate(80 30) scale(1.6)"><path d="M-20 -14 H20 L16 18 H-16 Z" fill="#f6f3ec"></path><ellipse cy="-14" rx="20" ry="5" fill="#f2c230"></ellipse><path d="M20 -6 C32 -6 32 10 18 10" fill="none" stroke="#f6f3ec" stroke-width="4"></path><ellipse cy="20" rx="26" ry="5" fill="#f6f3ec" opacity=".9"></ellipse></g><g transform="translate(0 100) rotate(-2)"><path d="M-136.92 -20.0 H136.92 L126.91999999999999 2 L136.92 28.0 H-136.92 L-126.91999999999999 2 Z" fill="#22354c" opacity=".85"></path><path d="M-124.91999999999999 -24.0 H124.91999999999999 V24.0 Q0 30.0 -124.91999999999999 24.0 Z" fill="#22354c"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">bedsheet cinema</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">tonight: our pick</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
