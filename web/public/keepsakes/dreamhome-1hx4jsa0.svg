<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 129 306 315" aria-hidden="true" focusable="false"><style>.joy .ksc-dreamhome .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-dreamhome.open .pc{animation:k49_dreamhome 2.2s ease-in-out 0s 1}
@keyframes k49_dreamhome{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-dreamhome .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-dreamhome .shine{opacity:0}
.joy .ksc-dreamhome.open .shine{animation:shn_dreamhome 1s ease-out .15s}
@keyframes shn_dreamhome{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-dreamhome .shine,.joy .ksc-dreamhome .pc{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g opacity=".9"><path d="M-30 -8 H30" stroke="#8a8f96" stroke-width="4"></path></g><g class="dc-e"><g transform="translate(0 -20) scale(4.0)" style="--w:2.50px"><path d="M-26 24 V-4 L0 -26 L26 -4 V24 Z" fill="#f3efe2"></path><path d="M-32 0 L0 -30 L32 0" fill="none" stroke="#2c1f46" stroke-width="5" stroke-linecap="round"></path><rect x="-6" y="6" width="12" height="18" fill="#2c1f46"></rect></g><g transform="translate(100 30) scale(1.2)" style="--w:8.33px"><path d="M-16 6 H16 L12 30 H-12 Z" fill="#b5683a"></path><path d="M0 6 C0 -10 -14 -18 -22 -20 C-18 -8 -10 0 0 6 C0 -14 10 -24 22 -28 C20 -12 10 0 0 6" fill="#4f8a3a"></path></g><g transform="translate(0 100) rotate(-2)" style="--w:5px"><path d="M-134.52 -20.0 H134.52 L124.52000000000001 2 L134.52 28.0 H-134.52 L-124.52000000000001 2 Z" fill="#000" opacity=".85"></path><path d="M-122.52000000000001 -24.0 H122.52000000000001 V24.0 Q0 30.0 -122.52000000000001 24.0 Z" fill="#000"></path></g></g><g transform="translate(0 -20) scale(4.0)"><path d="M-26 24 V-4 L0 -26 L26 -4 V24 Z" fill="#f3efe2"></path><path d="M-32 0 L0 -30 L32 0" fill="none" stroke="#2c1f46" stroke-width="5" stroke-linecap="round"></path><rect x="-6" y="6" width="12" height="18" fill="#2c1f46"></rect></g><g transform="translate(100 30) scale(1.2)"><path d="M-16 6 H16 L12 30 H-12 Z" fill="#b5683a"></path><path d="M0 6 C0 -10 -14 -18 -22 -20 C-18 -8 -10 0 0 6 C0 -14 10 -24 22 -28 C20 -12 10 0 0 6" fill="#4f8a3a"></path></g><g transform="translate(0 100) rotate(-2)"><path d="M-134.52 -20.0 H134.52 L124.52000000000001 2 L134.52 28.0 H-134.52 L-124.52000000000001 2 Z" fill="#2c1f46" opacity=".85"></path><path d="M-122.52000000000001 -24.0 H122.52000000000001 V24.0 Q0 30.0 -122.52000000000001 24.0 Z" fill="#2c1f46"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">our dream home</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">the kitchen: argued over</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
