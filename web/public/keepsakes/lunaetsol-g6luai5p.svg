<g class="flame"><path d="M300 470 C288 452 296 440 300 428 C306 442 314 452 300 470 Z" fill="#ffb347"></path><path d="M300 466 C294 456 298 450 300 442 C303 450 306 456 300 466 Z" fill="#fff1b8"></path></g>
