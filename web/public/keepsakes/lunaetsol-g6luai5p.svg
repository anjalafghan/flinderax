<rect class="bread" x="-15" y="14" width="30" height="26" rx="5" fill="#d9a85c"></rect>
<path class="drip" d="M-10 38 C-10 52 -2 50 -2 62 C-2 70 -12 70 -10 62" fill="#f3cf68"></path>
<g transform="translate(0 -150)"><circle r="13" fill="none" stroke="url(#lunaetsol-l-brass)" stroke-width="5"></circle>
<g transform="translate(16 6) rotate(-18)"><rect width="126" height="78" rx="8" fill="url(#lunaetsol-l-check)"></rect><rect x="7" y="7" width="112" height="64" rx="5" fill="#fbf6ec"></rect>
<text x="63" y="32" font-family="'Young Serif', serif" font-size="17" fill="#7d1a16" text-anchor="middle">Luna Et Sol</text>
