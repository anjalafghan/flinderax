<svg xmlns="http://www.w3.org/2000/svg" viewBox="137 144 323 280" aria-hidden="true" focusable="false"><style>.joy .ksc-readaloud .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-readaloud.open .pc{animation:k46_readaloud 2.2s ease-in-out 0s 1}
@keyframes k46_readaloud{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-readaloud .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-readaloud .shine{opacity:0}
.joy .ksc-readaloud.open .shine{animation:shn_readaloud 1s ease-out .15s}
@keyframes shn_readaloud{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-readaloud .shine,.joy .ksc-readaloud .pc{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g opacity=".9"><path d="M-30 -8 H30" stroke="#8a8f96" stroke-width="4"></path></g><g class="dc-e"><g transform="translate(0 -10) scale(3.6)" style="--w:2.78px"><path d="M0 -20 C-14 -26 -30 -26 -40 -20 V22 C-30 16 -14 16 0 22 Z" fill="#f6efe0" stroke="#2f6d57" stroke-width="3"></path><path d="M0 -20 C14 -26 30 -26 40 -20 V22 C30 16 14 16 0 22 Z" fill="#f6efe0" stroke="#2f6d57" stroke-width="3"></path></g><g transform="translate(0 -90) scale(1.6)" style="--w:6.25px"><path d="M-6 14 V-20 L18 -26 V8" fill="none" stroke="#f2c230" stroke-width="3"></path><ellipse cx="-11" cy="14" rx="7" ry="5" fill="#f2c230"></ellipse><ellipse cx="13" cy="8" rx="7" ry="5" fill="#f2c230"></ellipse></g><g transform="translate(0 80) rotate(-2)" style="--w:5px"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#000" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#000"></path></g></g><g transform="translate(0 -10) scale(3.6)"><path d="M0 -20 C-14 -26 -30 -26 -40 -20 V22 C-30 16 -14 16 0 22 Z" fill="#f6efe0" stroke="#2f6d57" stroke-width="3"></path><path d="M0 -20 C14 -26 30 -26 40 -20 V22 C30 16 14 16 0 22 Z" fill="#f6efe0" stroke="#2f6d57" stroke-width="3"></path></g><g transform="translate(0 -90) scale(1.6)"><path d="M-6 14 V-20 L18 -26 V8" fill="none" stroke="#f2c230" stroke-width="3"></path><ellipse cx="-11" cy="14" rx="7" ry="5" fill="#f2c230"></ellipse><ellipse cx="13" cy="8" rx="7" ry="5" fill="#f2c230"></ellipse></g><g transform="translate(0 80) rotate(-2)"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#3e5036" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#3e5036"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="21.5" fill="#fbf8f1" text-anchor="middle">a chapter a night</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">voices for everyone</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
