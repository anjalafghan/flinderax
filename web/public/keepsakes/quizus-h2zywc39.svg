.joy .ksc-quizus .dc-d *{fill:#2a2018!important;stroke:#2a2018!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:.55!important;stroke-dasharray:none!important}
.joy .ksc-quizus .pc{transform-box:fill-box}
.joy .ksc-quizus.open .pc{animation:mg_quizus .7s cubic-bezier(.3,0,.4,1)}
