<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 128 394 312" aria-hidden="true" focusable="false"><style>.joy .ksc-powailake .spk{opacity:0;transition:opacity .15s}
.joy .ksc-powailake.open .spk{opacity:1;transition:opacity 0.3s ease-out calc(0.3s + var(--d, 0s))}
.joy .ksc-powailake .dc-e *{fill:#326174!important;stroke:#326174!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-powailake .dc-s *{fill:none!important;stroke:#fff8e8!important;stroke-width:var(--w)!important;stroke-dasharray:4 5!important;fill-opacity:1!important;stroke-opacity:.8!important;opacity:1!important}
.joy .ksc-powailake .pc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-powailake.open .pc{animation:pt_powailake .5s ease-out}
@keyframes pt_powailake{40%{transform:scale(.95)}100%{transform:none}}
