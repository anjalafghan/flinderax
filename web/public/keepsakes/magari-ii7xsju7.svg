<svg xmlns="http://www.w3.org/2000/svg" viewBox="192 189 258 248" aria-hidden="true" focusable="false"><style>.joy .ksc-magari .cu{transform-box:fill-box}
.joy .ksc-magari.open .cu{animation:k88_magari .09s linear 0.1s 4}
@keyframes k88_magari{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-magari .sm{opacity:0;transform-box:fill-box}
.joy .ksc-magari.open .sm{animation:k89_magari 1.8s ease-out var(--d, 0s) 3}
@keyframes k89_magari{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-70px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-magari .cu,.joy .ksc-magari .sm{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cu"><g transform="translate(300 320) rotate(-3)"><rect x="-90" y="-100" width="180" height="200" rx="24" fill="#2f4a33"></rect><path d="M90 -50 C150 -50 150 50 90 50" fill="none" stroke="#2f4a33" stroke-width="22"></path><ellipse cy="-100" rx="90" ry="14" fill="#4a2414"></ellipse><text x="0" y="0" font-family="Fraunces, serif" font-size="30" font-weight="800" fill="#f3ead8" text-anchor="middle">Magari</text><text x="0" y="30" font-family="'Space Mono', monospace" font-size="10" fill="#f3ead8" text-anchor="middle">Four Bungalows</text><path class="sm" style="--d:0.00s" d="M-30 -110 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M0 -110 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M30 -110 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path></g></g></svg>
