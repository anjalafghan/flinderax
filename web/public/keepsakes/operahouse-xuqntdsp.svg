<svg xmlns="http://www.w3.org/2000/svg" viewBox="156 191 302 253" aria-hidden="true" focusable="false"><style>.joy .ksc-operahouse .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-operahouse.open .pc{animation:k20_operahouse 2.2s ease-in-out 0s 1}
@keyframes k20_operahouse{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-operahouse .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-operahouse .shine{opacity:0}
.joy .ksc-operahouse.open .shine{animation:shn_operahouse 1s ease-out .15s}
@keyframes shn_operahouse{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-operahouse .shine,.joy .ksc-operahouse .pc{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g opacity=".9"><path d="M-30 -8 H30" stroke="#8a8f96" stroke-width="4"></path></g><g class="dc-e"><g transform="translate(0 -40) scale(3.0)" style="--w:3.33px"><path d="M-22 16 C-22 -24 22 -24 22 16 Z" fill="#e9c46a"></path><rect x="-26" y="14" width="52" height="6" rx="3" fill="#e9c46a"></rect><circle cy="24" r="5" fill="#e9c46a"></circle></g><g transform="translate(0 20) scale(2.6)" style="--w:3.85px"><path d="M-50 -10 C-25 10 25 10 50 -10" fill="none" stroke="#7a1a16" stroke-width="1.5"></path><circle cx="-40" cy="-6.4" r="4" fill="#ffe08a"></circle><circle cx="-24" cy="-2.3" r="4" fill="#ffe08a"></circle><circle cx="-8" cy="-0.3" r="4" fill="#ffe08a"></circle><circle cx="8" cy="-0.3" r="4" fill="#ffe08a"></circle><circle cx="24" cy="-2.3" r="4" fill="#ffe08a"></circle><circle cx="40" cy="-6.4" r="4" fill="#ffe08a"></circle></g><g transform="translate(0 100) rotate(-2)" style="--w:5px"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#000" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#000"></path></g></g><g transform="translate(0 -40) scale(3.0)"><path d="M-22 16 C-22 -24 22 -24 22 16 Z" fill="#e9c46a"></path><rect x="-26" y="14" width="52" height="6" rx="3" fill="#e9c46a"></rect><circle cy="24" r="5" fill="#e9c46a"></circle></g><g transform="translate(0 20) scale(2.6)"><path d="M-50 -10 C-25 10 25 10 50 -10" fill="none" stroke="#7a1a16" stroke-width="1.5"></path><circle cx="-40" cy="-6.4" r="4" fill="#ffe08a"></circle><circle cx="-24" cy="-2.3" r="4" fill="#ffe08a"></circle><circle cx="-8" cy="-0.3" r="4" fill="#ffe08a"></circle><circle cx="8" cy="-0.3" r="4" fill="#ffe08a"></circle><circle cx="24" cy="-2.3" r="4" fill="#ffe08a"></circle><circle cx="40" cy="-6.4" r="4" fill="#ffe08a"></circle></g><g transform="translate(0 100) rotate(-2)"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#7a1a16" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#7a1a16"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="21.5" fill="#fbf8f1" text-anchor="middle">Royal Opera House</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">box seats, since 1911</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
