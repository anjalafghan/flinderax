.joy .ksc-chowpattybhel .gn{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-chowpattybhel.open .gn{animation:k123_chowpattybhel .5s cubic-bezier(.3,1.6,.5,1) calc(0.3s + var(--d, 0s)) both}
@keyframes k123_chowpattybhel{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
