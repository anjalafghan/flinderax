<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 246 327 257" aria-hidden="true" focusable="false"><style>.joy .ksc-mokai .cu{transform-box:fill-box}
.joy .ksc-mokai.open .cu{animation:k73_mokai .09s linear 0.1s 4}
@keyframes k73_mokai{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-mokai .sm{opacity:0;transform-box:fill-box}
.joy .ksc-mokai.open .sm{animation:k74_mokai 1.8s ease-out var(--d, 0s) 3}
@keyframes k74_mokai{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-70px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-mokai .cu,.joy .ksc-mokai .sm{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cu"><g transform="translate(300 320) rotate(-3)"><ellipse cy="76" rx="150" ry="30" fill="#f6f3ec" stroke="#7aa35a" stroke-width="3"></ellipse><path d="M-100 -40 H100 C100 50 60 76 0 76 C-60 76 -100 50 -100 -40 Z" fill="#f6f3ec"></path><path d="M100 -20 C150 -20 150 40 90 40" fill="none" stroke="#f6f3ec" stroke-width="14"></path><ellipse cy="-40" rx="100" ry="16" fill="#8fbf5a"></ellipse><path d="M-96 -10 C-60 10 60 10 96 -10" fill="none" stroke="#7aa35a" stroke-width="5"></path><g transform="translate(0 140)"><text x="0" y="0" font-family="Caveat, cursive" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Mokai</text><text x="0" y="24" font-family="'Space Mono', monospace" font-size="10" fill="#fff" text-anchor="middle">Pali Hill, upstairs</text></g><path class="sm" style="--d:0.00s" d="M-30 -60 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M0 -60 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M30 -60 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path></g></g></svg>
