<svg xmlns="http://www.w3.org/2000/svg" viewBox="108 148 406 279" aria-hidden="true" focusable="false"><style>.joy .ksc-seasonaltastes .card{transform-box:fill-box;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.joy .ksc-seasonaltastes .pb{opacity:0;transition:opacity 0s .35s}
.joy .ksc-seasonaltastes .pf{transition:opacity 0s .35s}
.joy .ksc-seasonaltastes.open .card{transform:scaleX(-1) rotate(-3deg);transition:transform .7s cubic-bezier(.4,0,.2,1) .7s}
.joy .ksc-seasonaltastes.open .pb{opacity:1;transition:opacity 0s 1.05s}
.joy .ksc-seasonaltastes.open .pf{opacity:0;transition:opacity 0s 1.05s}
.joy .ksc-seasonaltastes .frank{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-seasonaltastes.open .frank{animation:frk_seasonaltastes .25s ease-out .15s both}
@keyframes frk_seasonaltastes{0%{opacity:0;transform:scale(1.7)}100%{opacity:.85;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-seasonaltastes .card,.joy .ksc-seasonaltastes .pb,.joy .ksc-seasonaltastes .pf,.joy .ksc-seasonaltastes .frank{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><clipPath id="seasonaltastes-pc-c"><rect width="360" height="230" rx="6"></rect></clipPath><linearGradient id="seasonaltastes-pc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c35"></stop><stop offset="1" stop-color="#2b3a63"></stop></linearGradient></defs><g transform="translate(120 186) rotate(-4)"><g class="card"><g class="pf"><g clip-path="url(#seasonaltastes-pc-c)"><rect width="360" height="230" fill="url(#seasonaltastes-pc-sky)"></rect><path d="M0 160 C90 150 270 170 360 156 V230 H0 Z" fill="#0f1a14"></path><g transform="translate(120 150) scale(2)"><path d="M-50 20 C-30 -20 -10 -24 6 4 C18 -30 36 -32 50 20 Z" fill="#1f3a2a"></path><path d="M-50 20 C-24 0 0 6 20 20 Z" fill="#14281c"></path></g><g transform="translate(280 60) scale(0.8)"><path d="M10 -24 A26 26 0 1 0 10 24 A20 20 0 1 1 10 -24 Z" fill="#f5edc8"></path></g><g transform="translate(180 160) scale(1.4)"><path d="M-50 -10 C-25 10 25 10 50 -10" fill="none" stroke="#1f2b4d" stroke-width="1.5"></path><circle cx="-40" cy="-6.4" r="4" fill="#ffe08a"></circle><circle cx="-24" cy="-2.3" r="4" fill="#ffe08a"></circle><circle cx="-8" cy="-0.3" r="4" fill="#ffe08a"></circle><circle cx="8" cy="-0.3" r="4" fill="#ffe08a"></circle><circle cx="24" cy="-2.3" r="4" fill="#ffe08a"></circle><circle cx="40" cy="-6.4" r="4" fill="#ffe08a"></circle></g></g><rect x="8" y="8" width="344" height="214" rx="4" fill="none" stroke="#fff" stroke-width="6"></rect><path d="M14 178 H326 L334 196 L326 214 H14 Z" fill="#fbf6ea"></path><text x="24" y="204" font-family="Caveat, cursive" font-size="28" font-weight="700" fill="#2a3f7a" text-anchor="start">over Aarey, 18th floor</text><g transform="translate(290 40) rotate(-12)"><g class="frank"><circle r="26" fill="none" stroke="#2a2a2a" stroke-width="2.4"></circle><path d="M30 -12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 -4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path></g></g></g><g class="pb" transform="translate(360 0) scale(-1 1)"><rect width="360" height="230" rx="6" fill="#fbf6ea"></rect><path d="M190.0 24 V206" stroke="#c9b48a"></path><text x="20" y="60" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">Late dinner,</text><text x="20" y="90" font-family="Kalam, cursive" font-size="18.8" fill="#2a3f7a" text-anchor="start">window seat, the</text><text x="20" y="120" font-family="Kalam, cursive" font-size="15.8" fill="#2a3f7a" text-anchor="start">dark green of Aarey</text><text x="20" y="150" font-family="Kalam, cursive" font-size="13.6" fill="#2a3f7a" text-anchor="start">and the lights beyond.</text><rect x="290" y="18" width="52" height="62" fill="#f2e3b3" stroke="#c0392b" stroke-dasharray="3 2"></rect><g transform="translate(316 49) scale(.5)"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#f1c84b"></path></g><path d="M204.0 120 H336" stroke="#c9b48a"></path><path d="M204.0 150 H336" stroke="#c9b48a"></path><path d="M204.0 180 H336" stroke="#c9b48a"></path><text x="208.0" y="114" font-family="Kalam, cursive" font-size="18" fill="#2a3f7a" text-anchor="start">to us</text></g></g></g></svg>
