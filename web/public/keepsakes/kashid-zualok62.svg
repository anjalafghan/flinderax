<svg xmlns="http://www.w3.org/2000/svg" viewBox="107 148 406 279" aria-hidden="true" focusable="false"><style>.joy .ksc-kashid .card{transform-box:fill-box;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.joy .ksc-kashid .pb{opacity:0;transition:opacity 0s .35s}
.joy .ksc-kashid .pf{transition:opacity 0s .35s}
.joy .ksc-kashid.open .card{transform:scaleX(-1) rotate(-3deg);transition:transform .7s cubic-bezier(.4,0,.2,1) .7s}
.joy .ksc-kashid.open .pb{opacity:1;transition:opacity 0s 1.05s}
.joy .ksc-kashid.open .pf{opacity:0;transition:opacity 0s 1.05s}
.joy .ksc-kashid .frank{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-kashid.open .frank{animation:frk_kashid .25s ease-out .15s both}
@keyframes frk_kashid{0%{opacity:0;transform:scale(1.7)}100%{opacity:.85;transform:none}}
