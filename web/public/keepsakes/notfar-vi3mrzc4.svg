<svg xmlns="http://www.w3.org/2000/svg" viewBox="121 -16 376 496" aria-hidden="true" focusable="false"><style>.joy .ksc-notfar .rb{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-notfar.open .rb{transform:translate(0px,-40px) rotate(0deg);transition:transform 0.3s cubic-bezier(.3,1.2,.5,1) 0s}
.joy .ksc-notfar .rb{transition:opacity .2s}
.joy .ksc-notfar.open .rb{opacity:0;transition:opacity 0.2s calc(0.15s + var(--d, 0s))}
.joy .ksc-notfar .lid{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-notfar.open .lid{transform:translate(40px,-150px) rotate(-12deg);transition:transform 0.6s cubic-bezier(.3,1.2,.5,1) 0.35s}
.joy .ksc-notfar .tr{opacity:0;transition:opacity .15s}
.joy .ksc-notfar.open .tr{opacity:1;transition:opacity 0.3s ease-out calc(0.5s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-notfar .rb,.joy .ksc-notfar .rb,.joy .ksc-notfar .lid,.joy .ksc-notfar .tr{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(300 330) rotate(-4)"><path d="M-150 -60 H150 L138 120 Q136 128 128 128 H-128 Q-136 128 -138 120 Z" fill="#f2e3b3" stroke="#00000022"></path><path d="M-150 -60 L-138 120 M150 -60 L138 120" stroke="#00000018" stroke-width="6"></path><g class="tr"><g transform="translate(0 -70) scale(2)"><path d="M-26 20 V-6 H26 V20 Z" fill="#f7c9d4"></path><path d="M-26 -6 C-20 2 -12 -4 -6 2 C0 -4 8 2 14 -4 C18 2 22 -2 26 -6" fill="none" stroke="#fff" stroke-width="4"></path><circle cy="-14" r="6" fill="#7a3a1a"></circle></g></g><path d="M-150 -60 H150 V-20 H-150 Z" fill="#f2e3b3" opacity=".0"></path><g class="lid"><path d="M-160 -96 Q-160 -104 -152 -104 H152 Q160 -104 160 -96 L156 -50 H-156 Z" fill="#f2e3b3" stroke="#00000022"></path><text x="16" y="-70" font-family="Caveat, cursive" font-size="32" font-weight="700" fill="#5a1d0c" text-anchor="middle">NotFar</text></g><g class="rb"><path d="M-160 -56 H160" stroke="#c0392b" stroke-width="8"></path><path d="M-112 -104 V126" stroke="#c0392b" stroke-width="10"></path><path d="M-112 -104 C-152 -154 -182 -114 -112 -104 C-42 -114 -72 -154 -112 -104 Z" fill="#c0392b"></path></g><g transform="translate(20 96)"><text x="0" y="0" font-family="'Space Mono', monospace" font-size="11" fill="#5a1d0c" text-anchor="middle">Bandra, a box to share</text></g></g></svg>
