<svg xmlns="http://www.w3.org/2000/svg" viewBox="108 148 406 279" aria-hidden="true" focusable="false"><style>.joy .ksc-upvan .card{transform-box:fill-box;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.joy .ksc-upvan .pb{opacity:0;transition:opacity 0s .35s}
.joy .ksc-upvan .pf{transition:opacity 0s .35s}
.joy .ksc-upvan.open .card{transform:scaleX(-1) rotate(-3deg);transition:transform .7s cubic-bezier(.4,0,.2,1) .7s}
.joy .ksc-upvan.open .pb{opacity:1;transition:opacity 0s 1.05s}
.joy .ksc-upvan.open .pf{opacity:0;transition:opacity 0s 1.05s}
.joy .ksc-upvan .frank{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-upvan.open .frank{animation:frk_upvan .25s ease-out .15s both}
@keyframes frk_upvan{0%{opacity:0;transform:scale(1.7)}100%{opacity:.85;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-upvan .card,.joy .ksc-upvan .pb,.joy .ksc-upvan .pf,.joy .ksc-upvan .frank{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><clipPath id="upvan-pc-c"><rect width="360" height="230" rx="6"></rect></clipPath><linearGradient id="upvan-pc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7b267"></stop><stop offset="1" stop-color="#f4845f"></stop></linearGradient></defs><g transform="translate(120 186) rotate(-4)"><g class="card"><g class="pf"><g clip-path="url(#upvan-pc-c)"><rect width="360" height="230" fill="url(#upvan-pc-sky)"></rect><path d="M0 160 C90 150 270 170 360 156 V230 H0 Z" fill="#5a8fa0"></path><g transform="translate(120 140) scale(1.8)"><path d="M-50 20 C-30 -20 -10 -24 6 4 C18 -30 36 -32 50 20 Z" fill="#5d7d4f"></path><path d="M-50 20 C-24 0 0 6 20 20 Z" fill="#3f5d36"></path></g><g transform="translate(260 110) scale(0.9)"><circle r="18" fill="#f6a04d"></circle><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(0)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(45)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(90)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(135)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(180)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(225)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(270)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(315)"></path></g><g transform="translate(180 196) scale(1.4)"><path d="M-44 -8 q11 -8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></path><path d="M-44 6 q11 -8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></path><path d="M-44 20 q11 -8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></path></g></g><rect x="8" y="8" width="344" height="214" rx="4" fill="none" stroke="#fff" stroke-width="6"></rect><path d="M14 178 H196 L204 196 L196 214 H14 Z" fill="#fbf6ea"></path><text x="24" y="204" font-family="Caveat, cursive" font-size="28" font-weight="700" fill="#2a3f7a" text-anchor="start">Upvan, Thane</text><g transform="translate(290 40) rotate(-12)"><g class="frank"><circle r="26" fill="none" stroke="#2a2a2a" stroke-width="2.4"></circle><path d="M30 -12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 -4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path></g></g></g><g class="pb" transform="translate(360 0) scale(-1 1)"><rect width="360" height="230" rx="6" fill="#fbf6ea"></rect><path d="M190.0 24 V206" stroke="#c9b48a"></path><text x="20" y="60" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">Local to Thane,</text><text x="20" y="90" font-family="Kalam, cursive" font-size="18.8" fill="#2a3f7a" text-anchor="start">walked up to the</text><text x="20" y="120" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">lake. The hills</text><text x="20" y="150" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">went orange.</text><rect x="290" y="18" width="52" height="62" fill="#f2e3b3" stroke="#c0392b" stroke-dasharray="3 2"></rect><g transform="translate(316 49) scale(.5)"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#f1c84b"></path></g><path d="M204.0 120 H336" stroke="#c9b48a"></path><path d="M204.0 150 H336" stroke="#c9b48a"></path><path d="M204.0 180 H336" stroke="#c9b48a"></path><text x="208.0" y="114" font-family="Kalam, cursive" font-size="18" fill="#2a3f7a" text-anchor="start">to us</text></g></g></g></svg>
