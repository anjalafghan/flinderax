<svg xmlns="http://www.w3.org/2000/svg" viewBox="77 96 503 466" aria-hidden="true" focusable="false"><style>.joy .ksc-glass .swing{transform-box:view-box;transform-origin:300px 110px}
.joy .ksc-glass .patches{opacity:.15;transition:opacity .4s}
.joy .ksc-glass.open .swing{animation:sway_glass 2.6s ease-in-out both}
.joy .ksc-glass.open .patches{opacity:1;transition:opacity 1s .2s}
.joy .ksc-glass.open .patches ellipse{animation:drift_glass 2.6s ease-in-out both}
.joy .ksc-glass.open .glint{animation:glint_glass .8s ease-out .5s both}
@keyframes sway_glass{0%,100%{transform:rotate(0)}20%{transform:rotate(9deg)}45%{transform:rotate(-7deg)}70%{transform:rotate(4deg)}88%{transform:rotate(-2deg)}}
@keyframes drift_glass{20%{transform:translateX(-26px)}45%{transform:translateX(20px)}70%{transform:translateX(-10px)}}
@keyframes glint_glass{0%{opacity:0}40%{opacity:1}100%{opacity:0;transform:translate(60px,30px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-glass .swing,.joy .ksc-glass .patches,.joy .ksc-glass .patches ellipse,.joy .ksc-glass .glint{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><radialGradient id="glass-g-sheen" cx=".3" cy=".25" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"></stop><stop offset=".4" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
<filter id="glass-g-blur"><feGaussianBlur stdDeviation="8"></feGaussianBlur></filter></defs>
<g class="patches" filter="url(#glass-g-blur)"><ellipse cx="373" cy="424" rx="34" ry="14" fill="#c8312b" opacity=".55"></ellipse><ellipse cx="476" cy="451" rx="34" ry="14" fill="#2f6db5" opacity=".55"></ellipse><ellipse cx="476" cy="489" rx="34" ry="14" fill="#e8b923" opacity=".55"></ellipse><ellipse cx="373" cy="516" rx="34" ry="14" fill="#3b9a5a" opacity=".55"></ellipse><ellipse cx="227" cy="516" rx="34" ry="14" fill="#8a3fa0" opacity=".55"></ellipse><ellipse cx="124" cy="489" rx="34" ry="14" fill="#e46f2a" opacity=".55"></ellipse><ellipse cx="124" cy="451" rx="34" ry="14" fill="#2aa3a8" opacity=".55"></ellipse><ellipse cx="227" cy="424" rx="34" ry="14" fill="#d94f8a" opacity=".55"></ellipse></g>
<path d="M300 0 V110" stroke="#e9e1cf" stroke-width="2"></path>
<g class="swing"><g transform="translate(300 250)">
<circle cy="-128" r="14" fill="none" stroke="#9a9ea4" stroke-width="5"></circle>
<path d="M0 0 L0.0 -110.0 A110 110 0 0 1 77.8 -77.8 Z" fill="#c8312b" fill-opacity=".78"></path><path d="M0 0 L77.8 -77.8 A110 110 0 0 1 110.0 0.0 Z" fill="#2f6db5" fill-opacity=".78"></path><path d="M0 0 L110.0 0.0 A110 110 0 0 1 77.8 77.8 Z" fill="#e8b923" fill-opacity=".78"></path><path d="M0 0 L77.8 77.8 A110 110 0 0 1 0.0 110.0 Z" fill="#3b9a5a" fill-opacity=".78"></path><path d="M0 0 L0.0 110.0 A110 110 0 0 1 -77.8 77.8 Z" fill="#8a3fa0" fill-opacity=".78"></path><path d="M0 0 L-77.8 77.8 A110 110 0 0 1 -110.0 0.0 Z" fill="#e46f2a" fill-opacity=".78"></path><path d="M0 0 L-110.0 0.0 A110 110 0 0 1 -77.8 -77.8 Z" fill="#2aa3a8" fill-opacity=".78"></path><path d="M0 0 L-77.8 -77.8 A110 110 0 0 1 -0.0 -110.0 Z" fill="#d94f8a" fill-opacity=".78"></path>
<circle r="46" fill="#f3efe2" fill-opacity=".92"></circle>
<text y="12" font-family="'Young Serif', serif" font-size="34" fill="#3a2a5a" text-anchor="middle">A&amp;D</text>
<g fill="none" stroke="#3b3d42" stroke-width="5" stroke-linejoin="round"><circle r="110"></circle><circle r="46"></circle>
<path d="M0.0 -46.0 L0.0 -110.0"></path><path d="M32.5 -32.5 L77.8 -77.8"></path><path d="M46.0 0.0 L110.0 0.0"></path><path d="M32.5 32.5 L77.8 77.8"></path><path d="M0.0 46.0 L0.0 110.0"></path><path d="M-32.5 32.5 L-77.8 77.8"></path><path d="M-46.0 0.0 L-110.0 0.0"></path><path d="M-32.5 -32.5 L-77.8 -77.8"></path></g>
<circle r="110" fill="url(#glass-g-sheen)"></circle>
<path class="glint" d="M-70 -60 L-40 -84" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0"></path>
</g></g>
