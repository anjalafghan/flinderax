<svg xmlns="http://www.w3.org/2000/svg" viewBox="103 115 370 351" aria-hidden="true" focusable="false"><style>.joy .ksc-dreamhome .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-dreamhome.open .mk{stroke-dashoffset:0;transition:stroke-dashoffset 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-dreamhome .mw{opacity:0;transition:opacity .15s}
.joy .ksc-dreamhome.open .mw{opacity:1;transition:opacity 0.15s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-dreamhome .ring{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-dreamhome.open .ring{stroke-dashoffset:0;transition:stroke-dashoffset 0.6s ease-out calc(1.1s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-dreamhome .mk,.joy .ksc-dreamhome .mw,.joy .ksc-dreamhome .ring{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(115.0 145.0) rotate(-3)"><path d="M12 0 H296 L330 34 V298 Q330 310 318 310 H12 Q0 310 0 298 V12 Q0 0 12 0 Z" fill="#e6eef6"></path><circle cx="20" cy="125.0" r="6" fill="#00000055"></circle><circle cx="20" cy="185.0" r="6" fill="#00000055"></circle><text x="20" y="46" font-family="'Young Serif', serif" font-size="24" fill="#1f3a5a" text-anchor="start">Dream home</text><text x="20" y="70" font-family="'Space Mono', monospace" font-size="10" fill="#6b6658" text-anchor="start">one room each, then swap</text><text x="240" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#1f4bb5" text-anchor="middle">me</text><text x="290" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#c0392b" text-anchor="middle">you</text><text x="34" y="130" font-family="Kalam, cursive" font-size="18" fill="#1f3a5a" text-anchor="start">your reading nook</text><path d="M16 143 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.15s" pathLength="1" d="M231 124 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><path class="mk" style="--d:0.25s" pathLength="1" d="M281 124 l6 7 l12 -16" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"></path><text x="34" y="170" font-family="Kalam, cursive" font-size="18" fill="#1f3a5a" text-anchor="start">my balcony garden</text><path d="M16 183 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.35s" pathLength="1" d="M231 164 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><path class="mk" style="--d:0.45s" pathLength="1" d="M281 164 l6 7 l12 -16" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"></path><text x="34" y="210" font-family="Kalam, cursive" font-size="14.9" fill="#1f3a5a" text-anchor="start">the kitchen (a fight)</text><path d="M16 223 H314" stroke="#c9c2b0"></path><text style="--d:0.55s" class="mw" x="240" y="210" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle"></text><text style="--d:0.65s" class="mw" x="290" y="210" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle"></text><text x="34" y="250" font-family="Kalam, cursive" font-size="10.4" fill="#1f3a5a" text-anchor="start">a room for the cat we will get</text><path d="M16 263 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.75s" pathLength="1" d="M231 244 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><path class="mk" style="--d:0.85s" pathLength="1" d="M281 244 l6 7 l12 -16" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"></path><path class="ring" pathLength="1" d="M12 214 C40 188 300 186 322 208 C330 230 40 232 10 216" fill="none" stroke="#2c7a3f" stroke-width="2.4"></path><g transform="translate(280 40) scale(0.7)"><path d="M-26 24 V-4 L0 -26 L26 -4 V24 Z" fill="#f6efe0"></path><path d="M-32 0 L0 -30 L32 0" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"></path><rect x="-6" y="6" width="12" height="18" fill="#c0392b"></rect></g></g></svg>
