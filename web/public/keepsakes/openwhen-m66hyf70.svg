<svg xmlns="http://www.w3.org/2000/svg" viewBox="97 -30 396 561" aria-hidden="true" focusable="false"><style>.joy .ksc-openwhen .seal{transition:opacity .2s}
.joy .ksc-openwhen.open .seal{opacity:0;transition:opacity 0.15s calc(0s + var(--d, 0s))}
.joy .ksc-openwhen .lt{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-openwhen.open .lt{transform:translate(0px,-250px) rotate(0deg);transition:transform 0.8s cubic-bezier(.3,1.2,.5,1) 0.4s}
.joy .ksc-openwhen .flap{transform-box:fill-box;transform-origin:50% 0%;transition:transform .4s .3s,opacity 0s .3s}
.joy .ksc-openwhen.open .flap{transform:scaleY(-1);opacity:0;transition:transform .4s,opacity .25s .4s}
@media (prefers-reduced-motion:reduce){.joy .ksc-openwhen .flap,.joy .ksc-openwhen .seal,.joy .ksc-openwhen .lt{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><filter id="openwhen-e-sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".2"></feDropShadow></filter></defs><g transform="translate(110 240) rotate(-3)"><clipPath id="openwhen-ev-c"><rect x="-10" y="-400" width="380" height="630"></rect></clipPath><rect width="360" height="230" rx="12" fill="#f6efe0" filter="url(#openwhen-e-sh)"></rect><g clip-path="url(#openwhen-ev-c)"><g class="lt"><rect x="20" y="10" width="320" height="270" rx="4" fill="#fffdf6"></rect><text x="40" y="50" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">Open when you miss me:</text><text x="40" y="80" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">I miss you more.</text><text x="40" y="110" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">Look up, same sky.</text><text x="40" y="140" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">Call me, even late.</text><text x="40" y="170" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">(four more to go)</text></g></g><path d="M0 230 L180.0 110 L360 230 Z" fill="#f6efe0" stroke="#d8c8a6"></path><path d="M0 0 L180.0 130 L0 230 Z M360 0 L180.0 130 L360 230 Z" fill="#f6efe0" stroke="#d8c8a6"></path><g class="flap"><path d="M0 0 H360 L180.0 140 Z" fill="#efe4cc" stroke="#d8c8a6"></path></g><g class="seal"><circle cx="180.0" cy="136" r="24" fill="#c2185b"></circle><circle cx="180.0" cy="136" r="17" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"></circle><g transform="translate(180 136) scale(0.4)"><path d="M0 22 C-30 0 -26 -24 -10 -24 C-4 -24 0 -18 0 -14 C0 -18 4 -24 10 -24 C26 -24 30 0 0 22 Z" fill="#ffffff"></path></g></g><text x="180.0" y="204" font-family="Kalam, cursive" font-size="22" fill="#2a3f7a" text-anchor="middle">open when you miss me</text></g></svg>
