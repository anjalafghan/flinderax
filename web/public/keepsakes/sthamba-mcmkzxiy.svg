<svg xmlns="http://www.w3.org/2000/svg" viewBox="103 115 370 351" aria-hidden="true" focusable="false"><style>.joy .ksc-sthamba .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-sthamba.open .mk{stroke-dashoffset:0;transition:stroke-dashoffset 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-sthamba .mw{opacity:0;transition:opacity .15s}
.joy .ksc-sthamba.open .mw{opacity:1;transition:opacity 0.15s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-sthamba .ring{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-sthamba.open .ring{stroke-dashoffset:0;transition:stroke-dashoffset 0.6s ease-out calc(1.1s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-sthamba .mk,.joy .ksc-sthamba .mw,.joy .ksc-sthamba .ring{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(115.0 145.0) rotate(-3)"><path d="M12 0 H296 L330 34 V298 Q330 310 318 310 H12 Q0 310 0 298 V12 Q0 0 12 0 Z" fill="#fbf8ef"></path><circle cx="20" cy="125.0" r="6" fill="#00000055"></circle><circle cx="20" cy="185.0" r="6" fill="#00000055"></circle><text x="20" y="46" font-family="'Young Serif', serif" font-size="24" fill="#2b2b30" text-anchor="start">Sthamba flight</text><text x="20" y="70" font-family="'Space Mono', monospace" font-size="10" fill="#6b6658" text-anchor="start">Lokhandwala, four small glasses</text><text x="240" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#1f4bb5" text-anchor="middle">me</text><text x="290" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#c0392b" text-anchor="middle">you</text><text x="34" y="130" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">the wheat one</text><path d="M16 143 H314" stroke="#c9c2b0"></path><text style="--d:0.15s" class="mw" x="240" y="130" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">8</text><text style="--d:0.25s" class="mw" x="290" y="130" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">9</text><text x="34" y="170" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">the lager</text><path d="M16 183 H314" stroke="#c9c2b0"></path><text style="--d:0.35s" class="mw" x="240" y="170" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">7</text><text style="--d:0.45s" class="mw" x="290" y="170" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">7</text><text x="34" y="210" font-family="Kalam, cursive" font-size="15.6" fill="#2b2b30" text-anchor="start">the IPA (too bitter)</text><path d="M16 223 H314" stroke="#c9c2b0"></path><text style="--d:0.55s" class="mw" x="240" y="210" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">4</text><text style="--d:0.65s" class="mw" x="290" y="210" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">8</text><text x="34" y="250" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">the stout</text><path d="M16 263 H314" stroke="#c9c2b0"></path><text style="--d:0.75s" class="mw" x="240" y="250" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">9</text><text style="--d:0.85s" class="mw" x="290" y="250" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">6</text><path class="ring" pathLength="1" d="M12 134 C40 108 300 106 322 128 C330 150 40 152 10 136" fill="none" stroke="#2c7a3f" stroke-width="2.4"></path></g></svg>
