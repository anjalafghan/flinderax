<svg xmlns="http://www.w3.org/2000/svg" viewBox="97 37 382 574" aria-hidden="true" focusable="false"><style>.joy .ksc-bookstore .card{transform-box:fill-box;transition:transform .4s ease-in}
.joy .ksc-bookstore .stamp{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-bookstore.open .card{transform:translate(70px,-250px) rotate(6deg);transition:transform .7s cubic-bezier(.3,1.2,.5,1)}
.joy .ksc-bookstore.open .stamp{animation:thunk_bookstore .25s ease-out var(--d) both}
@keyframes thunk_bookstore{0%{opacity:0;scale:1.8}100%{opacity:.9;scale:1}}
@media (prefers-reduced-motion:reduce){.joy .ksc-bookstore .card,.joy .ksc-bookstore .stamp{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><filter id="bookstore-bk-g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0.14 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter>
<linearGradient id="bookstore-bk-cover" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f1d1d"></stop><stop offset=".08" stop-color="#b52a26"></stop><stop offset="1" stop-color="#a32321"></stop></linearGradient></defs>
<g transform="translate(110 120) rotate(-6)">
<rect width="300" height="400" rx="6" fill="url(#bookstore-bk-cover)"></rect><rect width="300" height="400" rx="6" filter="url(#bookstore-bk-g)"></rect>
<path d="M18 0 V400" stroke="#6e1414" stroke-width="3"></path>
<text x="160" y="80" font-family="Fraunces, serif" font-style="italic" font-size="34" fill="#f4e3c4" text-anchor="middle">a red one</text>
<text x="160" y="110" font-family="'Space Mono', monospace" font-size="11" fill="#f4e3c4" text-anchor="middle">under ₹300, as dared</text>
<g transform="translate(236 30) rotate(12)"><circle r="26" fill="#f2c230"></circle><text y="6" font-family="'Space Mono', monospace" font-weight="700" font-size="14" fill="#6e1414" text-anchor="middle">₹299</text></g>
<path d="M40 250 H280 V390 H40 Z" fill="#efe1c0"></path><path d="M40 250 C110 270 210 270 280 250" fill="none" stroke="#c9b48a" stroke-width="2"></path>
</g>
<g class="card"><g transform="translate(130 300) rotate(-4)">
<path d="M0 0 H270 V300 H0 Z" fill="#fbfaf4"></path>
<text x="20" y="36" font-family="'Young Serif', serif" font-size="20" fill="#2b2b30">Crossword, Vashi</text>
<text x="20" y="58" font-family="'Space Mono', monospace" font-size="9.5" fill="#6b6b75">dare · found it · stamped</text>
<path d="M14 70 H256" stroke="#c0392b" stroke-width="1.5"></path><text x="20" y="108" font-family="Kalam, cursive" font-size="16" fill="#2b2b30">a red cover under ₹300</text><path d="M14 120 H250" stroke="#b9c3d6"></path><g class="stamp" style="--d:0.7s" transform="translate(212 102) rotate(-10)"><rect x="-34" y="-13" width="68" height="24" rx="3" fill="none" stroke="#6a2c8c" stroke-width="2"></rect><text y="5" font-family="'Space Mono', monospace" font-weight="700" font-size="12" fill="#6a2c8c" text-anchor="middle">DONE</text></g><text x="20" y="152" font-family="Kalam, cursive" font-size="16" fill="#2b2b30">read page 42 aloud</text><path d="M14 164 H250" stroke="#b9c3d6"></path><g class="stamp" style="--d:1.0499999999999998s" transform="translate(212 146) rotate(-5)"><rect x="-34" y="-13" width="68" height="24" rx="3" fill="none" stroke="#6a2c8c" stroke-width="2"></rect><text y="5" font-family="'Space Mono', monospace" font-weight="700" font-size="12" fill="#6a2c8c" text-anchor="middle">DONE</text></g><text x="20" y="196" font-family="Kalam, cursive" font-size="16" fill="#2b2b30">a book older than us</text><path d="M14 208 H250" stroke="#b9c3d6"></path><g class="stamp" style="--d:1.4s" transform="translate(212 190) rotate(0)"><rect x="-34" y="-13" width="68" height="24" rx="3" fill="none" stroke="#6a2c8c" stroke-width="2"></rect><text y="5" font-family="'Space Mono', monospace" font-weight="700" font-size="12" fill="#6a2c8c" text-anchor="middle">DONE</text></g><text x="20" y="240" font-family="Kalam, cursive" font-size="16" fill="#2b2b30">one to swap, wrapped</text><path d="M14 252 H250" stroke="#b9c3d6"></path><g class="stamp" style="--d:1.7499999999999998s" transform="translate(212 234) rotate(5)"><rect x="-34" y="-13" width="68" height="24" rx="3" fill="none" stroke="#6a2c8c" stroke-width="2"></rect><text y="5" font-family="'Space Mono', monospace" font-weight="700" font-size="12" fill="#6a2c8c" text-anchor="middle">DONE</text></g>
</g></g>
