<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 138 318 284" aria-hidden="true" focusable="false"><style>.joy .ksc-aquarium .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-aquarium .pc{transform-box:fill-box;transform-origin:0% 100%}
.joy .ksc-aquarium.open .pc{transform:rotate(-7deg) translate(-4px,-14px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.joy .ksc-aquarium .pc{transition:transform .3s}
.joy .ksc-aquarium .shine{opacity:0}
.joy .ksc-aquarium.open .shine{animation:shn_aquarium 1s ease-out .2s}
@keyframes shn_aquarium{0%{opacity:0;transform:translateX(0)}30%{opacity:.45}100%{opacity:0;transform:translateX(280px)}}
