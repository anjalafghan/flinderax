70 -100) scale(0.8)"><path d="M0 -24 C-14 -4 -16 6 -16 12 a16 16 0 0 0 32 0 C16 6 14 -4 0 -24 Z" fill="#bfe3f2"></path></g><g transform="translate(0 80) rotate(-2)"><path d="M-119.16 -20.0 H119.16 L109.16 2 L119.16 28.0 H-119.16 L-109.16 2 Z" fill="#2f6db5" opacity=".85"></path><path d="M-107.16 -24.0 H107.16 V24.0 Q0 30.0 -107.16 24.0 Z" fill="#2f6db5"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">Taraporewala</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">the one that stared back</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
