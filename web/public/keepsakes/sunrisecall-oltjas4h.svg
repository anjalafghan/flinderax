.joy .ksc-sunrisecall .dc-e *{fill:#843b1f!important;stroke:#843b1f!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-sunrisecall .dc-s *{fill:none!important;stroke:#fff8e8!important;stroke-width:var(--w)!important;stroke-dasharray:4 5!important;fill-opacity:1!important;stroke-opacity:.8!important;opacity:1!important}
.joy .ksc-sunrisecall .pc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-sunrisecall.open .pc{animation:pt_sunrisecall .5s ease-out}
@keyframes pt_sunrisecall{40%{transform:scale(.95)}100%{transform:none}}
