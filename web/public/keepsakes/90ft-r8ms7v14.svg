<svg xmlns="http://www.w3.org/2000/svg" viewBox="145 95 310 441" aria-hidden="true" focusable="false"><style>.joy .ksc-90ft .shine{opacity:0}
.joy .ksc-90ft.open .shine{animation:shn_90ft .9s ease-out .2s}
@keyframes shn_90ft{0%{opacity:0;transform:translateX(0)}30%{opacity:.6}100%{opacity:0;transform:translateX(160px)}}
.joy .ksc-90ft .bd{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-90ft.open .bd{animation:k198_90ft 2.2s ease-in-out 0s 1}
@keyframes k198_90ft{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}45%{transform:rotate(-4.0deg)}70%{transform:rotate(2.25deg)}88%{transform:rotate(-1.0deg)}}
.joy .ksc-90ft .tails{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-90ft.open .tails{animation:flut_90ft .3s ease-in-out 5 alternate}
@keyframes flut_90ft{to{transform:skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-90ft .tails,.joy .ksc-90ft .shine,.joy .ksc-90ft .bd{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="bd"><g transform="translate(300 250) rotate(-6)"><g class="tails"><path d="M-60 80 L-90 260 L-60 236 L-36 266 L-10 96 Z" fill="#c9a14a"></path><path d="M60 80 L90 260 L60 236 L36 266 L10 96 Z" fill="#2f6d57"></path></g><circle r="130" fill="#2f6d57"></circle><circle r="120" fill="#c9a14a"></circle><circle r="108" fill="none" stroke="#1d211b" stroke-opacity=".4" stroke-dasharray="3 5"></circle><text x="0" y="-44" font-family="'Young Serif', serif" font-size="26" fill="#1d211b" text-anchor="middle">90 Ft Above</text><text x="0" y="20" font-family="Fraunces, serif" font-size="52" font-weight="800" fill="#1d211b" text-anchor="middle">90 ft</text><text x="0" y="56" font-family="'Space Mono', monospace" font-size="11" fill="#1d211b" text-anchor="middle">Borivali West, outdoors</text><path class="shine" d="M-90 -40 L-40 -110 L-20 -110 L-70 -40 Z" fill="#fff" opacity="0"></path></g></g></svg>
