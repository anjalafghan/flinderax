<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 41 563 545" aria-hidden="true" focusable="false"><style>.joy .ksc-noplan .route{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s linear}
.joy .ksc-noplan .turn,.joy .ksc-noplan .end{opacity:0;transition:opacity .15s linear}
.joy .ksc-noplan .ask{transition:opacity .3s linear .2s}
.joy .ksc-noplan .toss,.joy .ksc-noplan .spin,.joy .ksc-noplan .coin-shadow{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-noplan .face-b{opacity:0}
.joy .ksc-noplan.open .route{stroke-dashoffset:0;transition:stroke-dashoffset 1.6s cubic-bezier(.4,0,.6,1) 1.15s}
.joy .ksc-noplan.open .turn{opacity:1;transition:opacity .25s ease-out var(--d)}
.joy .ksc-noplan.open .end{opacity:1;transition:opacity .5s ease-out 2.8s}
.joy .ksc-noplan.open .ask{opacity:0;transition-delay:0s}
.joy .ksc-noplan.open .toss{animation:toss_noplan 1.1s cubic-bezier(.3,0,.7,1)}
.joy .ksc-noplan.open .spin{animation:spin_noplan .275s linear 4}
.joy .ksc-noplan.open .face-a{animation:fa_noplan .275s step-end 4}
.joy .ksc-noplan.open .face-b{animation:fb_noplan .275s step-end 4}
.joy .ksc-noplan.open .coin-shadow{animation:shadow_noplan 1.1s cubic-bezier(.3,0,.7,1)}
@keyframes toss_noplan{0%{transform:translateY(0)}50%{transform:translateY(-190px)}88%{transform:translateY(0)}94%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes spin_noplan{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes fa_noplan{0%{opacity:1}25%{opacity:0}75%{opacity:1}}
@keyframes fb_noplan{0%{opacity:0}25%{opacity:1}75%{opacity:0}}
@keyframes shadow_noplan{0%,100%{transform:scale(1);opacity:.32}50%{transform:scale(.45);opacity:.12}}
@media (prefers-reduced-motion:reduce){.joy .ksc-noplan .route,.joy .ksc-noplan .turn,.joy .ksc-noplan .end,.joy .ksc-noplan .ask{transition-duration:.01s!important;transition-delay:0s!important}
.joy .ksc-noplan.open .toss,.joy .ksc-noplan.open .spin,.joy .ksc-noplan.open .face-a,.joy .ksc-noplan.open .face-b,.joy .ksc-noplan.open .coin-shadow{animation:none}}</style><defs>
