<svg xmlns="http://www.w3.org/2000/svg" viewBox="99 141 396 291" aria-hidden="true" focusable="false"><style>.joy .ksc-kondana .spk{opacity:0;transition:opacity .15s}
.joy .ksc-kondana.open .spk{opacity:1;transition:opacity 0.3s ease-out calc(0.3s + var(--d, 0s))}
.joy .ksc-kondana .dc-e *{fill:#3f553b!important;stroke:#3f553b!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-kondana .dc-s *{fill:none!important;stroke:#fff8e8!important;stroke-width:var(--w)!important;stroke-dasharray:4 5!important;fill-opacity:1!important;stroke-opacity:.8!important;opacity:1!important}
.joy .ksc-kondana .pc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-kondana.open .pc{animation:pt_kondana .5s ease-out}
@keyframes pt_kondana{40%{transform:scale(.95)}100%{transform:none}}
