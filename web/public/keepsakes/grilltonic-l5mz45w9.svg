<svg xmlns="http://www.w3.org/2000/svg" viewBox="119 129 341 341" aria-hidden="true" focusable="false"><style>.joy .ksc-grilltonic .ring{opacity:0}
.joy .ksc-grilltonic.open .ring{opacity:1;transition:opacity .4s 1.1s}
.joy .ksc-grilltonic .gl{transform-box:fill-box;opacity:0}
.joy .ksc-grilltonic.open .gl{animation:gld_grilltonic 1.6s ease-in-out both}
@keyframes gld_grilltonic{0%{opacity:0;transform:translate(60px,-160px)}35%{opacity:1;transform:translate(0,0)}70%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(80px,-140px)}}
.joy .ksc-grilltonic .cs{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-grilltonic.open .cs{animation:csp_grilltonic .7s ease-out .9s}
@keyframes csp_grilltonic{40%{transform:rotate(9deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-grilltonic .ring,.joy .ksc-grilltonic .gl,.joy .ksc-grilltonic .cs{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cs"><g transform="translate(290 300) rotate(-8)"><circle r="140" fill="#e3ecd0"></circle><circle r="124" fill="none" stroke="#24401f" stroke-opacity=".35" stroke-width="2"></circle><text x="0" y="-30" font-family="Fraunces, serif" font-size="23.5" font-weight="800" fill="#24401f" text-anchor="middle">Grill &amp; Tonic</text><text x="0" y="0" font-family="'Space Mono', monospace" font-size="12" fill="#24401f" text-anchor="middle">Thane, towards the hills</text><g transform="translate(0 70) scale(0.8)"><path d="M-50 20 C-30 -20 -10 -24 6 4 C18 -30 36 -32 50 20 Z" fill="#5d7d4f"></path><path d="M-50 20 C-24 0 0 6 20 20 Z" fill="#3f5d36"></path></g><circle class="ring" r="48" cx="56" cy="74" fill="none" stroke="#6b4a2a" stroke-opacity=".45" stroke-width="7"></circle></g></g><g class="gl"><g transform="translate(340 320) scale(2.4)"><path d="M-18 -26 H18 L14 22 H-14 Z" fill="#ffffff" fill-opacity=".35" stroke="#ffffff" stroke-width="2"></path><path d="M-15 -6 H15 L13 20 H-13 Z" fill="#d6f0e0"></path></g></g></svg>
