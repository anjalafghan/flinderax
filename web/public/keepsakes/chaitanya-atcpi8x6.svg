<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 53 617 510" aria-hidden="true" focusable="false"><style>.joy .ksc-chaitanya .glass,.joy .ksc-chaitanya .steam path{transform-box:fill-box}
.joy .ksc-chaitanya .glass{transform-origin:50% 100%;transition:transform .4s}
.joy .ksc-chaitanya.open .steam{opacity:1}
.joy .ksc-chaitanya.open .steam path{animation:rise_chaitanya 2s ease-out infinite}
.joy .ksc-chaitanya.open .steam path:nth-child(2){animation-delay:.6s}
.joy .ksc-chaitanya.open .steam path:nth-child(3){animation-delay:1.1s}
.joy .ksc-chaitanya.open .glass{animation:tilt_chaitanya 1.6s ease-in-out .3s both}
.joy .ksc-chaitanya.open .stain{opacity:.8;transition:opacity .3s 1.2s}
@keyframes rise_chaitanya{0%{opacity:0;transform:translateY(8px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-26px)}}
@keyframes tilt_chaitanya{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-22deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-chaitanya .glass,.joy .ksc-chaitanya .steam path,.joy .ksc-chaitanya .stain{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><filter id="chaitanya-c2-g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.05  0 0 0 0 0.2  0 0 0 0 0.05  0 0 0 0.16 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter>
<linearGradient id="chaitanya-c2-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f9a3e"></stop><stop offset=".6" stop-color="#3f7d2c"></stop><stop offset="1" stop-color="#2d6420"></stop></linearGradient>
<linearGradient id="chaitanya-c2-steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e949a"></stop><stop offset=".5" stop-color="#eef1f3"></stop><stop offset="1" stop-color="#7d838a"></stop></linearGradient></defs>
<g transform="rotate(-8 300 300)"><path d="M40 330 C40 230 140 120 300 104 C420 92 520 150 580 250 C540 250 526 262 560 300 C530 300 520 316 548 340 C510 440 420 506 290 516 C150 526 40 450 40 330 Z" fill="url(#chaitanya-c2-leaf)"></path><path d="M40 330 C40 230 140 120 300 104 C420 92 520 150 580 250 C540 250 526 262 560 300 C530 300 520 316 548 340 C510 440 420 506 290 516 C150 526 40 450 40 330 Z" filter="url(#chaitanya-c2-g)"></path>
