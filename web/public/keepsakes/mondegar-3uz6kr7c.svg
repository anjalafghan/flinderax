<svg xmlns="http://www.w3.org/2000/svg" viewBox="63 114 490 348" aria-hidden="true" focusable="false"><style>.joy .ksc-mondegar .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-mondegar.open .mk{stroke-dashoffset:0;transition:stroke-dashoffset 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-mondegar .fl1,.joy .ksc-mondegar .fl2{transform-box:fill-box;transition:transform .45s .15s}
.joy .ksc-mondegar .fl1{transform-origin:0% 50%}
.joy .ksc-mondegar .fl2{transform-origin:100% 50%}
.joy .ksc-mondegar.open .fl1,.joy .ksc-mondegar.open .fl2{transform:scaleX(0);transition:transform .5s cubic-bezier(.4,0,.2,1) .25s}
.joy .ksc-mondegar .mid{transition:opacity .25s .5s}
.joy .ksc-mondegar.open .mid{opacity:0;transition:opacity .3s}
