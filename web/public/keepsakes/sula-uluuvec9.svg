<svg xmlns="http://www.w3.org/2000/svg" viewBox="127 55 333 483" aria-hidden="true" focusable="false"><style>.joy .ksc-sula .fx{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-sula.open .fx{animation:k65_sula .5s cubic-bezier(.3,1.6,.5,1) calc(0.2s + var(--d, 0s)) both}
@keyframes k65_sula{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
.joy .ksc-sula .lb{transform-box:fill-box}
.joy .ksc-sula.open .lb{animation:k67_sula .09s linear 0s 4}
@keyframes k67_sula{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-sula .fx,.joy .ksc-sula .lb{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><linearGradient id="sula-lb-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".35"></stop><stop offset=".25" stop-color="#fff" stop-opacity="0"></stop><stop offset=".85" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity=".2"></stop></linearGradient></defs><g class="lb"><g transform="translate(290 330) rotate(-4)"><path d="M-30 -170 H30 V-120 C70 -100 80 -70 80 -30 V170 Q80 190 60 190 H-60 Q-80 190 -80 170 V-30 C-80 -70 -70 -100 -30 -120 Z" fill="#3a1a2e"></path><path d="M-30 -170 H30 V-120 C70 -100 80 -70 80 -30 V170 Q80 190 60 190 H-60 Q-80 190 -80 170 V-30 C-80 -70 -70 -100 -30 -120 Z" fill="url(#sula-lb-shine)"></path><rect x="-36" y="-196" width="72" height="30" rx="6" fill="#3a2a20"></rect><rect x="-62" y="-10" width="124" height="150" rx="6" fill="#f6efe0"></rect><rect x="-56" y="-4" width="112" height="138" rx="4" fill="none" stroke="#3a2a20" stroke-opacity=".4"></rect><text x="0" y="30" font-family="'Young Serif', serif" font-size="8.2" fill="#3a2a20" text-anchor="middle">Nashik, our vintage</text><text x="0" y="60" font-family="Kalam, cursive" font-size="10.5" fill="#3a2a20" text-anchor="middle">tasting, then lunch</text><text x="0" y="82" font-family="Kalam, cursive" font-size="9.5" fill="#3a2a20" text-anchor="middle">sunset over the vines</text><text x="0" y="104" font-family="Kalam, cursive" font-size="13.3" fill="#3a2a20" text-anchor="middle">one bottle home</text><g transform="translate(-110 -150)"><g class="fx" style="--d:0.0s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g><g transform="translate(120 -120)"><g class="fx" style="--d:0.2s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g><g transform="translate(-130 40)"><g class="fx" style="--d:0.4s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g><g transform="translate(130 70)"><g class="fx" style="--d:0.6s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g><g transform="translate(0 -240)"><g class="fx" style="--d:0.8s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g></g></g></svg>
