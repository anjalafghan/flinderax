30 30 -30 34 0 Z" fill="#2f6db5"></path><path d="M-17 0 C-14 -26 0 -28 0 -28 M17 0 C14 -26 0 -28 0 -28" stroke="#f6f3ec" stroke-width="2" fill="none"></path><path d="M0 0 V40" stroke="#d9b27a" stroke-width="3"></path></g><g transform="translate(40 10) scale(2.6)"><ellipse rx="40" ry="16" fill="#f6f3ec"></ellipse><ellipse rx="28" ry="10" fill="none" stroke="#c9c4b8"></ellipse><ellipse cy="-3" rx="18" ry="7" fill="#f2c230"></ellipse></g><g transform="translate(0 90) rotate(-2)"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#326174" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#326174"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="21.5" fill="#fbf8f1" text-anchor="middle">Silver Beach Cafe</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">Juhu, breakfast</text></g><ellipse class="gloss" cx="-40" cy="-60" rx="70" ry="22" fill="#fff" opacity=".18" transform="rotate(-24 -40 -60)"></ellipse></g></g></svg>
