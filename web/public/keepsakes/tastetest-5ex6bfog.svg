.joy .ksc-tastetest .ring{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-tastetest.open .ring{stroke-dashoffset:0;transition:stroke-dashoffset 0.6s ease-out calc(1.3s + var(--d, 0s))}
