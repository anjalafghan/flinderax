<svg xmlns="http://www.w3.org/2000/svg" viewBox="103 95 372 391" aria-hidden="true" focusable="false"><style>.joy .ksc-tastetest .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
