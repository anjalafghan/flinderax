<svg xmlns="http://www.w3.org/2000/svg" viewBox="108 148 406 279" aria-hidden="true" focusable="false"><style>.joy .ksc-streetview .card{transform-box:fill-box;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.joy .ksc-streetview .pb{opacity:0;transition:opacity 0s .35s}
.joy .ksc-streetview .pf{transition:opacity 0s .35s}
.joy .ksc-streetview.open .card{transform:scaleX(-1) rotate(-3deg);transition:transform .7s cubic-bezier(.4,0,.2,1) .7s}
.joy .ksc-streetview.open .pb{opacity:1;transition:opacity 0s 1.05s}
.joy .ksc-streetview.open .pf{opacity:0;transition:opacity 0s 1.05s}
.joy .ksc-streetview .frank{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-streetview.open .frank{animation:frk_streetview .25s ease-out .15s both}
@keyframes frk_streetview{0%{opacity:0;transform:scale(1.7)}100%{opacity:.85;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-streetview .card,.joy .ksc-streetview .pb,.joy .ksc-streetview .pf,.joy .ksc-streetview .frank{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><clipPath id="streetview-pc-c"><rect width="360" height="230" rx="6"></rect></clipPath><linearGradient id="streetview-pc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fc7e0"></stop><stop offset="1" stop-color="#d6e8f0"></stop></linearGradient></defs><g transform="translate(120 186) rotate(-4)"><g class="card"><g class="pf"><g clip-path="url(#streetview-pc-c)"><rect width="360" height="230" fill="url(#streetview-pc-sky)"></rect><path d="M0 160 C90 150 270 170 360 156 V230 H0 Z" fill="#8a8a8a"></path><g transform="translate(120 150) scale(1.6)"><path d="M-50 24 V2 H-40 V-14 H-30 V4 H-22 V-30 H-12 V-6 H-4 V-20 H8 V-40 L12 -48 L16 -40 V0 H24 V-12 H34 V6 H42 V-8 H50 V24 Z" fill="#c0392b"></path></g><g transform="translate(270 140) scale(1)"><path d="M-40 26 V4 H40 V26 Z" fill="#f1e7d0"></path><path d="M-22 4 C-22 -30 22 -30 22 4 Z" fill="#2f6db5"></path><path d="M0 -26 V-38" stroke="#2f6db5" stroke-width="3"></path><g fill="#2f6db5"><path d="M-30 26 V12 a5 5 0 0 1 10 0 V26 Z"></path><path d="M-5 26 V12 a5 5 0 0 1 10 0 V26 Z"></path><path d="M20 26 V12 a5 5 0 0 1 10 0 V26 Z"></path></g></g><g transform="translate(60 60) scale(0.7)"><circle r="18" fill="#f2b33d"></circle><path d="M0 -26 V-36" stroke="#f2b33d" stroke-width="4" stroke-linecap="round" transform="rotate(0)"></path><path d="M0 -26 V-36" stroke="#f2b33d" stroke-width="4" stroke-linecap="round" transform="rotate(45)"></path><path d="M0 -26 V-36" stroke="#f2b33d" stroke-width="4" stroke-linecap="round" transform="rotate(90)"></path><path d="M0 -26 V-36" stroke="#f2b33d" stroke-width="4" stroke-linecap="round" transform="rotate(135)"></path><path d="M0 -26 V-36" stroke="#f2b33d" stroke-width="4" stroke-linecap="round" transform="rotate(180)"></path><path d="M0 -26 V-36" stroke="#f2b33d" stroke-width="4" stroke-linecap="round" transform="rotate(225)"></path><path d="M0 -26 V-36" stroke="#f2b33d" stroke-width="4" stroke-linecap="round" transform="rotate(270)"></path><path d="M0 -26 V-36" stroke="#f2b33d" stroke-width="4" stroke-linecap="round" transform="rotate(315)"></path></g></g><rect x="8" y="8" width="344" height="214" rx="4" fill="none" stroke="#fff" stroke-width="6"></rect><path d="M14 178 H235 L243 196 L235 214 H14 Z" fill="#fbf6ea"></path><text x="24" y="204" font-family="Caveat, cursive" font-size="28" font-weight="700" fill="#2a3f7a" text-anchor="start">virtually there</text><g transform="translate(290 40) rotate(-12)"><g class="frank"><circle r="26" fill="none" stroke="#2a2a2a" stroke-width="2.4"></circle><path d="M30 -12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 -4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path></g></g></g><g class="pb" transform="translate(360 0) scale(-1 1)"><rect width="360" height="230" rx="6" fill="#fbf6ea"></rect><path d="M190.0 24 V206" stroke="#c9b48a"></path><text x="20" y="60" font-family="Kalam, cursive" font-size="15.8" fill="#2a3f7a" text-anchor="start">Walked the old town</text><text x="20" y="90" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">in Street View.</text><text x="20" y="120" font-family="Kalam, cursive" font-size="18.8" fill="#2a3f7a" text-anchor="start">Picked our café.</text><text x="20" y="150" font-family="Kalam, cursive" font-size="16.7" fill="#2a3f7a" text-anchor="start">One day, for real.</text><rect x="290" y="18" width="52" height="62" fill="#f2e3b3" stroke="#c0392b" stroke-dasharray="3 2"></rect><g transform="translate(316 49) scale(.5)"><path d="M0 -22 L6 -7 L22