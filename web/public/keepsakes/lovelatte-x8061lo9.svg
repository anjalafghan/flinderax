<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 246 327 258" aria-hidden="true" focusable="false"><style>.joy .ksc-lovelatte .cu{transform-box:fill-box}
.joy .ksc-lovelatte.open .cu{animation:k202_lovelatte .09s linear 0.1s 4}
@keyframes k202_lovelatte{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-lovelatte .sm{opacity:0;transform-box:fill-box}
.joy .ksc-lovelatte.open .sm{animation:k203_lovelatte 1.8s ease-out var(--d, 0s) 3}
@keyframes k203_lovelatte{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-70px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-lovelatte .cu,.joy .ksc-lovelatte .sm{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cu"><g transform="translate(300 320) rotate(-3)"><ellipse cy="76" rx="150" ry="30" fill="#f6f3ec" stroke="#c0392b" stroke-width="3"></ellipse><path d="M-100 -40 H100 C100 50 60 76 0 76 C-60 76 -100 50 -100 -40 Z" fill="#f6f3ec"></path><path d="M100 -20 C150 -20 150 40 90 40" fill="none" stroke="#f6f3ec" stroke-width="14"></path><ellipse cy="-40" rx="100" ry="16" fill="#c99c6c"></ellipse><path d="M-96 -10 C-60 10 60 10 96 -10" fill="none" stroke="#c0392b" stroke-width="5"></path><g transform="translate(0 -40) scale(0.5)"><path d="M0 22 C-30 0 -26 -24 -10 -24 C-4 -24 0 -18 0 -14 C0 -18 4 -24 10 -24 C26 -24 30 0 0 22 Z" fill="#f6f3ec"></path></g><g transform="translate(0 140)"><text x="0" y="0" font-family="Caveat, cursive" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Love &amp; Latte</text><text x="0" y="24" font-family="'Space Mono', monospace" font-size="10" fill="#fff" text-anchor="middle">Lokhandwala, till midnight</text></g><path class="sm" style="--d:0.00s" d="M-30 -60 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M0 -60 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M30 -60 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path></g></g></svg>
