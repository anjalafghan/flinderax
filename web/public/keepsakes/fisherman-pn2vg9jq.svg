<svg xmlns="http://www.w3.org/2000/svg" viewBox="119 129 341 341" aria-hidden="true" focusable="false"><style>.joy .ksc-fisherman .ring{opacity:0}
.joy .ksc-fisherman.open .ring{opacity:1;transition:opacity .4s 1.1s}
.joy .ksc-fisherman .gl{transform-box:fill-box;opacity:0}
.joy .ksc-fisherman.open .gl{animation:gld_fisherman 1.6s ease-in-out both}
@keyframes gld_fisherman{0%{opacity:0;transform:translate(60px,-160px)}35%{opacity:1;transform:translate(0,0)}70%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(80px,-140px)}}
.joy .ksc-fisherman .cs{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-fisherman.open .cs{animation:csp_fisherman .7s ease-out .9s}
@keyframes csp_fisherman{40%{transform:rotate(9deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-fisherman .ring,.joy .ksc-fisherman .gl,.joy .ksc-fisherman .cs{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cs"><g transform="translate(290 300) rotate(-8)"><circle r="140" fill="#2f6db5"></circle><circle r="124" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"></circle><text x="0" y="-30" font-family="Fraunces, serif" font-size="30.8" font-weight="800" fill="#fff" text-anchor="middle">The Fisherman</text><text x="0" y="0" font-family="'Space Mono', monospace" font-size="12" fill="#fff" text-anchor="middle">New Link Road, live music</text><g transform="translate(0 70) scale(0.7)"><path d="M-30 0 C-14 -16 14 -16 24 0 C14 16 -14 16 -30 0 Z" fill="#f2c230"></path><path d="M24 0 L40 -12 V12 Z" fill="#f2c230"></path><circle cx="-16" cy="-3" r="3" fill="#fff"></circle></g><circle class="ring" r="48" cx="56" cy="74" fill="none" stroke="#6b4a2a" stroke-opacity=".45" stroke-width="7"></circle></g></g><g class="gl"><g transform="translate(340 320) scale(2.4)"><path d="M-18 -26 H18 L14 22 H-14 Z" fill="#ffffff" fill-opacity=".35" stroke="#ffffff" stroke-width="2"></path><path d="M-15 -6 H15 L13 20 H-13 Z" fill="#f2b33d"></path></g></g></svg>
