<svg xmlns="http://www.w3.org/2000/svg" viewBox="77 68 445 430" aria-hidden="true" focusable="false"><style>.joy .ksc-pottery .spin,.joy .ksc-pottery .bowl,.joy .ksc-pottery .tag,.joy .ksc-pottery .splat circle{transform-box:fill-box}
.joy .ksc-pottery .spin{transform-origin:50% 50%}
.joy .ksc-pottery .bowl{transform-origin:50% 100%}
.joy .ksc-pottery .tag{transform-origin:85% 50%}
.joy .ksc-pottery .splat circle{opacity:0}
.joy .ksc-pottery.open .spin{animation:spin_pottery .35s linear 6}
.joy .ksc-pottery.open .bowl{animation:wobble_pottery 2.1s ease-in-out both}
.joy .ksc-pottery.open .splat circle{animation:splat_pottery .6s ease-out .9s both}
.joy .ksc-pottery.open .tag{animation:swing_pottery 1.8s ease-in-out .3s}
@keyframes spin_pottery{to{transform:scaleX(-1)}}
@keyframes wobble_pottery{0%{transform:none}20%{transform:skewX(6deg) scaleY(1.06)}40%{transform:skewX(-7deg) scaleY(1.1)}60%{transform:skewX(5deg) scaleY(1.12)}80%{transform:skewX(-3deg) scaleY(1.1)}100%{transform:skewX(2deg) scaleY(1.08)}}
@keyframes splat_pottery{0%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
@keyframes swing_pottery{0%,100%{transform:rotate(0)}30%{transform:rotate(6deg)}65%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-pottery .spin,.joy .ksc-pottery .bowl,.joy .ksc-pottery .tag,.joy .ksc-pottery .splat circle{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><filter id="pottery-pt-g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.15  0 0 0 0 0.05  0 0 0 0.18 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter>
<pattern id="pottery-pt-print" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 5 Q5 0 10 5" fill="none" stroke="#7e3c1c" stroke-width="1"></path></pattern>
<radialGradient id="pottery-pt-wheel" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#9aa0a6"></stop><stop offset="1" stop-color="#5a6066"></stop></radialGradient>
<linearGradient id="pottery-pt-clay" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4a26"></stop><stop offset=".45" stop-color="#c47a4a"></stop><stop offset="1" stop-color="#7d3e1f"></stop></linearGradient></defs>
<ellipse cx="300" cy="420" rx="210" ry="66" fill="#3b3f44"></ellipse>
<g class="spin"><ellipse cx="300" cy="400" rx="190" ry="58" fill="url(#pottery-pt-wheel)"></ellipse>
<g stroke="#4a4f55" stroke-width="2"><path d="M140 400 H460"></path><path d="M300 344 V456"></path></g>
<ellipse cx="300" cy="400" rx="120" ry="36" fill="none" stroke="#c47a4a" stroke-opacity=".5" stroke-width="3"></ellipse></g>
<g class="bowl"><path d="M220 330 C214 380 240 404 300 404 C362 404 388 378 378 326 C350 340 250 342 220 330 Z" fill="url(#pottery-pt-clay)"></path>
<ellipse cx="299" cy="328" rx="80" ry="16" fill="#6b3218"></ellipse><path d="M222 330 C260 316 340 314 378 326" fill="none" stroke="#d9925e" stroke-width="3"></path>
<path d="M300 344 C296 360 304 372 300 390" stroke="#a65a30" stroke-width="2" fill="none"></path></g>
<g class="splat" fill="#b5683a"><circle cx="150" cy="330" r="5"></circle><circle cx="460" cy="320" r="4"></circle><circle cx="430" cy="280" r="3"></circle><circle cx="170" cy="290" r="3"></circle></g>
<g class="tag"><g transform="translate(110 110) rotate(-8)">
<path d="M0 20 Q0 0 20 0 H170 L210 50 L170 100 H20 Q0 100 0 80 Z" fill="#c4683c"></path><path d="M0 20 Q0 0 20 0 H170 L210 50 L170 100 H20 Q0 100 0 80 Z" filter="url(#pottery-pt-g)"></path>
<circle cx="186" cy="50" r="7" fill="#3a2a20"></circle>
<path d="M186 50 C220 40 250 70 280 50" fill="none" stroke="#efe4cf" stroke-width="2"></path>
<g transform="translate(46 52)"><ellipse rx="20" ry="26" fill="#a9522a" transform="rotate(-10)"></ellipse><g transform="rotate(-10)" fill="none" stroke="#6e2e12" stroke-width="1.6" opacity="0.9"><ellipse rx="18.0" ry="24.0"></ellipse><ellipse rx="14.0" ry="18.7"></ellipse><ellipse rx="10.1" ry="13.4"></ellipse><ellipse rx="6.1" ry="8.2"></ellipse></g></g>
<g transform="translate(72 50)"><ellipse rx="19" ry="25" fill="#a9522a" opacity=".8" transform="rotate(14)"></ellipse><g transform="rotate(14)" fill="none" stroke="#6e2e12" stroke-width="1.6" opacity="0.75"><ellipse rx="17.0" ry="23.0"></ellipse><ellipse rx="13.3" ry="17.9"></ellipse><ellipse rx="9.5" ry="12.9"></ellipse><ellipse rx="5.8" ry="7.8"></ellipse></g></g>
<text x="138" y="40" font-family="'Young Serif', serif" font-size="15" fill="#3a1a0c" text-anchor="middle">UV’s Pottery</text>
<g transform="translate(138 66) rotate(-6)"><rect x="-30" y="-12" width="60" height="22" rx="3" fill="none" stroke="#3a1a0c" stroke-width="1.6"></rect><text y="4" font-family="'Space Mono', monospace" font-size="11" fill="#3a1a0c" text-anchor="middle">fired</text></g>
</g></g></svg>
