<svg xmlns="http://www.w3.org/2000/svg" viewBox="149 99 302 437" aria-hidden="true" focusable="false"><style>.joy .ksc-bakeoff .shine{opacity:0}
.joy .ksc-bakeoff.open .shine{animation:shn_bakeoff .9s ease-out .2s}
@keyframes shn_bakeoff{0%{opacity:0;transform:translateX(0)}30%{opacity:.6}100%{opacity:0;transform:translateX(160px)}}
.joy .ksc-bakeoff .bd{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-bakeoff.open .bd{animation:k25_bakeoff 2.2s ease-in-out 0s 1}
@keyframes k25_bakeoff{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}45%{transform:rotate(-4.0deg)}70%{transform:rotate(2.25deg)}88%{transform:rotate(-1.0deg)}}
.joy .ksc-bakeoff .tails{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-bakeoff.open .tails{animation:flut_bakeoff .3s ease-in-out 5 alternate}
@keyframes flut_bakeoff{to{transform:skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-bakeoff .tails,.joy .ksc-bakeoff .shine,.joy .ksc-bakeoff .bd{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="bd"><g transform="translate(300 250) rotate(-6)"><g class="tails"><path d="M-60 80 L-90 260 L-60 236 L-36 266 L-10 96 Z" fill="#e8b923"></path><path d="M60 80 L90 260 L60 236 L36 266 L10 96 Z" fill="#2f6db5"></path></g><circle cx="124.0" cy="0.0" r="14" fill="#2f6db5"></circle><circle cx="119.8" cy="32.1" r="14" fill="#2f6db5"></circle><circle cx="107.4" cy="62.0" r="14" fill="#2f6db5"></circle><circle cx="87.7" cy="87.7" r="14" fill="#2f6db5"></circle><circle cx="62.0" cy="107.4" r="14" fill="#2f6db5"></circle><circle cx="32.1" cy="119.8" r="14" fill="#2f6db5"></circle><circle cx="0.0" cy="124.0" r="14" fill="#2f6db5"></circle><circle cx="-32.1" cy="119.8" r="14" fill="#2f6db5"></circle><circle cx="-62.0" cy="107.4" r="14" fill="#2f6db5"></circle><circle cx="-87.7" cy="87.7" r="14" fill="#2f6db5"></circle><circle cx="-107.4" cy="62.0" r="14" fill="#2f6db5"></circle><circle cx="-119.8" cy="32.1" r="14" fill="#2f6db5"></circle><circle cx="-124.0" cy="0.0" r="14" fill="#2f6db5"></circle><circle cx="-119.8" cy="-32.1" r="14" fill="#2f6db5"></circle><circle cx="-107.4" cy="-62.0" r="14" fill="#2f6db5"></circle><circle cx="-87.7" cy="-87.7" r="14" fill="#2f6db5"></circle><circle cx="-62.0" cy="-107.4" r="14" fill="#2f6db5"></circle><circle cx="-32.1" cy="-119.8" r="14" fill="#2f6db5"></circle><circle cx="-0.0" cy="-124.0" r="14" fill="#2f6db5"></circle><circle cx="32.1" cy="-119.8" r="14" fill="#2f6db5"></circle><circle cx="62.0" cy="-107.4" r="14" fill="#2f6db5"></circle><circle cx="87.7" cy="-87.7" r="14" fill="#2f6db5"></circle><circle cx="107.4" cy="-62.0" r="14" fill="#2f6db5"></circle><circle cx="119.8" cy="-32.1" r="14" fill="#2f6db5"></circle><circle r="120" fill="#f6efe0"></circle><circle r="108" fill="none" stroke="#2b2b30" stroke-opacity=".4" stroke-dasharray="3 5"></circle><text x="0" y="-44" font-family="'Young Serif', serif" font-size="26" fill="#2b2b30" text-anchor="middle">Bake-off</text><text x="0" y="20" font-family="Fraunces, serif" font-size="52" font-weight="800" fill="#2b2b30" text-anchor="middle">1st</text><text x="0" y="56" font-family="'Space Mono', monospace" font-size="11" fill="#2b2b30" text-anchor="middle">same recipe, one oven</text><g transform="translate(0 86) scale(0.9)"><path d="M-26 20 V-6 H26 V20 Z" fill="#f7c9d4"></path><path d="M-26 -6 C-20 2 -12 -4 -6 2 C0 -4 8 2 14 -4 C18 2 22 -2 26 -6" fill="none" stroke="#fff" stroke-width="4"></path><circle cy="-14" r="6" fill="#c2185b"></circle></g><path class="shine" d="M-90 -40 L-40 -110 L-20 -110 L-70 -40 Z" fill="#fff" opacity="0"></path></g></g></svg>
