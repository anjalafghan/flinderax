@media (prefers-reduced-motion:reduce){.joy .ksc-newlanguage .stk{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(300 300) rotate(-6)"><rect x="-170" y="-170" width="340" height="340" rx="12" fill="#f3efe6"></rect><path d="M-150 -150 H150 V150 H-150 Z" fill="none" stroke="#d6cfc0" stroke-dasharray="4 5"></path><g class="stk"><path d="M-120 -40 C-130 -110 -30 -140 30 -120 C120 -100 150 -20 120 50 C90 130 -20 140 -80 110 C-130 80 -110 20 -120 -40 Z" fill="#ffffff"></path><g transform="scale(.94)"><path d="M-120 -40 C-130 -110 -30 -140 30 -120 C120 -100 150 -20 120 50 C90 130 -20 140 -80 110 C-130 80 -110 20 -120 -40 Z" fill="#2f6db5"></path></g><text x="0" y="0" font-family="Fraunces, serif" font-size="33.1" font-weight="800" fill="#fff" text-anchor="middle">hola, día 1</text><text x="0" y="32" font-family="'Space Mono', monospace" font-size="11" fill="#fff" text-anchor="middle">the streak starts today</text></g></g></svg>
