<svg xmlns="http://www.w3.org/2000/svg" viewBox="101 81 398 418" aria-hidden="true" focusable="false"><style>.joy .ksc-newlanguage .stk{transform-box:fill-box;transform-origin:0% 0%;transition:transform .4s}
