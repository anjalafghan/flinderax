<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 143 523 351" aria-hidden="true" focusable="false"><style>.joy .ksc-rangoli .rl{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-rangoli.open .rl{stroke-dashoffset:0;transition:stroke-dashoffset 0.5s ease-out calc(0.1s + var(--d, 0s))}
.joy .ksc-rangoli .rd{opacity:0;transition:opacity .15s}
.joy .ksc-rangoli.open .rd{opacity:1;transition:opacity 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-rangoli .rg{transform-box:fill-box}
.joy .ksc-rangoli.open .rg{animation:k83_rangoli .09s linear 0s 3}
@keyframes k83_rangoli{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
