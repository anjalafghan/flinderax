<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 244 288" aria-hidden="true" focusable="false"><style>.joy .ksc-meditate .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-meditate .fb{opacity:0}
.joy .ksc-meditate.open .cf{animation:cfs_meditate .275s linear 5}
.joy .ksc-meditate.open .fa{animation:cfa_meditate 1.375s step-end both}
.joy .ksc-meditate.open .fb{animation:cfb_meditate 1.375s step-end both}
@keyframes cfs_meditate{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_meditate{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_meditate{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-meditate.open .toss{animation:tossup_meditate 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_meditate{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-meditate .cf,.joy .ksc-meditate .fa,.joy .ksc-meditate .fb,.joy .ksc-meditate .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#d9a84a" stroke="#9c7a2a" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#9c7a2a" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#3a2408" text-anchor="middle">ten minutes</text><text x="0" y="16" font-family="Fraunces, serif" font-size="40" font-weight="700" fill="#3a2408" text-anchor="middle">ding</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#3a2408" text-anchor="middle">same time, two rooms</text><g transform="translate(0 -78) scale(0.5)"><path d="M-22 16 C-22 -24 22 -24 22 16 Z" fill="#7a5a1a"></path><rect x="-26" y="14" width="52" height="6" rx="3" fill="#7a5a1a"></rect><circle cy="24" r="5" fill="#7a5a1a"></circle></g></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="34" font-weight="700" fill="#3a2408" text-anchor="middle">grateful</text><text x="0" y="36" font-family="Kalam, cursive" font-size="18" fill="#3a2408" text-anchor="middle">one thing each</text></g></g></g></g></svg>
