8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#5aa4d6" stroke-width="3" stroke-linecap="round"></path></g><path class="sm" style="--d:0.00s" d="M240 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M300 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M360 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><g transform="translate(70 470) rotate(-6)"><path d="M0 0 H210 V60 H0 Z" fill="#fbf6ec"></path><text x="105" y="28" font-family="'Young Serif', serif" font-size="18" fill="#5a1d0c" text-anchor="middle">Juhu Beach</text><text x="105" y="46" font-family="'Space Mono', monospace" font-size="9" fill="#4a3a30" text-anchor="middle">pav bhaji, gola, sand at dusk</text></g></svg>
