<svg xmlns="http://www.w3.org/2000/svg" viewBox="57 158 464 384" aria-hidden="true" focusable="false"><style>.joy .ksc-indoorpicnic .sm{opacity:0;transform-box:fill-box}
.joy .ksc-indoorpicnic.open .sm{animation:k66_indoorpicnic 1.8s ease-out var(--d, 0s) 3}
@keyframes k66_indoorpicnic{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-indoorpicnic .gn{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-indoorpicnic.open .gn{animation:k67_indoorpicnic .5s cubic-bezier(.3,1.6,.5,1) calc(0.3s + var(--d, 0s)) both}
@keyframes k67_indoorpicnic{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
