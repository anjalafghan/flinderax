4 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><g transform="translate(70 470) rotate(-6)"><path d="M0 0 H210 V60 H0 Z" fill="#fbf6ec"></path><text x="105" y="28" font-family="'Young Serif', serif" font-size="18" fill="#5a1d0c" text-anchor="middle">Indoor picnic</text><text x="105" y="46" font-family="'Space Mono', monospace" font-size="9" fill="#4a3a30" text-anchor="middle">no sofa allowed</text></g></svg>
