<svg xmlns="http://www.w3.org/2000/svg" viewBox="128 125 341 319" aria-hidden="true" focusable="false"><style>.joy .ksc-midnightride .spk{opacity:0;transition:opacity .15s}
.joy .ksc-midnightride.open .spk{opacity:1;transition:opacity 0.3s ease-out calc(0.3s + var(--d, 0s))}
.joy .ksc-midnightride .dc-e *{fill:#1f2b4d!important;stroke:#1f2b4d!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-midnightride .dc-s *{fill:none!important;stroke:#fff8e8!important;stroke-width:var(--w)!important;stroke-dasharray:4 5!important;fill-opacity:1!important;stroke-opacity:.8!important;opacity:1!important}
.joy .ksc-midnightride .pc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-midnightride.open .pc{animation:pt_midnightride .5s ease-out}
@keyframes pt_midnightride{40%{transform:scale(.95)}100%{transform:none}}
