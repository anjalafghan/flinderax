<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 81 355 409" aria-hidden="true" focusable="false"><style>.joy .ksc-paintscreenshot .pol{transform-box:fill-box}
.joy .ksc-paintscreenshot.open .pol{animation:k104_paintscreenshot .09s linear 0s 5}
@keyframes k104_paintscreenshot{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-paintscreenshot .dev{transition:opacity .3s}
.joy .ksc-paintscreenshot.open .dev{opacity:0;transition:opacity 1.6s ease-in .5s}
@media (prefers-reduced-motion:reduce){.joy .ksc-paintscreenshot .dev,.joy .ksc-paintscreenshot .pol{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pol"><g transform="translate(150 120) rotate(-5)"><path d="M0 0 H300 V326 Q292 354 260 360 H0 Z" fill="#fbfaf6"></path><path d="M300 326 Q292 354 260 360 Q278 338 300 326 Z" fill="#d9d4c6"></path><clipPath id="paintscreenshot-pl-c"><rect x="20" y="20" width="260" height="260"></rect></clipPath><linearGradient id="paintscreenshot-pl-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe0"></stop><stop offset="1" stop-color="#e9d6b3"></stop></linearGradient><g clip-path="url(#paintscreenshot-pl-c)"><rect x="20" y="20" width="260" height="260" fill="url(#paintscreenshot-pl-s)"></rect><path d="M20 210 C100 196 200 220 280 204 V280 H20 Z" fill="#e9d6b3"></path><g transform="translate(20 20)"><g transform="translate(130 120) scale(2.2)"><g transform="translate(-20 0)"><rect x="-16" y="-30" width="32" height="60" rx="6" fill="#1f2026"></rect><rect x="-12" y="-24" width="24" height="44" rx="2" fill="#f6c27a"></rect></g><g transform="translate(20 0)"><rect x="-16" y="-30" width="32" height="60" rx="6" fill="#1f2026"></rect><rect x="-12" y="-24" width="24" height="44" rx="2" fill="#f7c9d4"></rect></g><path d="M-8 0 h16" stroke="#fff" stroke-width="2" stroke-dasharray="2 3"></path></g></g></g><rect class="dev" x="20" y="20" width="260" height="260" fill="#2b2a2e"></rect><text x="150.0" y="330" font-family="Caveat, cursive" font-size="30" font-weight="700" fill="#2b2b30" text-anchor="middle">you, mid-sentence</text></g></g></svg>
