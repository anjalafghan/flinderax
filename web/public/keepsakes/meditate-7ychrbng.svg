<svg xmlns="http://www.w3.org/2000/svg" viewBox="154 184 302 230" aria-hidden="true" focusable="false"><style>.joy .ksc-meditate .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-meditate.open .pc{animation:k56_meditate 2.2s ease-in-out 0s 1}
@keyframes k56_meditate{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-meditate .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-meditate .shine{opacity:0}
.joy .ksc-meditate.open .shine{animation:shn_meditate 1s ease-out .15s}
@keyframes shn_meditate{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-meditate .shine,.joy .ksc-meditate .pc{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g opacity=".9"><path d="M-30 -8 H30" stroke="#8a8f96" stroke-width="4"></path></g><g class="dc-e"><g transform="translate(0 -10) scale(3.4)" style="--w:2.94px"><path d="M-30 -6 C-36 24 36 24 30 -6 Z" fill="#c9a14a"></path><ellipse cy="-6" rx="30" ry="7" fill="#9a6e2a"></ellipse><path d="M-20 -14 C-10 -22 10 -22 20 -14" fill="none" stroke="#9a6e2a" stroke-width="4"></path></g><g transform="translate(0 -80) scale(1.6)" style="--w:6.25px"><path d="M-40 -8 h50" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path><path d="M-10 4 h46" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path><path d="M-34 16 h40" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path></g><g transform="translate(0 70) rotate(-2)" style="--w:5px"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#000" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#000"></path></g></g><g transform="translate(0 -10) scale(3.4)"><path d="M-30 -6 C-36 24 36 24 30 -6 Z" fill="#c9a14a"></path><ellipse cy="-6" rx="30" ry="7" fill="#9a6e2a"></ellipse><path d="M-20 -14 C-10 -22 10 -22 20 -14" fill="none" stroke="#9a6e2a" stroke-width="4"></path></g><g transform="translate(0 -80) scale(1.6)"><path d="M-40 -8 h50" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path><path d="M-10 4 h46" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path><path d="M-34 16 h40" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path></g><g transform="translate(0 70) rotate(-2)"><path d="M-136.888 -20.0 H136.888 L126.888 2 L136.888 28.0 H-136.888 L-126.888 2 Z" fill="#326174" opacity=".85"></path><path d="M-124.888 -24.0 H124.888 V24.0 Q0 30.0 -124.888 24.0 Z" fill="#326174"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="21.5" fill="#fbf8f1" text-anchor="middle">ten quiet minutes</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">one bell, two breaths</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
