<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 244 288" aria-hidden="true" focusable="false"><style>.joy .ksc-vasaifort .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-vasaifort .fb{opacity:0}
.joy .ksc-vasaifort.open .cf{animation:cfs_vasaifort .275s linear 5}
.joy .ksc-vasaifort.open .fa{animation:cfa_vasaifort 1.375s step-end both}
.joy .ksc-vasaifort.open .fb{animation:cfb_vasaifort 1.375s step-end both}
@keyframes cfs_vasaifort{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_vasaifort{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_vasaifort{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-vasaifort.open .toss{animation:tossup_vasaifort 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_vasaifort{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-vasaifort .cf,.joy .ksc-vasaifort .fa,.joy .ksc-vasaifort .fb,.joy .ksc-vasaifort .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#c9a46e" stroke="#7a5a30" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#7a5a30" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#3a2414" text-anchor="middle">Vasai Fort</text><text x="0" y="16" font-family="Fraunces, serif" font-size="40" font-weight="700" fill="#3a2414" text-anchor="middle">1560s</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#3a2414" text-anchor="middle">Portuguese ruins</text><g transform="translate(0 -78) scale(0.5)"><path d="M-46 26 V-4 H-38 V-12 H-30 V-4 H-22 V-12 H-14 V-4 H-6 V-12 H2 V-4 H10 V-12 H18 V-4 H26 V-12 H34 V-4 H46 V26 Z" fill="#7a5a30"></path><path d="M-8 26 V10 a8 8 0 0 1 16 0 V26 Z" fill="#3a2414"></path></g></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="34" font-weight="700" fill="#3a2414" text-anchor="middle">beach</text><text x="0" y="36" font-family="Kalam, cursive" font-size="18" fill="#3a2414" text-anchor="middle">then the sea</text></g></g></g></g></svg>
