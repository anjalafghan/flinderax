<svg xmlns="http://www.w3.org/2000/svg" viewBox="98 107 360 337" aria-hidden="true" focusable="false"><style>.joy .ksc-sharedplaylist .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-sharedplaylist .pc{transform-box:fill-box;transform-origin:0% 100%}
.joy .ksc-sharedplaylist.open .pc{transform:rotate(-7deg) translate(-4px,-14px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.joy .ksc-sharedplaylist .pc{transition:transform .3s}
.joy .ksc-sharedplaylist .shine{opacity:0}
.joy .ksc-sharedplaylist.open .shine{animation:shn_sharedplaylist 1s ease-out .2s}
@keyframes shn_sharedplaylist{0%{opacity:0;transform:translateX(0)}30%{opacity:.45}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-sharedplaylist .pc,.joy .ksc-sharedplaylist .shine{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g class="dc-e"><g transform="translate(-30 -10) scale(3.0)" style="--w:6.00px"><circle r="38" fill="#553d66"></circle><circle r="32" fill="none" stroke="#fff" stroke-opacity=".12"></circle><circle r="26" fill="none" stroke="#fff" stroke-opacity=".12"></circle><circle r="20" fill="none" stroke="#fff" stroke-opacity=".12"></circle><circle r="13" fill="#f7e2a2"></circle><circle r="2.5" fill="#f6f3ec"></circle></g><g transform="translate(80 -60) scale(1.6)" style="--w:11.25px"><path d="M-30 10 C-30 -40 30 -40 30 10" fill="none" stroke="#2b1d33" stroke-width="7"></path><rect x="-38" y="0" width="16" height="30" rx="6" fill="#f7e2a2"></rect><rect x="22" y="0" width="16" height="30" rx="6" fill="#f7e2a2"></rect></g><g transform="translate(0 100) rotate(-2)" style="--w:9px"><path d="M-136.92 -20.0 H136.92 L126.91999999999999 2 L136.92 28.0 H-136.92 L-126.91999999999999 2 Z" fill="#000" opacity=".85"></path><path d="M-124.91999999999999 -24.0 H124.91999999999999 V24.0 Q0 30.0 -124.91999999999999 24.0 Z" fill="#000"></path></g></g><g transform="translate(-30 -10) scale(3.0)"><circle r="38" fill="#553d66"></circle><circle r="32" fill="none" stroke="#fff" stroke-opacity=".12"></circle><circle r="26" fill="none" stroke="#fff" stroke-opacity=".12"></circle><circle r="20" fill="none" stroke="#fff" stroke-opacity=".12"></circle><circle r="13" fill="#f7e2a2"></circle><circle r="2.5" fill="#f6f3ec"></circle></g><g transform="translate(80 -60) scale(1.6)"><path d="M-30 10 C-30 -40 30 -40 30 10" fill="none" stroke="#2b1d33" stroke-width="7"></path><rect x="-38" y="0" width="16" height="30" rx="6" fill="#f7e2a2"></rect><rect x="22" y="0" width="16" height="30" rx="6" fill="#f7e2a2"></rect></g><g transform="translate(0 100) rotate(-2)"><path d="M-136.92 -20.0 H136.92 L126.91999999999999 2 L136.92 28.0 H-136.92 L-126.91999999999999 2 Z" fill="#553d66" opacity=".85"></path><path d="M-124.91999999999999 -24.0 H124.91999999999999 V24.0 Q0 30.0 -124.91999999999999 24.0 Z" fill="#553d66"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">press play: now</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">the blended list</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
