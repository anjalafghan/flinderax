<svg xmlns="http://www.w3.org/2000/svg" viewBox="188 144 236 286" aria-hidden="true" focusable="false"><style>.joy .ksc-teachone .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-teachone.open .pc{animation:k55_teachone 2.2s ease-in-out 0s 1}
@keyframes k55_teachone{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-teachone .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-teachone .shine{opacity:0}
.joy .ksc-teachone.open .shine{animation:shn_teachone 1s ease-out .15s}
@keyframes shn_teachone{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
