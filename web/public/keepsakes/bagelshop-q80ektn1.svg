<svg xmlns="http://www.w3.org/2000/svg" viewBox="158 168 302 282" aria-hidden="true" focusable="false"><style>.joy .ksc-bagelshop .gloss{opacity:0;transition:opacity .3s}
.joy .ksc-bagelshop.open .gloss{opacity:0.35;transition:opacity 0.8s 0.5s}
.joy .ksc-bagelshop .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-bagelshop .dc-d *{fill:#2a2018!important;stroke:#2a2018!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:.55!important;stroke-dasharray:none!important}
.joy .ksc-bagelshop .pc{transform-box:fill-box}
.joy .ksc-bagelshop.open .pc{animation:mg_bagelshop .7s cubic-bezier(.3,0,.4,1)}
@keyframes mg_bagelshop{0%{transform:translateY(0)}35%{transform:translateY(-34px) rotate(2deg)}70%{transform:translateY(0)}84%{transform:translateY(-8px)}100%{transform:none}}
