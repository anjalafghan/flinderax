<svg xmlns="http://www.w3.org/2000/svg" viewBox="-118 -62 630 551" aria-hidden="true" focusable="false"><style>.joy .ksc-arcade .card,.joy .ksc-arcade .tickets{transform-box:fill-box}
.joy .ksc-arcade .tickets{transform:translate(395px,-50px);transition:transform .3s}
.joy .ksc-arcade.open .card{animation:swipe_arcade 1s cubic-bezier(.5,0,.3,1) both}
.joy .ksc-arcade.open .shine{animation:shine_arcade 1.2s ease-out .2s}
.joy .ksc-arcade.open .led{fill:#3f3;transition:fill 0s .7s}
.joy .ksc-arcade.open .tickets{transform:translate(395px,200px);transition:transform 1.6s cubic-bezier(.3,.9,.4,1) .8s}
@keyframes swipe_arcade{0%{transform:none}40%{transform:translate(330px,-150px) rotate(8deg)}60%{transform:translate(330px,-110px) rotate(8deg)}100%{transform:none}}
@keyframes shine_arcade{from{transform:rotate(20deg) translateX(0)}to{transform:rotate(20deg) translateX(460px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-arcade .card,.joy .ksc-arcade .tickets,.joy .ksc-arcade .shine,.joy .ksc-arcade .led{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs>
