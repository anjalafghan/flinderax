<svg xmlns="http://www.w3.org/2000/svg" viewBox="57 21 488 511" aria-hidden="true" focusable="false"><style>.joy .ksc-horse .shoe{transform-box:view-box;transform-origin:300px 40px}
.joy .ksc-horse .hp{opacity:0}
.joy .ksc-horse.open .shoe{animation:swing_horse 2.2s ease-in-out both}
.joy .ksc-horse.open .hp{animation:step_horse .3s ease-out var(--d) both}
@keyframes swing_horse{0%,100%{transform:rotate(0)}20%{transform:rotate(10deg)}45%{transform:rotate(-8deg)}70%{transform:rotate(4deg)}88%{transform:rotate(-2deg)}}
@keyframes step_horse{0%{opacity:0;transform:scale(.4)}100%{opacity:.75;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-horse .shoe,.joy .ksc-horse .hp{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><filter id="horse-h-g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0 0.05  0 0 0 0.2 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter>
