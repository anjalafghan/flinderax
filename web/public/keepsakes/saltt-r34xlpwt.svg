<svg xmlns="http://www.w3.org/2000/svg" viewBox="54 57 568 544" aria-hidden="true" focusable="false"><style>.joy .ksc-saltt .car{transform:translate(372px,560px) rotate(-120deg)}
.joy .ksc-saltt.open .car{animation:drive_saltt 3.2s cubic-bezier(.45,0,.4,1) .2s both}
.joy .ksc-saltt.open .beam{opacity:.75;transition:opacity .2s .2s}
.joy .ksc-saltt.open .sky{opacity:.55;transition:opacity 1.5s .4s}
.joy .ksc-saltt.open .moon{opacity:1;transition:opacity 1s 1.6s}
.joy .ksc-saltt .circ path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s}
.joy .ksc-saltt.open .circ path{stroke-dashoffset:0;transition:stroke-dashoffset .7s ease-out 3.2s}
@keyframes drive_saltt{0%{transform:translate(372px,560px) rotate(-120deg)}14%{transform:translate(420px,500px) rotate(-30deg)}26%{transform:translate(440px,452px) rotate(-100deg)}40%{transform:translate(360px,410px) rotate(-170deg)}52%{transform:translate(352px,356px) rotate(-80deg)}66%{transform:translate(440px,300px) rotate(-20deg)}78%{transform:translate(446px,240px) rotate(-110deg)}90%{transform:translate(390px,190px) rotate(-120deg)}100%{transform:translate(380px,142px) rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-saltt .car,.joy .ksc-saltt .beam,.joy .ksc-saltt .sky,.joy .ksc-saltt .moon,.joy .ksc-saltt .circ path{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><filter id="saltt-s-g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.18  0 0 0 0 0.12  0 0 0 0.12 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter>
