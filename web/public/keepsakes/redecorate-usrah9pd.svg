<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 81 355 409" aria-hidden="true" focusable="false"><style>.joy .ksc-redecorate .pol{transform-box:fill-box}
.joy .ksc-redecorate.open .pol{animation:k118_redecorate .09s linear 0s 5}
@keyframes k118_redecorate{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-redecorate .dev{transition:opacity .3s}
.joy .ksc-redecorate.open .dev{opacity:0;transition:opacity 1.6s ease-in .5s}
