<svg xmlns="http://www.w3.org/2000/svg" viewBox="186 119 209 418" aria-hidden="true" focusable="false"><style>.joy .ksc-spanight .fx{opacity:0;transform-box:fill-box}
.joy .ksc-spanight.open .fx{animation:k52_spanight 1.6s ease-out var(--d, 0s) 2}
@keyframes k52_spanight{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-120px)}}
.joy .ksc-spanight .lb{transform-box:fill-box}
.joy .ksc-spanight.open .lb{animation:k56_spanight .09s linear 0s 4}
@keyframes k56_spanight{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
