<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 63 269 434" aria-hidden="true" focusable="false"><style>.joy .ksc-thirdwave .lid{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-thirdwave.open .lid{transform:translate(70px,-90px) rotate(24deg);transition:transform 0.6s cubic-bezier(.3,1.2,.5,1) 0s}
.joy .ksc-thirdwave .sm{opacity:0;transform-box:fill-box}
.joy .ksc-thirdwave.open .sm{animation:k285_thirdwave 1.8s ease-out var(--d, 0s) 3}
@keyframes k285_thirdwave{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-70px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-thirdwave .lid,.joy .ksc-thirdwave .sm{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cu"><g transform="translate(300 320) rotate(-3)"><path d="M-90 -120 H90 L74 160 H-74 Z" fill="#f6f3ec"></path><path d="M-84 -10 H84 L78 80 H-78 Z" fill="#2b2b30"></path><text x="0" y="30" font-family="'Young Serif', serif" font-size="23.4" fill="#f6f3ec" text-anchor="middle">Third Wave</text><text x="0" y="56" font-family="'Space Mono', monospace" font-size="10" fill="#f6f3ec" text-anchor="middle">Oberoi Mall</text><text x="0" y="-60" font-family="'Permanent Marker', cursive" font-size="22.2" fill="#2b2b30" text-anchor="middle" transform="rotate(-4 0 -60)">2 cold brews</text><g class="lid"><path d="M-100 -122 H100 L94 -146 H-94 Z" fill="#e2ded3"></path><path d="M-80 -146 C-80 -170 80 -170 80 -146 Z" fill="#efebe2"></path><ellipse cx="36" cy="-160" rx="14" ry="5" fill="#333"></ellipse></g><ellipse cy="-122" rx="88" ry="10" fill="#3a2010"></ellipse><path class="sm" style="--d:0.00s" d="M-30 -150 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M0 -150 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M30 -150 c-12 -16 12 -24 0 -42 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"></path></g></g></svg>
