<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 245 288" aria-hidden="true" focusable="false"><style>.joy .ksc-hideseek .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-hideseek .fb{opacity:0}
.joy .ksc-hideseek.open .cf{animation:cfs_hideseek .275s linear 5}
.joy .ksc-hideseek.open .fa{animation:cfa_hideseek 1.375s step-end both}
.joy .ksc-hideseek.open .fb{animation:cfb_hideseek 1.375s step-end both}
@keyframes cfs_hideseek{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_hideseek{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_hideseek{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-hideseek.open .toss{animation:tossup_hideseek 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_hideseek{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-hideseek .cf,.joy .ksc-hideseek .fa,.joy .ksc-hideseek .fb,.joy .ksc-hideseek .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#2b3a63" stroke="#141c35" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#141c35" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#f6efe0" text-anchor="middle">lights off</text><text x="0" y="16" font-family="Fraunces, serif" font-size="40" font-weight="700" fill="#f6efe0" text-anchor="middle">30</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#f6efe0" text-anchor="middle">count, eyes closed</text><g transform="translate(0 -78) scale(0.5)"><path d="M10 -24 A26 26 0 1 0 10 24 A20 20 0 1 1 10 -24 Z" fill="#f5edc8"></path></g></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="32.3" font-weight="700" fill="#f6efe0" text-anchor="middle">found you</text><text x="0" y="36" font-family="Kalam, cursive" font-size="17.8" fill="#f6efe0" text-anchor="middle">behind the curtain</text></g></g></g></g></svg>
