<svg xmlns="http://www.w3.org/2000/svg" viewBox="105 88 444 425" aria-hidden="true" focusable="false"><style>.joy .ksc-mehendi .hv{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-mehendi.open .hv{stroke-dashoffset:0;transition:stroke-dashoffset 0.7s ease-out calc(0.2s + var(--d, 0s))}
.joy .ksc-mehendi .hc{transform-box:fill-box}
.joy .ksc-mehendi.open .hc{animation:k84_mehendi .09s linear 0s 4}
