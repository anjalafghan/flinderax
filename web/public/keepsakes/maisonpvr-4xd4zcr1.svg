<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 143 471 337" aria-hidden="true" focusable="false"><style>.joy .ksc-maisonpvr .tear{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-maisonpvr.open .tear{transform:translate(46px,22px) rotate(9deg);transition:transform 0.7s cubic-bezier(.3,1.2,.5,1) 0.2s}
.joy .ksc-maisonpvr .punch{opacity:0;transition:opacity .15s}
.joy .ksc-maisonpvr.open .punch{opacity:1;transition:opacity 0.3s ease-out calc(0.1s + var(--d, 0s))}
.joy .ksc-maisonpvr .tk{transform-box:fill-box;transform-origin:0% 50%}
.joy .ksc-maisonpvr.open .tk{animation:k9_maisonpvr 2.2s ease-in-out 0.2s 1}
@keyframes k9_maisonpvr{0%,100%{transform:rotate(0)}20%{transform:rotate(3deg)}45%{transform:rotate(-2.4000000000000004deg)}70%{transform:rotate(1.35deg)}88%{transform:rotate(-0.6000000000000001deg)}}
.joy .ksc-maisonpvr .note{opacity:0;transition:opacity .15s}
.joy .ksc-maisonpvr.open .note{opacity:1;transition:opacity 0.3s ease-out calc(0.7s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-maisonpvr .tear,.joy .ksc-maisonpvr .punch,.joy .ksc-maisonpvr .tk,.joy .ksc-maisonpvr .note{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="tk"><g transform="translate(100 190) rotate(-5)"><path d="M18 0 H382 A18 18 0 0 0 400 18 V192 A18 18 0 0 0 382 210 H18 A18 18 0 0 0 0 192 V18 A18 18 0 0 0 18 0 Z" fill="#f6efe3"></path><path d="M18 0 H382 A18 18 0 0 0 400 18 V192 A18 18 0 0 0 382 210 H18 A18 18 0 0 0 0 192 V18 A18 18 0 0 0 18 0 Z" fill="none" stroke="#00000018" stroke-width="1.2"></path><path d="M0 0 H288 V44 H0 Z" fill="#2a2238"></path><text x="150" y="30" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">JIO WORLD DRIVE, BKC</text><text x="150" y="92" font-family="Fraunces, serif" font-size="30" font-weight="700" fill="#24303a" text-anchor="middle">Maison PVR</text><text x="20" y="126" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">recliners G7 + G8</text><text x="20" y="148" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">blanket, popcorn, feet up</text><text x="20" y="170" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">evening show</text><g transform="translate(260 150) scale(0.6)"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#e9c46a"></path></g><path d="M300 14 V196" stroke="#5a4a3a" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="3 5"></path><g class="tear"><path d="M312 0 H400 V210 H312 A12 12 0 0 0 312 210 Z" fill="#f6efe3"></path><path d="M312 0 H400 V44 H312 Z" fill="#2a2238"></path><g transform="translate(356 120) rotate(-90)"><text x="0" y="6" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#24303a" text-anchor="middle">RECLINER</text></g><path class="punch" d="M356 54 l3 7 l8 1 l-6 5 l2 8 l-7 -4 l-7 4 l2 -8 l-6 -5 l8 -1 Z" fill="#1d1a16"></path></g><text class="note" x="200" y="268" font-family="Kalam, cursive" font-size="22" fill="#fff8ea" text-anchor="middle" transform="rotate(-3 200 268)">fell asleep for 4 minutes</text></g></g></svg>
