<svg xmlns="http://www.w3.org/2000/svg" viewBox="83 83 409 404" aria-hidden="true" focusable="false"><style>.joy .ksc-scavengercall .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-scavengercall.open .mk{stroke-dashoffset:0;transition:stroke-dashoffset 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-scavengercall .mw{opacity:0;transition:opacity .15s}
.joy .ksc-scavengercall.open .mw{opacity:1;transition:opacity 0.15s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-scavengercall .ring{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-scavengercall.open .ring{stroke-dashoffset:0;transition:stroke-dashoffset 0.6s ease-out calc(1.1s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-scavengercall .mk,.joy .ksc-scavengercall .mw,.joy .ksc-scavengercall .ring{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(115.0 145.0) rotate(-3)"><rect x="-18" y="-24" width="366" height="354" rx="14" fill="#b07c45"></rect><g transform="translate(115.0 -38)"><rect width="100" height="40" rx="8" fill="#c9ccd1"></rect></g><path d="M0 0 H330 V310 H0 Z" fill="#fbf8ef"></path><text x="20" y="46" font-family="'Young Serif', serif" font-size="24" fill="#2b2b30" text-anchor="start">Show me...</text><text x="20" y="70" font-family="'Space Mono', monospace" font-size="10" fill="#6b6658" text-anchor="start">first to the camera wins</text><text x="240" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#1f4bb5" text-anchor="middle">me</text><text x="290" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#c0392b" text-anchor="middle">you</text><text x="20" y="130" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">something blue</text><path d="M16 143 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.15s" pathLength="1" d="M231 124 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><text style="--d:0.25s" class="mw" x="290" y="130" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle"></text><text x="20" y="170" font-family="Kalam, cursive" font-size="13.0" fill="#2b2b30" text-anchor="start">the oldest thing you own</text><path d="M16 183 H314" stroke="#c9c2b0"></path><text style="--d:0.35s" class="mw" x="240" y="170" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle"></text><path class="mk" style="--d:0.45s" pathLength="1" d="M281 164 l6 7 l12 -16" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"></path><text x="20" y="210" font-family="Kalam, cursive" font-size="17.3" fill="#2b2b30" text-anchor="start">a spoon, any spoon</text><path d="M16 223 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.55s" pathLength="1" d="M231 204 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><text style="--d:0.65s" class="mw" x="290" y="210" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle"></text><text x="20" y="250" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">a photo of us</text><path d="M16 263 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.75s" pathLength="1" d="M231 244 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><path class="mk" style="--d:0.85s" pathLength="1" d="M281 244 l6 7 l12 -16" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"></path><path class="ring" pathLength="1" d="M12 254 C40 228 300 226 322 248 C330 270 40 272 10 256" fill="none" stroke="#2c7a3f" stroke-width="2.4"></path></g></svg>
