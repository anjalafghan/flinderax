<svg xmlns="http://www.w3.org/2000/svg" viewBox="83 63 411 444" aria-hidden="true" focusable="false"><style>.joy .ksc-boardgames .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-boardgames.open .mk{stroke-dashoffset:0;transition:stroke-dashoffset 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-boardgames .mw{opacity:0;transition:opacity .15s}
.joy .ksc-boardgames.open .mw{opacity:1;transition:opacity 0.15s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-boardgames .ring{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-boardgames.open .ring{stroke-dashoffset:0;transition:stroke-dashoffset 0.6s ease-out calc(1.3s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-boardgames .mk,.joy .ksc-boardgames .mw,.joy .ksc-boardgames .ring{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(115.0 125.0) rotate(-3)"><rect x="-18" y="-24" width="366" height="394" rx="14" fill="#b07c45"></rect><g transform="translate(115.0 -38)"><rect width="100" height="40" rx="8" fill="#c9ccd1"></rect></g><path d="M0 0 H330 V350 H0 Z" fill="#fbf8ef"></path><text x="20" y="46" font-family="'Young Serif', serif" font-size="24" fill="#2b2b30" text-anchor="start">Best of five</text><text x="20" y="70" font-family="'Space Mono', monospace" font-size="10" fill="#6b6658" text-anchor="start">a game we had never played</text><text x="240" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#1f4bb5" text-anchor="middle">me</text><text x="290" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#c0392b" text-anchor="middle">you</text><text x="20" y="130" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">game 1</text><path d="M16 143 H314" stroke="#c9c2b0"></path><text style="--d:0.15s" class="mw" x="240" y="130" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">W</text><text style="--d:0.25s" class="mw" x="290" y="130" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle"></text><text x="20" y="170" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">game 2</text><path d="M16 183 H314" stroke="#c9c2b0"></path><text style="--d:0.35s" class="mw" x="240" y="170" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle"></text><text style="--d:0.45s" class="mw" x="290" y="170" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">W</text><text x="20" y="210" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">game 3</text><path d="M16 223 H314" stroke="#c9c2b0"></path><text style="--d:0.55s" class="mw" x="240" y="210" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">W</text><text style="--d:0.65s" class="mw" x="290" y="210" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle"></text><text x="20" y="250" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">game 4</text><path d="M16 263 H314" stroke="#c9c2b0"></path><text style="--d:0.75s" class="mw" x="240" y="250" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle"></text><text style="--d:0.85s" class="mw" x="290" y="250" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">W</text><text x="20" y="290" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">game 5</text><path d="M16 303 H314" stroke="#c9c2b0"></path><text style="--d:0.95s" class="mw" x="240" y="290" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">W</text><text style="--d:1.05s" class="mw" x="290" y="290" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle"></text><path class="ring" pathLength="1" d="M12 294 C40 268 300 266 322 288 C330 310 40 312 10 296" fill="none" stroke="#2c7a3f" stroke-width="2.4"></path><g transform="translate(290 40) scale(0.6)"><rect x="-20" y="-20" width="40" height="40" rx="8" fill="#f6f3ec" stroke="#2b2b30" stroke-width="2"></rect><circle cx="-9" cy="-9" r="4" fill="#2b2b30"></circle><circle cx="9" cy="9" r="4" fill="#2b2b30"></circle><circle cx="0" cy="0" r="4" fill="#2b2b30"></circle></g></g></svg>
