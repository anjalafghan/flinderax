<svg xmlns="http://www.w3.org/2000/svg" viewBox="113 125 314 350" aria-hidden="true" focusable="false"><style>.joy .ksc-coopgame .md{transform-box:fill-box}
.joy .ksc-coopgame.open .md{animation:k93_coopgame .09s linear 0.2s 6}
@keyframes k93_coopgame{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.joy .ksc-coopgame .nt{opacity:0;transform-box:fill-box}
.joy .ksc-coopgame.open .nt{animation:k94_coopgame 2s ease-out var(--d, 0s) 2}
@keyframes k94_coopgame{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-90px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-coopgame .md,.joy .ksc-coopgame .nt{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="md"><g transform="translate(270 300) rotate(-6)"><path d="M-130 -150 H110 L130 -130 V150 H-130 Z" fill="#2f6d57"></path><rect x="-110" y="-120" width="220" height="170" rx="6" fill="#f6efe0"></rect><text x="0" y="-80" font-family="Fraunces, serif" font-size="28" font-weight="800" fill="#2b2b30" text-anchor="middle">CO-OP SAVE</text><text x="0" y="-46" font-family="'Space Mono', monospace" font-size="12" fill="#2b2b30" text-anchor="middle">player 1: you</text><text x="0" y="-22" font-family="'Space Mono', monospace" font-size="12" fill="#2b2b30" text-anchor="middle">player 2: me</text><text x="0" y="2" font-family="'Space Mono', monospace" font-size="12" fill="#2b2b30" text-anchor="middle">day 14, spring</text><text x="0" y="26" font-family="'Space Mono', monospace" font-size="12" fill="#2b2b30" text-anchor="middle">one friend pass</text><text x="0" y="50" font-family="'Space Mono', monospace" font-size="12" fill="#2b2b30" text-anchor="middle">do not overwrite</text><rect x="-110" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="-92" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="-74" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="-56" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="-38" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="-20" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="-2" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="16" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="34" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="52" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="70" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="88" y="120" width="10" height="30" fill="#c9a14a"></rect><rect x="106" y="120" width="10" height="30" fill="#c9a14a"></rect></g></g><g transform="translate(420 150) scale(.7)"><g class="nt" style="--d:0.0s"><path d="M-6 14 V-20 L18 -26 V8" fill="none" stroke="#fff" stroke-width="3"></path><ellipse cx="-11" cy="14" rx="7" ry="5" fill="#fff"></ellipse><ellipse cx="13" cy="8" rx="7" ry="5" fill="#fff"></ellipse></g></g><g transform="translate(450 120) scale(.7)"><g class="nt" style="--d:0.4s"><path d="M-6 14 V-20 L18 -26 V8" fill="none" stroke="#fff" stroke-width="3"></path><ellipse cx="-11" cy="14" rx="7" ry="5" fill="#fff"></ellipse><ellipse cx="13" cy="8" rx="7" ry="5" fill="#fff"></ellipse></g></g><g transform="translate(480 150) scale(.7)"><g class="nt" style="--d:0.8s"><path d="M-6 14 V-20 L18 -26 V8" fill="none" stroke="#fff" stroke-width="3"></path><ellipse cx="-11" cy="14" rx="7" ry="5" fill="#fff"></ellipse><ellipse cx="13" cy="8" rx="7" ry="5" fill="#fff"></ellipse></g></g></svg>
