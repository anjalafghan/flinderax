ath><circle cy="-12" r="9" fill="#1d2b30"></circle></g><g transform="translate(0 100) rotate(-2)"><path d="M-137.0 -20.0 H137.0 L127.0 2 L137.0 28.0 H-137.0 L-127.0 2 Z" fill="#1d2b30" opacity=".85"></path><path d="M-125.0 -24.0 H125.0 V24.0 Q0 30.0 -125.0 24.0 Z" fill="#1d2b30"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="19.2" fill="#fbf8f1" text-anchor="middle">Street View holiday</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">we walked Lisbon</text></g><ellipse class="gloss" cx="-40" cy="-60" rx="70" ry="22" fill="#fff" opacity=".18" transform="rotate(-24 -40 -60)"></ellipse></g></g></svg>
