<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 14 509 497" aria-hidden="true" focusable="false"><style>.joy .ksc-bookclub .bm{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-bookclub.open .bm{transform:translate(0px,-30px) rotate(-4deg);transition:transform 0.6s cubic-bezier(.3,1.2,.5,1) 0.3s}
.joy .ksc-bookclub .cov{transform-box:view-box;transform-origin:300px 0;transition:transform .5s}
.joy .ksc-bookclub.open .cov{transform:scaleX(-.0);transition:transform .6s}
.joy .ksc-bookclub .ts{transform-box:fill-box;transform-origin:50% 100%}
.joy .ksc-bookclub.open .ts{animation:tsw_bookclub .6s ease-in-out .5s 3 alternate}
@keyframes tsw_bookclub{to{transform:rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-bookclub .cov,.joy .ksc-bookclub .ts,.joy .ksc-bookclub .bm{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(300 330) rotate(-3)"><g class="bk"><path d="M-170 -96 Q-90 -124 0 -108 V150 Q-90 136 -170 160 Z" fill="#f6efe0"></path><path d="M0 -108 Q90 -124 170 -96 V160 Q90 136 0 150 Z" fill="#f6efe0"></path><path d="M-20 -80 H-150" stroke="#c9c2b0" stroke-width="2"></path><path d="M-20 -58 H-150" stroke="#c9c2b0" stroke-width="2"></path><path d="M-20 -36 H-150" stroke="#c9c2b0" stroke-width="2"></path><path d="M-20 -14 H-150" stroke="#c9c2b0" stroke-width="2"></path><path d="M-20 8 H-150" stroke="#c9c2b0" stroke-width="2"></path><path d="M-20 30 H-150" stroke="#c9c2b0" stroke-width="2"></path><path d="M-20 52 H-150" stroke="#c9c2b0" stroke-width="2"></path><path d="M-20 74 H-150" stroke="#c9c2b0" stroke-width="2"></path><path d="M-20 96 H-150" stroke="#c9c2b0" stroke-width="2"></path><path d="M-20 118 H-150" stroke="#c9c2b0" stroke-width="2"></path><path d="M20 -80 H150" stroke="#c9c2b0" stroke-width="2"></path><path d="M20 -58 H150" stroke="#c9c2b0" stroke-width="2"></path><path d="M20 -36 H150" stroke="#c9c2b0" stroke-width="2"></path><path d="M20 -14 H150" stroke="#c9c2b0" stroke-width="2"></path><path d="M20 8 H150" stroke="#c9c2b0" stroke-width="2"></path><path d="M20 30 H150" stroke="#c9c2b0" stroke-width="2"></path><path d="M20 52 H150" stroke="#c9c2b0" stroke-width="2"></path><path d="M20 74 H150" stroke="#c9c2b0" stroke-width="2"></path><path d="M20 96 H150" stroke="#c9c2b0" stroke-width="2"></path><path d="M20 118 H150" stroke="#c9c2b0" stroke-width="2"></path></g><g class="cov"><path d="M-6 -114 Q90 -130 176 -102 V166 Q90 142 -6 156 Z" fill="#7a1a16"></path></g><g class="bm"><path d="M-40 -170 H40 V120 L0 96 L-40 120 Z" fill="#2f6d57"></path><g transform="translate(-12 -40) rotate(-90)"><text x="0" y="8" font-family="'Young Serif', serif" font-size="22" fill="#f6efe0" text-anchor="middle">Book club of two</text></g><g transform="translate(10 -40) rotate(-90)"><text x="0" y="6" font-family="Kalam, cursive" font-size="13" fill="#f6efe0" text-anchor="middle">a chapter a day</text></g><g transform="translate(28 -40) rotate(-90)"><text x="0" y="6" font-family="Kalam, cursive" font-size="13" fill="#f6efe0" text-anchor="middle">Sundays, with chai</text></g><path d="M0 -170 C10 -200 -10 -220 0 -240" fill="none" stroke="#c9a14a" stroke-width="3"></path><path class="ts" d="M-8 -240 H8 L4 -270 H-4 Z" fill="#c9a14a"></path></g></g></svg>
