<svg xmlns="http://www.w3.org/2000/svg" viewBox="145 95 310 441" aria-hidden="true" focusable="false"><style>.joy .ksc-kolad .shine{opacity:0}
.joy .ksc-kolad.open .shine{animation:shn_kolad .9s ease-out .2s}
@keyframes shn_kolad{0%{opacity:0;transform:translateX(0)}30%{opacity:.6}100%{opacity:0;transform:translateX(160px)}}
.joy .ksc-kolad .bd{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-kolad.open .bd{animation:k50_kolad 2.2s ease-in-out 0s 1}
@keyframes k50_kolad{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}45%{transform:rotate(-4.0deg)}70%{transform:rotate(2.25deg)}88%{transform:rotate(-1.0deg)}}
.joy .ksc-kolad .tails{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-kolad.open .tails{animation:flut_kolad .3s ease-in-out 5 alternate}
@keyframes flut_kolad{to{transform:skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-kolad .tails,.joy .ksc-kolad .shine,.joy .ksc-kolad .bd{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="bd"><g transform="translate(300 250) rotate(-6)"><g class="tails"><path d="M-60 80 L-90 260 L-60 236 L-36 266 L-10 96 Z" fill="#2f6db5"></path><path d="M60 80 L90 260 L60 236 L36 266 L10 96 Z" fill="#e46f2a"></path></g><circle r="130" fill="#e46f2a"></circle><circle r="120" fill="#f2f6f8"></circle><circle r="108" fill="none" stroke="#2b2b30" stroke-opacity=".4" stroke-dasharray="3 5"></circle><text x="0" y="-44" font-family="'Young Serif', serif" font-size="26" fill="#2b2b30" text-anchor="middle">Kundalika</text><text x="0" y="20" font-family="Fraunces, serif" font-size="52" font-weight="800" fill="#2b2b30" text-anchor="middle">RAPIDS</text><text x="0" y="56" font-family="'Space Mono', monospace" font-size="11" fill="#2b2b30" text-anchor="middle">Kolad, monsoon water</text><g transform="translate(0 86) scale(0.9)"><path d="M-44 -8 q11 -8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#2f6db5" stroke-width="3" stroke-linecap="round"></path><path d="M-44 6 q11 -8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#2f6db5" stroke-width="3" stroke-linecap="round"></path><path d="M-44 20 q11 -8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#2f6db5" stroke-width="3" stroke-linecap="round"></path></g><path class="shine" d="M-90 -40 L-40 -110 L-20 -110 L-70 -40 Z" fill="#fff" opacity="0"></path></g></g></svg>
