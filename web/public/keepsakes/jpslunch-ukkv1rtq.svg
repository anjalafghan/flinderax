<svg xmlns="http://www.w3.org/2000/svg" viewBox="57 97 465 445" aria-hidden="true" focusable="false"><style>.joy .ksc-jpslunch .sm{opacity:0;transform-box:fill-box}
.joy .ksc-jpslunch.open .sm{animation:k288_jpslunch 1.8s ease-out var(--d, 0s) 3}
@keyframes k288_jpslunch{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-jpslunch .gn{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-jpslunch.open .gn{animation:k289_jpslunch .5s cubic-bezier(.3,1.6,.5,1) calc(0.3s + var(--d, 0s)) both}
@keyframes k289_jpslunch{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
