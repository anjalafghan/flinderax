<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 8 539 590" aria-hidden="true" focusable="false"><style>.joy .ksc-drawing .ink{stroke-dasharray:1;stroke-dashoffset:0}
.joy .ksc-drawing .guess-2,.joy .ksc-drawing .guess-3,.joy .ksc-drawing .strike,.joy .ksc-drawing .t3{opacity:0}
.joy .ksc-drawing.open .t80{opacity:0;transition:opacity 0s 2.6s}
.joy .ksc-drawing.open .t3{opacity:1;transition:opacity 0s 2.6s}
.joy .ksc-drawing .strike{stroke-dasharray:1;stroke-dashoffset:1}
.joy .ksc-drawing .crown,.joy .ksc-drawing .pink{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-drawing .crown{opacity:0;transform:translateY(-120px) rotate(-30deg);transition:opacity .15s linear,transform .3s ease-in}
.joy .ksc-drawing .pink{transform:translate(-170px,-70px) rotate(-6deg);transition:transform .35s ease-in}
.joy .ksc-drawing .timer{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .3s linear}
.joy .ksc-drawing.open .ink{animation:draw_drawing .5s ease-in-out both;animation-delay:calc(var(--i) * .16s)}
.joy .ksc-drawing.open .ink-dot{animation:pop_drawing .2s ease-out 1.5s both}
.joy .ksc-drawing.open .timer{stroke-dashoffset:.86;transition:stroke-dashoffset 3s linear}
.joy .ksc-drawing.open .guess-1 .strike{opacity:1;stroke-dashoffset:0;transition:stroke-dashoffset .25s ease-out 1.7s}
.joy .ksc-drawing.open .guess-2{opacity:1;transition:opacity .1s 1.95s}
.joy .ksc-drawing.open .guess-2 .strike{opacity:1;stroke-dashoffset:0;transition:stroke-dashoffset .25s ease-out 2.25s}
.joy .ksc-drawing.open .guess-3{opacity:1;transition:opacity .2s 2.55s}
.joy .ksc-drawing.open .crown{opacity:1;transform:none;transition:opacity .1s 2.9s,transform .7s cubic-bezier(.3,1.5,.5,1) 2.9s}
.joy .ksc-drawing.open .pink{transform:none;transition:transform .6s cubic-bezier(.2,.8,.25,1) 3.3s}
@keyframes draw_drawing{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop_drawing{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-drawing .crown,.joy .ksc-drawing .pink,.joy .ksc-drawing .timer,.joy .ksc-drawing .strike,.joy .ksc-drawing .guess-2,.joy .ksc-drawing .guess-3{transition-duration:.01s!important;transition-delay:0s!important}
.joy .ksc-drawing.open .ink,.joy .ksc-drawing.open .ink-dot{animation:none}}</style><defs>
<filter id="drawing-d-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0 0.02  0 0 0 0.12 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter>
<linearGradient id="drawing-d-note" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d34c"></stop><stop offset=".14" stop-color="#f8e066"></stop><stop offset="1" stop-color="#f6dc5e"></stop></linearGradient>
<linearGradient id="drawing-d-curl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9e98f"></stop><stop offset="1" stop-color="#d6b836"></stop></linearGradient>
<linearGradient id="drawing-d-pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f294ad"></stop><stop offset=".16" stop-color="#f7a9be"></stop><stop offset="1" stop-color="#f5a3b9"></stop></linearGradient>
<linearGradient id="drawing-d-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd95a"></stop><stop offset="1" stop-color="#e6ad1f"></stop></linearGradient>
</defs>
<g class="pink"><g transform="translate(384 318) rotate(7)">
<path d="M0 0 H190 V160 H0 Z" fill="url(#drawing-d-pink)"></path>
