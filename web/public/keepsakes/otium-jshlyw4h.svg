<svg xmlns="http://www.w3.org/2000/svg" viewBox="168 41 285 440" aria-hidden="true" focusable="false"><style>.joy .ksc-otium .cv{transform-box:fill-box;transform-origin:50% 0%;transition:transform .45s .2s}
.joy .ksc-otium.open .cv{transform:scaleY(-.35) translateY(40px);transition:transform .45s}
.joy .ksc-otium .mt{transform-box:fill-box;transition:transform .3s}
.joy .ksc-otium.open .mt{transform:translateY(-60px) rotate(8deg);transition:transform .5s cubic-bezier(.3,1.3,.5,1) .4s}
.joy .ksc-otium .fl{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.joy .ksc-otium.open .fl{opacity:1;animation:flk_otium .5s ease-in-out .9s infinite alternate;transition:opacity .2s .9s}
@keyframes flk_otium{to{transform:scale(.88,1.12)}}
