t-size="15" fill="#f2d38c" text-anchor="middle">leisure, by definition</text><g class="cv"><rect width="220" height="230" rx="10" fill="#1f2b4d"></rect><text x="110.0" y="80" font-family="Fraunces, serif" font-size="34" font-weight="800" fill="#f2d38c" text-anchor="middle">Otium</text><text x="110.0" y="108" font-family="'Space Mono', monospace" font-size="11" fill="#f2d38c" text-anchor="middle">The Empresa, rooftop</text></g></g></svg>
