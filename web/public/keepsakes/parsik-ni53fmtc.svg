<svg xmlns="http://www.w3.org/2000/svg" viewBox="149 99 302 437" aria-hidden="true" focusable="false"><style>.joy .ksc-parsik .shine{opacity:0}
.joy .ksc-parsik.open .shine{animation:shn_parsik .9s ease-out .2s}
@keyframes shn_parsik{0%{opacity:0;transform:translateX(0)}30%{opacity:.6}100%{opacity:0;transform:translateX(160px)}}
.joy .ksc-parsik .bd{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-parsik.open .bd{animation:k141_parsik 2.2s ease-in-out 0s 1}
@keyframes k141_parsik{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}45%{transform:rotate(-4.0deg)}70%{transform:rotate(2.25deg)}88%{transform:rotate(-1.0deg)}}
.joy .ksc-parsik .tails{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-parsik.open .tails{animation:flut_parsik .3s ease-in-out 5 alternate}
@keyframes flut_parsik{to{transform:skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-parsik .tails,.joy .ksc-parsik .shine,.joy .ksc-parsik .bd{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="bd"><g transform="translate(300 250) rotate(-6)"><g class="tails"><path d="M-60 80 L-90 260 L-60 236 L-36 266 L-10 96 Z" fill="#2f6db5"></path><path d="M60 80 L90 260 L60 236 L36 266 L10 96 Z" fill="#f6a04d"></path></g><circle cx="124.0" cy="0.0" r="14" fill="#f6a04d"></circle><circle cx="119.8" cy="32.1" r="14" fill="#f6a04d"></circle><circle cx="107.4" cy="62.0" r="14" fill="#f6a04d"></circle><circle cx="87.7" cy="87.7" r="14" fill="#f6a04d"></circle><circle cx="62.0" cy="107.4" r="14" fill="#f6a04d"></circle><circle cx="32.1" cy="119.8" r="14" fill="#f6a04d"></circle><circle cx="0.0" cy="124.0" r="14" fill="#f6a04d"></circle><circle cx="-32.1" cy="119.8" r="14" fill="#f6a04d"></circle><circle cx="-62.0" cy="107.4" r="14" fill="#f6a04d"></circle><circle cx="-87.7" cy="87.7" r="14" fill="#f6a04d"></circle><circle cx="-107.4" cy="62.0" r="14" fill="#f6a04d"></circle><circle cx="-119.8" cy="32.1" r="14" fill="#f6a04d"></circle><circle cx="-124.0" cy="0.0" r="14" fill="#f6a04d"></circle><circle cx="-119.8" cy="-32.1" r="14" fill="#f6a04d"></circle><circle cx="-107.4" cy="-62.0" r="14" fill="#f6a04d"></circle><circle cx="-87.7" cy="-87.7" r="14" fill="#f6a04d"></circle><circle cx="-62.0" cy="-107.4" r="14" fill="#f6a04d"></circle><circle cx="-32.1" cy="-119.8" r="14" fill="#f6a04d"></circle><circle cx="-0.0" cy="-124.0" r="14" fill="#f6a04d"></circle><circle cx="32.1" cy="-119.8" r="14" fill="#f6a04d"></circle><circle cx="62.0" cy="-107.4" r="14" fill="#f6a04d"></circle><circle cx="87.7" cy="-87.7" r="14" fill="#f6a04d"></circle><circle cx="107.4" cy="-62.0" r="14" fill="#f6a04d"></circle><circle cx="119.8" cy="-32.1" r="14" fill="#f6a04d"></circle><circle r="120" fill="#f6efe0"></circle><circle r="108" fill="none" stroke="#2b2b30" stroke-opacity=".4" stroke-dasharray="3 5"></circle><text x="0" y="-44" font-family="'Young Serif', serif" font-size="26" fill="#2b2b30" text-anchor="middle">Parsik Hill</text><text x="0" y="20" font-family="Fraunces, serif" font-size="49.4" font-weight="800" fill="#2b2b30" text-anchor="middle">sunrise</text><text x="0" y="56" font-family="'Space Mono', monospace" font-size="11" fill="#2b2b30" text-anchor="middle">Kalwa side, over the creek</text><g transform="translate(0 86) scale(0.8)"><circle r="18" fill="#f6a04d"></circle><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(0)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(45)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(90)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(135)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(180)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(225)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(270)"></path><path d="M0 -26 V-36" stroke="#f6a04d" stroke-width="4" stroke-linecap="round" transform="rotate(315)"></path></g><path class="shine" d="M-90 -40 L-40 -110 L-20 -110 L-70 -40 Z" fill="#fff" opacity="0"></path></g></g></svg>
