<svg xmlns="http://www.w3.org/2000/svg" viewBox="127 55 333 446" aria-hidden="true" focusable="false"><style>.joy .ksc-carepackage .fx{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-carepackage.open .fx{animation:k97_carepackage .5s cubic-bezier(.3,1.6,.5,1) calc(0.2s + var(--d, 0s)) both}
@keyframes k97_carepackage{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
.joy .ksc-carepackage .lb{transform-box:fill-box}
.joy .ksc-carepackage.open .lb{animation:k99_carepackage .09s linear 0s 4}
@keyframes k99_carepackage{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
