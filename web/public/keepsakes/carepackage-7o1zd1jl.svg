3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g><g transform="translate(0 -240)"><g class="fx" style="--d:0.8s"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#fff3b0"></path></g></g></g></g></svg>
