.joy .ksc-dhobighat .stp{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-dhobighat.open .stp{animation:k137_dhobighat .25s ease-out calc(0.6s + var(--d, 0s)) both}
