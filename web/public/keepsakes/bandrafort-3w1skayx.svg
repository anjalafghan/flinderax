.joy .ksc-bandrafort .shine{opacity:0}
.joy .ksc-bandrafort.open .shine{animation:shn_bandrafort 1s ease-out .15s}
@keyframes shn_bandrafort{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
