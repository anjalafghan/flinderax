<svg xmlns="http://www.w3.org/2000/svg" viewBox="113 115 327 317" aria-hidden="true" focusable="false"><style>.joy .ksc-prithvicafe .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-prithvicafe .pc{transform-box:fill-box;transform-origin:0% 100%}
.joy .ksc-prithvicafe.open .pc{transform:rotate(-7deg) translate(-4px,-14px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.joy .ksc-prithvicafe .pc{transition:transform .3s}
.joy .ksc-prithvicafe .shine{opacity:0}
.joy .ksc-prithvicafe.open .shine{animation:shn_prithvicafe 1s ease-out .2s}
