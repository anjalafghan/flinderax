<svg xmlns="http://www.w3.org/2000/svg" viewBox="77 160 386 279" aria-hidden="true" focusable="false"><style>.joy .ksc-hindirap .reel{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-hindirap.open .reel{animation:k8_hindirap 2.4s cubic-bezier(.3,0,.3,1) 0s}
@keyframes k8_hindirap{to{transform:rotate(1440deg)}}
.joy .ksc-hindirap .nt{opacity:0;transform-box:fill-box}
.joy .ksc-hindirap.open .nt{animation:k9_hindirap 2s ease-out var(--d, 0s) 2}
@keyframes k9_hindirap{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-90px)}}
