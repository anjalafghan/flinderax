<svg xmlns="http://www.w3.org/2000/svg" viewBox="83 103 406 364" aria-hidden="true" focusable="false"><style>.joy .ksc-croffle .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-croffle.open .mk{stroke-dashoffset:0;transition:stroke-dashoffset 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-croffle .mw{opacity:0;transition:opacity .15s}
.joy .ksc-croffle.open .mw{opacity:1;transition:opacity 0.15s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-croffle .ring{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-croffle.open .ring{stroke-dashoffset:0;transition:stroke-dashoffset 0.6s ease-out calc(0.9000000000000001s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-croffle .mk,.joy .ksc-croffle .mw,.joy .ksc-croffle .ring{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(115.0 165.0) rotate(-3)"><rect x="-18" y="-24" width="366" height="314" rx="14" fill="#b07c45"></rect><g transform="translate(115.0 -38)"><rect width="100" height="40" rx="8" fill="#c9ccd1"></rect></g><path d="M0 0 H330 V270 H0 Z" fill="#fbf8ef"></path><text x="20" y="46" font-family="'Young Serif', serif" font-size="24" fill="#2b2b30" text-anchor="start">Croffle-off</text><text x="20" y="70" font-family="'Space Mono', monospace" font-size="10" fill="#6b6658" text-anchor="start">Lokhandwala, split both</text><text x="240" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#1f4bb5" text-anchor="middle">me</text><text x="290" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#c0392b" text-anchor="middle">you</text><text x="20" y="130" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">sweet croffle</text><path d="M16 143 H314" stroke="#c9c2b0"></path><text style="--d:0.15s" class="mw" x="240" y="130" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">9</text><text style="--d:0.25s" class="mw" x="290" y="130" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">8</text><text x="20" y="170" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">savoury croffle</text><path d="M16 183 H314" stroke="#c9c2b0"></path><text style="--d:0.35s" class="mw" x="240" y="170" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle">7</text><text style="--d:0.45s" class="mw" x="290" y="170" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle">9</text><text x="20" y="210" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">which one again</text><path d="M16 223 H314" stroke="#c9c2b0"></path><text style="--d:0.55s" class="mw" x="240" y="210" font-family="Kalam, cursive" font-size="18.4" font-weight="700" fill="#1f4bb5" text-anchor="middle">sweet</text><text style="--d:0.65s" class="mw" x="290" y="210" font-family="Kalam, cursive" font-size="13.1" font-weight="700" fill="#c0392b" text-anchor="middle">savoury</text></g></svg>
