.joy .ksc-snow.open .sn{animation:fall_snow 2.6s linear var(--d) 2}
.joy .ksc-snow.open .frost{opacity:.85;transition:opacity 1.2s .6s}
.joy .ksc-snow.open .mitt{animation:waveh_snow .5s ease-in-out .3s 4}
