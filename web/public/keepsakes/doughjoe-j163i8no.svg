<svg xmlns="http://www.w3.org/2000/svg" viewBox="57 158 465 384" aria-hidden="true" focusable="false"><style>.joy .ksc-doughjoe .sm{opacity:0;transform-box:fill-box}
.joy .ksc-doughjoe.open .sm{animation:k84_doughjoe 1.8s ease-out var(--d, 0s) 3}
@keyframes k84_doughjoe{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-doughjoe .gn{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-doughjoe.open .gn{animation:k85_doughjoe .5s cubic-bezier(.3,1.6,.5,1) calc(0.3s + var(--d, 0s)) both}
@keyframes k85_doughjoe{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-doughjoe .sm,.joy .ksc-doughjoe .gn{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><rect x="90" y="170" width="420" height="300" rx="26" fill="#c99c6c"></rect><rect x="108" y="188" width="384" height="264" rx="18" fill="none" stroke="#a07a4a" stroke-width="3"></rect><g transform="translate(270 320) scale(3.2)"><path d="M0 30 L-26 -24 C-10 -32 10 -32 26 -24 Z" fill="#f2c14e"></path><path d="M-26 -24 C-10 -32 10 -32 26 -24" fill="none" stroke="#c9852a" stroke-width="6"></path><g fill="#c0392b"><circle cx="-6" cy="-12" r="5"></circle><circle cx="8" cy="0" r="5"></circle><circle cx="-2" cy="12" r="4"></circle></g></g><g transform="translate(440 260) scale(1.6)"><path d="M-20 -14 H20 L16 18 H-16 Z" fill="#f6f3ec"></path><ellipse cy="-14" rx="20" ry="5" fill="#6b3a1f"></ellipse><path d="M20 -6 C32 -6 32 10 18 10" fill="none" stroke="#f6f3ec" stroke-width="4"></path><ellipse cy="20" rx="26" ry="5" fill="#f6f3ec" opacity=".9"></ellipse></g><g transform="translate(440 380) scale(1.6)"><path d="M-20 -14 H20 L16 18 H-16 Z" fill="#f6f3ec"></path><ellipse cy="-14" rx="20" ry="5" fill="#6b3a1f"></ellipse><path d="M20 -6 C32 -6 32 10 18 10" fill="none" stroke="#f6f3ec" stroke-width="4"></path><ellipse cy="20" rx="26" ry="5" fill="#f6f3ec" opacity=".9"></ellipse></g><path class="sm" style="--d:0.00s" d="M240 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="sm" style="--d:0.45s" d="M300 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><path class="sm" style="--d:0.90s" d="M360 250 c-10 -14 10 -22 0 -38 c-8 -12 8 -18 0 -30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"></path><g transform="translate(70 470) rotate(-6)"><path d="M0 0 H210 V60 H0 Z" fill="#fbf6ec"></path><text x="105" y="28" font-family="'Young Serif', serif" font-size="18" fill="#5a1d0c" text-anchor="middle">Dough &amp; Joe</text><text x="105" y="46" font-family="'Space Mono', monospace" font-size="9" fill="#4a3a30" text-anchor="middle">Hill Road, slow-fermented</text></g></svg>
