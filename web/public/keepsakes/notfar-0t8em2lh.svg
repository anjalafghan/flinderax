ung Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">NotFar</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="8.9" fill="#fbf8f1" text-anchor="middle">to share (we didn’t)</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
