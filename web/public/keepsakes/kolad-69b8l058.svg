<svg xmlns="http://www.w3.org/2000/svg" viewBox="126 141 350 303" aria-hidden="true" focusable="false"><style>.joy .ksc-kolad .spk{opacity:0;transition:opacity .15s}
.joy .ksc-kolad.open .spk{opacity:1;transition:opacity 0.3s ease-out calc(0.3s + var(--d, 0s))}
.joy .ksc-kolad .dc-e *{fill:#e46f2a!important;stroke:#e46f2a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-kolad .dc-s *{fill:none!important;stroke:#fff8e8!important;stroke-width:var(--w)!important;stroke-dasharray:4 5!important;fill-opacity:1!important;stroke-opacity:.8!important;opacity:1!important}
.joy .ksc-kolad .pc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-kolad.open .pc{animation:pt_kolad .5s ease-out}
@keyframes pt_kolad{40%{transform:scale(.95)}100%{transform:none}}
