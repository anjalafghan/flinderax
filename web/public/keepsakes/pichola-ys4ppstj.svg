<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 244 289" aria-hidden="true" focusable="false"><style>.joy .ksc-pichola .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-pichola .fb{opacity:0}
.joy .ksc-pichola.open .cf{animation:cfs_pichola .275s linear 5}
.joy .ksc-pichola.open .fa{animation:cfa_pichola 1.375s step-end both}
.joy .ksc-pichola.open .fb{animation:cfb_pichola 1.375s step-end both}
@keyframes cfs_pichola{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_pichola{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_pichola{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-pichola.open .toss{animation:tossup_pichola 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_pichola{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-pichola .cf,.joy .ksc-pichola .fa,.joy .ksc-pichola .fb,.joy .ksc-pichola .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#e9c46a" stroke="#9c7a2a" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#9c7a2a" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#5a3a10" text-anchor="middle">Lake Pichola</text><text x="0" y="16" font-family="Fraunces, serif" font-size="40" font-weight="700" fill="#5a3a10" text-anchor="middle">Udaipur</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#5a3a10" text-anchor="middle">boat at sunset</text><g transform="translate(0 -78) scale(0.5)"><path d="M-40 26 V4 H40 V26 Z" fill="#f1e7d0"></path><path d="M-22 4 C-22 -30 22 -30 22 4 Z" fill="#7a5c40"></path><path d="M0 -26 V-38" stroke="#7a5c40" stroke-width="3"></path><g fill="#7a5c40"><path d="M-30 26 V12 a5 5 0 0 1 10 0 V26 Z"></path><path d="M-5 26 V12 a5 5 0 0 1 10 0 V26 Z"></path><path d="M20 26 V12 a5 5 0 0 1 10 0 V26 Z"></path></g></g></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="34" font-weight="700" fill="#5a3a10" text-anchor="middle">haveli</text><text x="0" y="36" font-family="Kalam, cursive" font-size="18" fill="#5a3a10" text-anchor="middle">lake view, room 4</text></g></g></g></g></svg>
