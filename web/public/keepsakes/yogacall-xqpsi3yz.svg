<svg xmlns="http://www.w3.org/2000/svg" viewBox="172 152 267 270" aria-hidden="true" focusable="false"><style>.joy .ksc-yogacall .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-yogacall.open .pc{animation:k50_yogacall 2.2s ease-in-out 0s 1}
@keyframes k50_yogacall{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-yogacall .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-yogacall .shine{opacity:0}
.joy .ksc-yogacall.open .shine{animation:shn_yogacall 1s ease-out .15s}
@keyframes shn_yogacall{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-yogacall .shine,.joy .ksc-yogacall .pc{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="pc"><g transform="translate(300 290) rotate(-4)"><g opacity=".9"><path d="M-30 -8 H30" stroke="#8a8f96" stroke-width="4"></path></g><g class="dc-e"><g transform="translate(0 -20) scale(4.0)" style="--w:2.50px"><path d="M0 14 C-8 0 -8 -16 0 -26 C8 -16 8 0 0 14 Z" fill="#efe1c0"></path><path d="M0 14 C-16 6 -26 -6 -26 -16 C-12 -12 -4 -2 0 14 Z M0 14 C16 6 26 -6 26 -16 C12 -12 4 -2 0 14 Z" fill="#6a7f5e"></path></g><g transform="translate(0 80) rotate(-2)" style="--w:5px"><path d="M-119.16 -20.0 H119.16 L109.16 2 L119.16 28.0 H-119.16 L-109.16 2 Z" fill="#000" opacity=".85"></path><path d="M-107.16 -24.0 H107.16 V24.0 Q0 30.0 -107.16 24.0 Z" fill="#000"></path></g></g><g transform="translate(0 -20) scale(4.0)"><path d="M0 14 C-8 0 -8 -16 0 -26 C8 -16 8 0 0 14 Z" fill="#efe1c0"></path><path d="M0 14 C-16 6 -26 -6 -26 -16 C-12 -12 -4 -2 0 14 Z M0 14 C16 6 26 -6 26 -16 C12 -12 4 -2 0 14 Z" fill="#6a7f5e"></path></g><g transform="translate(0 80) rotate(-2)"><path d="M-119.16 -20.0 H119.16 L109.16 2 L119.16 28.0 H-119.16 L-109.16 2 Z" fill="#3e5036" opacity=".85"></path><path d="M-107.16 -24.0 H107.16 V24.0 Q0 30.0 -107.16 24.0 Z" fill="#3e5036"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">side by side</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">ten breaths, two mats</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
