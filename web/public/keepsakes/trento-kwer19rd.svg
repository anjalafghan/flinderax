<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 244 289" aria-hidden="true" focusable="false"><style>.joy .ksc-trento .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-trento .fb{opacity:0}
.joy .ksc-trento.open .cf{animation:cfs_trento .275s linear 5}
.joy .ksc-trento.open .fa{animation:cfa_trento 1.375s step-end both}
.joy .ksc-trento.open .fb{animation:cfb_trento 1.375s step-end both}
@keyframes cfs_trento{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_trento{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_trento{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-trento.open .toss{animation:tossup_trento 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_trento{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-trento .cf,.joy .ksc-trento .fa,.joy .ksc-trento .fb,.joy .ksc-trento .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#c0392b" stroke="#7a1a16" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#7a1a16" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#fff6ea" text-anchor="middle">Trento, garden</text><text x="0" y="16" font-family="Fraunces, serif" font-size="36.4" font-weight="700" fill="#fff6ea" text-anchor="middle">acoustic</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#fff6ea" text-anchor="middle">weekends, live</text><g transform="translate(0 -78) scale(0.5)"><path d="M-6 -40 H6 V-6 H-6 Z" fill="#3a2414"></path><circle cy="6" r="18" fill="#c47a3a"></circle><circle cy="-8" r="13" fill="#c47a3a"></circle><circle cy="2" r="5" fill="#3a2414"></circle></g></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="34" font-weight="700" fill="#fff6ea" text-anchor="middle">encore</text><text x="0" y="36" font-family="Kalam, cursive" font-size="18" fill="#fff6ea" text-anchor="middle">one more song</text></g></g></g></g></svg>
