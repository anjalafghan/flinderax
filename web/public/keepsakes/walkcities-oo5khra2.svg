"#3e5036" stroke-width="3" stroke-linecap="round"></path><path d="M-44 20 q11 -8 22 0 t22 0 t22 0 t22 0" fill="none" stroke="#3e5036" stroke-width="3" stroke-linecap="round"></path></g><g transform="translate(0 110) rotate(-2)"><path d="M-137.0 -20.0 H137.0 L127.0 2 L137.0 28.0 H-137.0 L-127.0 2 Z" fill="#3e5036" opacity=".85"></path><path d="M-125.0 -24.0 H125.0 V24.0 Q0 30.0 -125.0 24.0 Z" fill="#3e5036"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="18.3" fill="#fbf8f1" text-anchor="middle">two cities, one walk</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">same playlist</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
