<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 143 471 269" aria-hidden="true" focusable="false"><style>.joy .ksc-mitron .tear{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-mitron.open .tear{transform:translate(46px,22px) rotate(9deg);transition:transform 0.7s cubic-bezier(.3,1.2,.5,1) 0.2s}
.joy .ksc-mitron .punch{opacity:0;transition:opacity .15s}
.joy .ksc-mitron.open .punch{opacity:1;transition:opacity 0.3s ease-out calc(0.1s + var(--d, 0s))}
.joy .ksc-mitron .tk{transform-box:fill-box;transform-origin:0% 50%}
.joy .ksc-mitron.open .tk{animation:k124_mitron 2.2s ease-in-out 0.2s 1}
@keyframes k124_mitron{0%,100%{transform:rotate(0)}20%{transform:rotate(3deg)}45%{transform:rotate(-2.4000000000000004deg)}70%{transform:rotate(1.35deg)}88%{transform:rotate(-0.6000000000000001deg)}}
.joy .ksc-mitron .note{opacity:0;transition:opacity .15s}
.joy .ksc-mitron.open .note{opacity:1;transition:opacity 0.3s ease-out calc(0.7s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-mitron .tear,.joy .ksc-mitron .punch,.joy .ksc-mitron .tk,.joy .ksc-mitron .note{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="tk"><g transform="translate(100 190) rotate(-5)"><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="#f6efe3"></path><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="none" stroke="#00000018" stroke-width="1.2"></path><path d="M0 0 H288 V44 H0 Z" fill="#22354c"></path><text x="150" y="30" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">ROYAL PLAZA ROOFTOP</text><text x="150" y="92" font-family="Fraunces, serif" font-size="30" font-weight="700" fill="#24303a" text-anchor="middle">Mitron, table 9</text><text x="20" y="126" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">open-air, Ghodbunder Rd</text><text x="20" y="148" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">starters to share</text><text x="20" y="170" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">then the slow walk</text><g transform="translate(260 150) scale(0.6)"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#f2c230"></path></g><path d="M300 14 V196" stroke="#5a4a3a" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="3 5"></path><g class="tear"><path d="M312 0 H400 V210 H312 A12 12 0 0 0 312 210 Z" fill="#f6efe3"></path><path d="M312 0 H400 V44 H312 Z" fill="#22354c"></path><g transform="translate(356 120) rotate(-90)"><text x="0" y="6" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#24303a" text-anchor="middle">TABLE 9</text></g><path class="punch" d="M356 54 l3 7 l8 1 l-6 5 l2 8 l-7 -4 l-7 4 l2 -8 l-6 -5 l8 -1 Z" fill="#1d1a16"></path></g></g></g></svg