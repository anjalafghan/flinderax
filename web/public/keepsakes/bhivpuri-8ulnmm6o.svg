<svg xmlns="http://www.w3.org/2000/svg" viewBox="107 148 406 279" aria-hidden="true" focusable="false"><style>.joy .ksc-bhivpuri .card{transform-box:fill-box;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.joy .ksc-bhivpuri .pb{opacity:0;transition:opacity 0s .35s}
.joy .ksc-bhivpuri .pf{transition:opacity 0s .35s}
.joy .ksc-bhivpuri.open .card{transform:scaleX(-1) rotate(-3deg);transition:transform .7s cubic-bezier(.4,0,.2,1) .7s}
.joy .ksc-bhivpuri.open .pb{opacity:1;transition:opacity 0s 1.05s}
.joy .ksc-bhivpuri.open .pf{opacity:0;transition:opacity 0s 1.05s}
.joy .ksc-bhivpuri .frank{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-bhivpuri.open .frank{animation:frk_bhivpuri .25s ease-out .15s both}
@keyframes frk_bhivpuri{0%{opacity:0;transform:scale(1.7)}100%{opacity:.85;transform:none}}
@media (prefers-reduced-motion:reduce){.joy .ksc-bhivpuri .card,.joy .ksc-bhivpuri .pb,.joy .ksc-bhivpuri .pf,.joy .ksc-bhivpuri .frank{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><defs><clipPath id="bhivpuri-pc-c"><rect width="360" height="230" rx="6"></rect></clipPath><linearGradient id="bhivpuri-pc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8c9b4"></stop><stop offset="1" stop-color="#dfe6d4"></stop></linearGradient></defs><g transform="translate(120 186) rotate(-4)"><g class="card"><g class="pf"><g clip-path="url(#bhivpuri-pc-c)"><rect width="360" height="230" fill="url(#bhivpuri-pc-sky)"></rect><path d="M0 160 C90 150 270 170 360 156 V230 H0 Z" fill="#3f553b"></path><g transform="translate(170 130) scale(2.6)"><path d="M-50 26 V-30 C-30 -36 -16 -20 -10 -30 V26 Z M10 26 V-30 C20 -20 34 -36 50 -30 V26 Z" fill="#4f7a45"></path><path d="M-10 -30 C-4 -34 4 -34 10 -30 V20 H-10 Z" fill="#bfe3f2"></path><path d="M-4 -26 V14 M4 -26 V16" stroke="#fff" stroke-width="2"></path><ellipse cy="22" rx="22" ry="6" fill="#fff" opacity=".8"></ellipse></g><g transform="translate(290 70) scale(1)"><path d="M-40 -8 h50" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path><path d="M-10 4 h46" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path><path d="M-34 16 h40" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"></path></g></g><rect x="8" y="8" width="344" height="214" rx="4" fill="none" stroke="#fff" stroke-width="6"></rect><path d="M14 178 H222 L230 196 L222 214 H14 Z" fill="#fbf6ea"></path><text x="24" y="204" font-family="Caveat, cursive" font-size="28" font-weight="700" fill="#2a3f7a" text-anchor="start">Bhivpuri falls</text><g transform="translate(290 40) rotate(-12)"><g class="frank"><circle r="26" fill="none" stroke="#2a2a2a" stroke-width="2.4"></circle><path d="M30 -12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 -4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 4 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path><path d="M30 12 q8 -5 16 0 t16 0 t16 0" fill="none" stroke="#2a2a2a" stroke-width="2"></path></g></g></g><g class="pb" transform="translate(360 0) scale(-1 1)"><rect width="360" height="230" rx="6" fill="#fbf6ea"></rect><path d="M190.0 24 V206" stroke="#c9b48a"></path><text x="20" y="60" font-family="Kalam, cursive" font-size="17.6" fill="#2a3f7a" text-anchor="start">Train to Bhivpuri</text><text x="20" y="90" font-family="Kalam, cursive" font-size="15.0" fill="#2a3f7a" text-anchor="start">Road, a local guide,</text><text x="20" y="120" font-family="Kalam, cursive" font-size="16.7" fill="#2a3f7a" text-anchor="start">and we stood under</text><text x="20" y="150" font-family="Kalam, cursive" font-size="20" fill="#2a3f7a" text-anchor="start">it. Soaked.</text><rect x="290" y="18" width="52" height="62" fill="#f2e3b3" stroke="#c0392b" stroke-dasharray="3 2"></rect><g transform="translate(316 49) scale(.5)"><path d="M0 -22 L6 -7 L22 -7 L9 3 L14 20 L0 10 L-14 20 L-9 3 L-22 -7 L-6 -7 Z" fill="#f1c84b"></path></g><path d="M204.0 120 H336" stroke="#c9b48a"></path><path d="M204.0 150 H336" stroke="#c9b48a"></path><path d="M204.0 180 H336" stroke="#c9b48a"></path><text x="208.0" y="114" font-family="Kalam, cursive" font-size="18" fill="#2a3f7a" text-anchor="start">to us</text></g></g></g></svg>
