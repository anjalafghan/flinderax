<svg xmlns="http://www.w3.org/2000/svg" viewBox="119 -25 435 650" aria-hidden="true" focusable="false"><style>.joy .ksc-koko .flap-out,.joy .ksc-koko .flap-in,.joy .ksc-koko .sticks,.joy .ksc-koko .ice,.joy .ksc-koko .surface{transform-box:fill-box}
.joy .ksc-koko .flap-out,.joy .ksc-koko .flap-in{transform-origin:50% 0}
.joy .ksc-koko .ice,.joy .ksc-koko .surface{transform-origin:50% 50%}
.joy .ksc-koko .flap-out{transform:scaleY(1);transition:transform .26s ease-in .5s}
.joy .ksc-koko .flap-in{transform:scaleY(0);transition:transform .3s ease-out .2s}
.joy .ksc-koko .sticks{transform:translateY(0);transition:transform .45s cubic-bezier(.5,0,.75,0)}
.joy .ksc-koko .note{opacity:0;transition:opacity .2s linear .1s}
.joy .ksc-koko.open .flap-out{transform:scaleY(0);transition-delay:0s}
.joy .ksc-koko.open .flap-in{transform:scaleY(-1);transition-delay:.26s}
.joy .ksc-koko.open .sticks{transform:translateY(-136px);transition:transform .7s cubic-bezier(.2,.8,.25,1) .5s}
.joy .ksc-koko.open .note{opacity:1;transition-delay:.3s}
.joy .ksc-koko .note-hide{transition:opacity .2s linear .5s}
.joy .ksc-koko.open .note-hide{opacity:0;transition-delay:0s}
.joy .ksc-koko.open .ice{animation:ice_koko 1.6s ease-in-out .9s}
.joy .ksc-koko.open .surface{animation:surf_koko 1.6s ease-in-out .9s}
@keyframes ice_koko{0%,100%{transform:rotate(0) translateY(0)}35%{transform:rotate(16deg) translateY(5px)}70%{transform:rotate(-5deg) translateY(-2px)}}
@keyframes surf_koko{0%,100%{transform:scaleY(1)}35%{transform:scaleY(2)}70%{transform:scaleY(.7)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-koko .flap-out,.joy .ksc-koko .flap-in,.joy .ksc-koko .sticks,.joy .ksc-koko .note{transition-duration:.01s!important;transition-delay:0s!important}
.joy .ksc-koko.open .ice,.joy .ksc-koko.open .surface{animation:none}}</style><defs>
<linearGradient id="koko-k-paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfad48"></stop><stop offset=".6" stop-color="#d6a13a"></stop><stop offset="1" stop-color="#c38c2c"></stop></linearGradient>
<linearGradient id="koko-k-edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff2cc" stop-opacity=".22"></stop><stop offset=".15" stop-color="#fff2cc" stop-opacity="0"></stop><stop offset=".85" stop-color="#5a3a10" stop-opacity="0"></stop><stop offset="1" stop-color="#5a3a10" stop-opacity=".22"></stop></linearGradient>
<linearGradient id="koko-k-crease" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2e0c" stop-opacity=".35"></stop><stop offset="1" stop-color="#4a2e0c" stop-opacity="0"></stop></linearGradient>
<linearGradient id="koko-k-inside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe0"></stop><stop offset="1" stop-color="#e8dcc2"></stop></linearGradient>
<linearGradient id="koko-k-stick" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#24140e"></stop><stop offset=".45" stop-color="#4a2c1f"></stop><stop offset=".6" stop-color="#5e3a28"></stop><stop offset="1" stop-color="#24140e"></stop></linearGradient>
<linearGradient id="koko-k-whisky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8701f"></stop><stop offset=".6" stop-color="#9a4612"></stop><stop offset="1" stop-color="#5e2508"></stop></linearGradient>
<linearGradient id="koko-k-glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".36"></stop><stop offset=".25" stop-color="#fff" stop-opacity=".08"></stop><stop offset=".8" stop-color="#fff" stop-opacity=".05"></stop><stop offset="1" stop-color="#fff" stop-opacity=".3"></stop></linearGradient>
<filter id="koko-k-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .16 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter>
<clipPath id="koko-k-body"><rect x="0" y="0" width="112" height="400"></rect></clipPath>
<clipPath id="koko-k-above"><rect x="-60" y="-400" width="232" height="400"></rect></clipPath>
<clipPath id="koko-k-glassclip"><path d="M420 382 L532 382 L525 540 L427 540 Z"></path></clipPath>
<path id="koko-k-leaf" d="M0 0 C6 -10 22 -14 34 -12 C24 -4 12 2 0 0 Z"></path>
</defs>
