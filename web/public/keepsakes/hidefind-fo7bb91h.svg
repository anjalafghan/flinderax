<svg xmlns="http://www.w3.org/2000/svg" viewBox="103 95 372 391" aria-hidden="true" focusable="false"><style>.joy .ksc-hidefind .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-hidefind.open .mk{stroke-dashoffset:0;transition:stroke-dashoffset 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-hidefind .mw{opacity:0;transition:opacity .15s}
.joy .ksc-hidefind.open .mw{opacity:1;transition:opacity 0.15s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-hidefind .ring{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-hidefind.open .ring{stroke-dashoffset:0;transition:stroke-dashoffset 0.6s ease-out calc(1.3s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-hidefind .mk,.joy .ksc-hidefind .mw,.joy .ksc-hidefind .ring{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(115.0 125.0) rotate(-3)"><path d="M12 0 H296 L330 34 V338 Q330 350 318 350 H12 Q0 350 0 338 V12 Q0 0 12 0 Z" fill="#fbf8ef"></path><circle cx="20" cy="145.0" r="6" fill="#00000055"></circle><circle cx="20" cy="205.0" r="6" fill="#00000055"></circle><text x="20" y="46" font-family="'Young Serif', serif" font-size="24" fill="#2b2b30" text-anchor="start">Hot or cold</text><text x="20" y="70" font-family="'Space Mono', monospace" font-size="10" fill="#6b6658" text-anchor="start">one hides, one walks, on a call</text><text x="290" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#1f4bb5" text-anchor="middle"></text><text x="34" y="130" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">cold</text><path d="M16 143 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.15s" pathLength="1" d="M281 124 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><text x="34" y="170" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">warmer</text><path d="M16 183 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.35s" pathLength="1" d="M281 164 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><text x="34" y="210" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">warm</text><path d="M16 223 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.55s" pathLength="1" d="M281 204 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><text x="34" y="250" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">HOT</text><path d="M16 263 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.75s" pathLength="1" d="M281 244 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><text x="34" y="290" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">found it</text><path d="M16 303 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.95s" pathLength="1" d="M281 284 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path></g></svg>
