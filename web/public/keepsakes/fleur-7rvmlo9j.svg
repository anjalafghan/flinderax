<svg xmlns="http://www.w3.org/2000/svg" viewBox="178 178 244 289" aria-hidden="true" focusable="false"><style>.joy .ksc-fleur .cf{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-fleur .fb{opacity:0}
.joy .ksc-fleur.open .cf{animation:cfs_fleur .275s linear 5}
.joy .ksc-fleur.open .fa{animation:cfa_fleur 1.375s step-end both}
.joy .ksc-fleur.open .fb{animation:cfb_fleur 1.375s step-end both}
@keyframes cfs_fleur{0%{transform:scaleY(1)}25%{transform:scaleY(0)}50%{transform:scaleY(-1)}75%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes cfa_fleur{0%{opacity:1}5%{opacity:0}15%{opacity:1}25%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%{opacity:1}85%,100%{opacity:0}}
@keyframes cfb_fleur{0%{opacity:0}5%{opacity:1}15%{opacity:0}25%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%{opacity:0}85%,100%{opacity:1}}
.joy .ksc-fleur.open .toss{animation:tossup_fleur 1.375s cubic-bezier(.3,0,.7,1)}
@keyframes tossup_fleur{50%{transform:translateY(-150px)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-fleur .cf,.joy .ksc-fleur .fa,.joy .ksc-fleur .fb,.joy .ksc-fleur .toss{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><ellipse cx="300" cy="440" rx="100" ry="14" fill="#000" opacity=".22"></ellipse><g class="toss"><g transform="translate(300 300)"><g class="cf"><circle r="110" fill="#f6f3ec" stroke="#c9c4b8" stroke-width="3"></circle><circle r="92.39999999999999" fill="none" stroke="#c9c4b8" stroke-opacity=".6" stroke-dasharray="3 5"></circle><g class="fa"><text x="0" y="-40" font-family="'Space Mono', monospace" font-size="13" fill="#3a2a20" text-anchor="middle">Fleur, The Fern</text><text x="0" y="16" font-family="Fraunces, serif" font-size="40" font-weight="700" fill="#3a2a20" text-anchor="middle">plate 4</text><text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#3a2a20" text-anchor="middle">veg and non-veg</text><g transform="translate(0 -78) scale(0.5)"><ellipse rx="40" ry="16" fill="#f6f3ec"></ellipse><ellipse rx="28" ry="10" fill="none" stroke="#c9c4b8"></ellipse><ellipse cy="-3" rx="18" ry="7" fill="#d9a85c"></ellipse></g></g><g class="fb"><text x="0" y="8" font-family="Fraunces, serif" font-size="34" font-weight="700" fill="#3a2a20" text-anchor="middle">one more</text><text x="0" y="36" font-family="Kalam, cursive" font-size="18" fill="#3a2a20" text-anchor="middle">dessert counter</text></g></g></g></g></svg>
