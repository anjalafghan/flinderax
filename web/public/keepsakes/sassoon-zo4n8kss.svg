<svg xmlns="http://www.w3.org/2000/svg" viewBox="77 156 432 240" aria-hidden="true" focusable="false"><style>.joy .ksc-sassoon .tg{transform-box:fill-box;transform-origin:100% 50%}
.joy .ksc-sassoon.open .tg{animation:k43_sassoon 2.2s ease-in-out 0s 1}
@keyframes k43_sassoon{0%,100%{transform:rotate(0)}20%{transform:rotate(7deg)}45%{transform:rotate(-5.6000000000000005deg)}70%{transform:rotate(3.15deg)}88%{transform:rotate(-1.4000000000000001deg)}}
.joy .ksc-sassoon .stp{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-sassoon.open .stp{animation:k44_sassoon .25s ease-out calc(0.6s + var(--d, 0s)) both}
@keyframes k44_sassoon{0%{opacity:0;transform:scale(1.8)}100%{opacity:1;transform:none}}
