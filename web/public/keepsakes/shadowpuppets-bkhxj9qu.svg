<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 143 471 269" aria-hidden="true" focusable="false"><style>.joy .ksc-shadowpuppets .tear{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-shadowpuppets.open .tear{transform:translate(46px,22px) rotate(9deg);transition:transform 0.7s cubic-bezier(.3,1.2,.5,1) 0.2s}
.joy .ksc-shadowpuppets .punch{opacity:0;transition:opacity .15s}
.joy .ksc-shadowpuppets.open .punch{opacity:1;transition:opacity 0.3s ease-out calc(0.1s + var(--d, 0s))}
.joy .ksc-shadowpuppets .tk{transform-box:fill-box;transform-origin:0% 50%}
.joy .ksc-shadowpuppets.open .tk{animation:k167_shadowpuppets 2.2s ease-in-out 0.2s 1}
@keyframes k167_shadowpuppets{0%,100%{transform:rotate(0)}20%{transform:rotate(3deg)}45%{transform:rotate(-2.4000000000000004deg)}70%{transform:rotate(1.35deg)}88%{transform:rotate(-0.6000000000000001deg)}}
.joy .ksc-shadowpuppets .note{opacity:0;transition:opacity .15s}
.joy .ksc-shadowpuppets.open .note{opacity:1;transition:opacity 0.3s ease-out calc(0.7s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-shadowpuppets .tear,.joy .ksc-shadowpuppets .punch,.joy .ksc-shadowpuppets .tk,.joy .ksc-shadowpuppets .note{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="tk"><g transform="translate(100 190) rotate(-5)"><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="#f2c230"></path><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="none" stroke="#00000018" stroke-width="1.2"></path><path d="M0 0 H288 V44 H0 Z" fill="#16161a"></path><text x="150" y="30" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">ONE TORCH, ONE WALL</text><text x="150" y="92" font-family="Fraunces, serif" font-size="30" font-weight="700" fill="#16161a" text-anchor="middle">Shadow Theatre</text><text x="20" y="126" font-family="'Space Mono', monospace" font-size="12" fill="#16161a" text-anchor="start">act 1: the swan</text><text x="20" y="148" font-family="'Space Mono', monospace" font-size="12" fill="#16161a" text-anchor="start">act 2: the dog (dog?)</text><text x="20" y="170" font-family="'Space Mono', monospace" font-size="12" fill="#16161a" text-anchor="start">act 3: improvised</text><path d="M300 14 V196" stroke="#5a4a3a" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="3 5"></path><g class="tear"><path d="M312 0 H400 V210 H312 A12 12 0 0 0 312 210 Z" fill="#f2c230"></path><path d="M312 0 H400 V44 H312 Z" fill="#16161a"></path><g transform="translate(356 120) rotate(-90)"><text x="0" y="6" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#16161a" text-anchor="middle">ACT 3</text></g><path class="punch" d="M356 54 l3 7 l8 1 l-6 5 l2 8 l-7 -4 l-7 4 l2 -8 l-6 -5 l8 -1 Z" fill="#1d1a16"></path></g></g></g></svg>
