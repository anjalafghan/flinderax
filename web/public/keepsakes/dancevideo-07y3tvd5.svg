<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 -29 420 481" aria-hidden="true" focusable="false"><style>.joy .ksc-dancevideo .stick{transform-box:fill-box;transform-origin:0% 100%;transform:rotate(-24deg);transition:transform .3s}
.joy .ksc-dancevideo.open .stick{animation:clap_dancevideo .5s cubic-bezier(.5,0,.8,.4) both}
