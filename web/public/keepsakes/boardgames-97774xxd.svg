7.16 -24.0 H107.16 V24.0 Q0 30.0 -107.16 24.0 Z" fill="#000"></path></g></g><ellipse cy="-10" rx="140" ry="80" fill="#efe8d6"></ellipse><g transform="translate(-40 -20) scale(3.4)"><circle cy="-18" r="10" fill="#364033"></circle><path d="M-8 -8 H8 L12 18 H-12 Z" fill="#364033"></path><rect x="-18" y="16" width="36" height="8" rx="3" fill="#364033"></rect></g><g transform="translate(60 0) scale(2.0)"><rect x="-20" y="-20" width="40" height="40" rx="8" fill="#f6f3ec" stroke="#2b2b30" stroke-width="2"></rect><circle cx="-9" cy="-9" r="4" fill="#2b2b30"></circle><circle cx="9" cy="9" r="4" fill="#2b2b30"></circle><circle cx="0" cy="0" r="4" fill="#2b2b30"></circle></g><g transform="translate(0 100) rotate(-2)"><path d="M-119.16 -20.0 H119.16 L109.16 2 L119.16 28.0 H-119.16 L-109.16 2 Z" fill="#364033" opacity=".85"></path><path d="M-107.16 -24.0 H107.16 V24.0 Q0 30.0 -107.16 24.0 Z" fill="#364033"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">best of five</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">3 to 2, rematch owed</text></g></g></g></svg>
