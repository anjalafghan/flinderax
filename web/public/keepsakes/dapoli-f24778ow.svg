<svg xmlns="http://www.w3.org/2000/svg" viewBox="108 148 406 279" aria-hidden="true" focusable="false"><style>.joy .ksc-dapoli .card{transform-box:fill-box;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.joy .ksc-dapoli .pb{opacity:0;transition:opacity 0s .35s}
.joy .ksc-dapoli .pf{transition:opacity 0s .35s}
.joy .ksc-dapoli.open .card{transform:scaleX(-1) rotate(-3deg);transition:transform .7s cubic-bezier(.4,0,.2,1) .7s}
.joy .ksc-dapoli.open .pb{opacity:1;transition:opacity 0s 1.05s}
.joy .ksc-dapoli.open .pf{opacity:0;transition:opacity 0s 1.05s}
.joy .ksc-dapoli .frank{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-dapoli.open .frank{animation:frk_dapoli .25s ease-out .15s both}
@keyframes frk_dapoli{0%{opacity:0;transform:scale(1.7)}100%{opacity:.85;transform:none}}
