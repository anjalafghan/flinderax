<svg xmlns="http://www.w3.org/2000/svg" viewBox="107 63 309 501" aria-hidden="true" focusable="false"><style>.joy .ksc-tokai1 .sleeve,.joy .ksc-tokai1 .lid,.joy .ksc-tokai1 .steam path{transform-box:fill-box}
.joy .ksc-tokai1 .lid{transform-origin:0% 100%;transition:transform .4s cubic-bezier(.5,0,.75,0) .3s}
.joy .ksc-tokai1 .sleeve{transition:transform .5s cubic-bezier(.5,0,.75,0)}
.joy .ksc-tokai1 .steam path{stroke-dasharray:.3 1;stroke-dashoffset:.3}
.joy .ksc-tokai1.open .lid{transform:translate(-70px,-40px) rotate(-18deg);transition:transform .6s cubic-bezier(.2,.8,.25,1)}
.joy .ksc-tokai1.open .sleeve{transform:translateY(80px);transition:transform .7s cubic-bezier(.2,.8,.25,1) .45s}
.joy .ksc-tokai1.open .steam{opacity:.75;transition:opacity .4s .6s}
.joy .ksc-tokai1.open .steam path{animation:rise_tokai1 2.4s linear .6s 2}
.joy .ksc-tokai1.open .steam path:nth-child(2){animation-delay:.9s}
.joy .ksc-tokai1.open .steam path:nth-child(3){animation-delay:1.2s}
@keyframes rise_tokai1{from{stroke-dashoffset:.3}to{stroke-dashoffset:-1}}
@media (prefers-reduced-motion:reduce){.joy .ksc-tokai1 .lid,.joy .ksc-tokai1 .sleeve{transition-duration:.01s!important;transition-delay:0s!important}
.joy .ksc-tokai1.open .steam path{animation:none}
.joy .ksc-tokai1.open .steam{opacity:0}}</style><defs>
<filter id="tokai1-t-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.25  0 0 0 0 0.16  0 0 0 0 0.06  0 0 0 0.2 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter>
<linearGradient id="tokai1-t-cup" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9e6df"></stop><stop offset=".25" stop-color="#ffffff"></stop><stop offset=".7" stop-color="#f7f5f0"></stop><stop offset="1" stop-color="#d9d5cc"></stop></linearGradient>
<linearGradient id="tokai1-t-kraft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b3844f"></stop><stop offset=".3" stop-color="#c99d69"></stop><stop offset="1" stop-color="#a87a45"></stop></linearGradient>
<linearGradient id="tokai1-t-lid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8d3c6"></stop><stop offset=".3" stop-color="#f6f3ec"></stop><stop offset="1" stop-color="#cfc9bb"></stop></linearGradient>
<clipPath id="tokai1-t-cupclip"><path d="M205 210 L395 210 L372 535 L228 535 Z"></path></clipPath>
</defs>
<ellipse cx="300" cy="540" rx="96" ry="12" fill="#1c2a44" opacity=".3"></ellipse>
<path d="M205 210 L395 210 L372 535 L228 535 Z" fill="url(#tokai1-t-cup)"></path>
<g clip-path="url(#tokai1-t-cupclip)">
<g font-family="'Permanent Marker', cursive" fill="#26262a" transform="rotate(-6 300 270)">
<text x="300" y="276" font-size="30" text-anchor="middle">Diya + 1</text>
<text x="352" y="306" font-size="15" text-anchor="middle">10 Nov</text>
</g>
<g font-family="Kalam, cursive" font-size="18" fill="#2a4a8a" text-anchor="middle" transform="rotate(-2 300 360)">
<text x="300" y="350">first time here.</text>
<text x="300" y="374">back in two days.</text>
</g>
