<svg xmlns="http://www.w3.org/2000/svg" viewBox="158 -5 303 536" aria-hidden="true" focusable="false"><style>.joy .ksc-hampi .ly{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-hampi.open .ly{animation:k173_hampi 2.2s ease-in-out 0s 1}
@keyframes k173_hampi{0%,100%{transform:rotate(0)}20%{transform:rotate(6deg)}45%{transform:rotate(-4.800000000000001deg)}70%{transform:rotate(2.7deg)}88%{transform:rotate(-1.2000000000000002deg)}}
.joy .ksc-hampi .glow{opacity:0}
