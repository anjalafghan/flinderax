<svg xmlns="http://www.w3.org/2000/svg" viewBox="87 143 471 331" aria-hidden="true" focusable="false"><style>.joy .ksc-planetarium .tear{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-planetarium.open .tear{transform:translate(46px,22px) rotate(9deg);transition:transform 0.7s cubic-bezier(.3,1.2,.5,1) 0.2s}
.joy .ksc-planetarium .punch{opacity:0;transition:opacity .15s}
.joy .ksc-planetarium.open .punch{opacity:1;transition:opacity 0.3s ease-out calc(0.1s + var(--d, 0s))}
.joy .ksc-planetarium .tk{transform-box:fill-box;transform-origin:0% 50%}
.joy .ksc-planetarium.open .tk{animation:k2_planetarium 2.2s ease-in-out 0.2s 1}
@keyframes k2_planetarium{0%,100%{transform:rotate(0)}20%{transform:rotate(3deg)}45%{transform:rotate(-2.4000000000000004deg)}70%{transform:rotate(1.35deg)}88%{transform:rotate(-0.6000000000000001deg)}}
.joy .ksc-planetarium .note{opacity:0;transition:opacity .15s}
.joy .ksc-planetarium.open .note{opacity:1;transition:opacity 0.3s ease-out calc(0.7s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-planetarium .tear,.joy .ksc-planetarium .punch,.joy .ksc-planetarium .tk,.joy .ksc-planetarium .note{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="tk"><g transform="translate(100 190) rotate(-5)"><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="#eef0f8"></path><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="none" stroke="#00000018" stroke-width="1.2"></path><path d="M0 0 H288 V44 H0 Z" fill="#1f2b4d"></path><text x="150" y="30" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">SKY THEATRE, WORLI</text><text x="150" y="92" font-family="Fraunces, serif" font-size="27.8" font-weight="700" fill="#24303a" text-anchor="middle">Nehru Planetarium</text><text x="20" y="126" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">show at 4:30, dome seats</text><text x="20" y="148" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">lean back, look up</text><text x="20" y="170" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">closed Mondays</text><g transform="translate(240 150) scale(0.9)"><circle cx="-30" cy="-10" r="2.4" fill="#1f2b4d"></circle><circle cx="-6" cy="-26" r="1.8" fill="#1f2b4d"></circle><circle cx="20" cy="-8" r="2.8" fill="#1f2b4d"></circle><circle cx="34" cy="-28" r="1.6" fill="#1f2b4d"></circle><circle cx="6" cy="12" r="2" fill="#1f2b4d"></circle><circle cx="-24" cy="20" r="1.6" fill="#1f2b4d"></circle></g><g transform="translate(270 120) scale(0.5)"><path d="M10 -24 A26 26 0 1 0 10 24 A20 20 0 1 1 10 -24 Z" fill="#e9c46a"></path></g><path d="M300 14 V196" stroke="#5a4a3a" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="3 5"></path><g class="tear"><path d="M312 0 H400 V210 H312 A12 12 0 0 0 312 210 Z" fill="#eef0f8"></path><path d="M312 0 H400 V44 H312 Z" fill="#1f2b4d"></path><g transform="translate(356 120) rotate(-90)"><text x="0" y="6" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#24303a" text-anchor="middle">ADMIT 2</text></g><path class="punch" d="M356 54 l3 7 l8 1 l-6 5 l2 8 l-7 -4 l-7 4 l2 -8 l-6 -5 l8 -1 Z" fill="#1d1a16"></path></g><text class="note" x="200" y="268" font-family="Kalam, cursive" font-size="22" fill="#fff8ea" text-anchor="middle" transform="rotate(-3 200 268)">we found Orion</text></g></g></svg>
