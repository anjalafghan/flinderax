-family="'Young Serif', serif" font-size="18" fill="#5a1d0c" text-anchor="middle">Malshej Ghat</text><text x="105" y="46" font-family="'Space Mono', monospace" font-size="9" fill="#4a3a30" text-anchor="middle">bhutta, clouds across the road</text></g></svg>
