<svg xmlns="http://www.w3.org/2000/svg" viewBox="121 -16 376 496" aria-hidden="true" focusable="false"><style>.joy .ksc-mahabaleshwar .rb{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-mahabaleshwar.open .rb{transform:translate(0px,-40px) rotate(0deg);transition:transform 0.3s cubic-bezier(.3,1.2,.5,1) 0s}
.joy .ksc-mahabaleshwar .rb{transition:opacity .2s}
.joy .ksc-mahabaleshwar.open .rb{opacity:0;transition:opacity 0.2s calc(0.15s + var(--d, 0s))}
.joy .ksc-mahabaleshwar .lid{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-mahabaleshwar.open .lid{transform:translate(40px,-150px) rotate(-12deg);transition:transform 0.6s cubic-bezier(.3,1.2,.5,1) 0.35s}
.joy .ksc-mahabaleshwar .tr{opacity:0;transition:opacity .15s}
.joy .ksc-mahabaleshwar.open .tr{opacity:1;transition:opacity 0.3s ease-out calc(0.5s + var(--d, 0s))}
