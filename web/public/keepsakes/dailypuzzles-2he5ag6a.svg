<svg xmlns="http://www.w3.org/2000/svg" viewBox="147 142 301 316" aria-hidden="true" focusable="false"><style>.joy .ksc-dailypuzzles .gloss{opacity:0;transition:opacity .3s}
.joy .ksc-dailypuzzles.open .gloss{opacity:0.35;transition:opacity 0.8s 0.5s}
.joy .ksc-dailypuzzles .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-dailypuzzles .dc-d *{fill:#2a2018!important;stroke:#2a2018!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:.55!important;stroke-dasharray:none!important}
.joy .ksc-dailypuzzles .pc{transform-box:fill-box}
.joy .ksc-dailypuzzles.open .pc{animation:mg_dailypuzzles .7s cubic-bezier(.3,0,.4,1)}
