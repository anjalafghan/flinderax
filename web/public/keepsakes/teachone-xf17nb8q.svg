<svg xmlns="http://www.w3.org/2000/svg" viewBox="149 99 302 437" aria-hidden="true" focusable="false"><style>.joy .ksc-teachone .shine{opacity:0}
.joy .ksc-teachone.open .shine{animation:shn_teachone .9s ease-out .2s}
@keyframes shn_teachone{0%{opacity:0;transform:translateX(0)}30%{opacity:.6}100%{opacity:0;transform:translateX(160px)}}
.joy .ksc-teachone .bd{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-teachone.open .bd{animation:k115_teachone 2.2s ease-in-out 0s 1}
@keyframes k115_teachone{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}45%{transform:rotate(-4.0deg)}70%{transform:rotate(2.25deg)}88%{transform:rotate(-1.0deg)}}
.joy .ksc-teachone .tails{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-teachone.open .tails{animation:flut_teachone .3s ease-in-out 5 alternate}
@keyframes flut_teachone{to{transform:skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-teachone .tails,.joy .ksc-teachone .shine,.joy .ksc-teachone .bd{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="bd"><g transform="translate(300 250) rotate(-6)"><g class="tails"><path d="M-60 80 L-90 260 L-60 236 L-36 266 L-10 96 Z" fill="#e8b923"></path><path d="M60 80 L90 260 L60 236 L36 266 L10 96 Z" fill="#c0392b"></path></g><circle cx="124.0" cy="0.0" r="14" fill="#c0392b"></circle><circle cx="119.8" cy="32.1" r="14" fill="#c0392b"></circle><circle cx="107.4" cy="62.0" r="14" fill="#c0392b"></circle><circle cx="87.7" cy="87.7" r="14" fill="#c0392b"></circle><circle cx="62.0" cy="107.4" r="14" fill="#c0392b"></circle><circle cx="32.1" cy="119.8" r="14" fill="#c0392b"></circle><circle cx="0.0" cy="124.0" r="14" fill="#c0392b"></circle><circle cx="-32.1" cy="119.8" r="14" fill="#c0392b"></circle><circle cx="-62.0" cy="107.4" r="14" fill="#c0392b"></circle><circle cx="-87.7" cy="87.7" r="14" fill="#c0392b"></circle><circle cx="-107.4" cy="62.0" r="14" fill="#c0392b"></circle><circle cx="-119.8" cy="32.1" r="14" fill="#c0392b"></circle><circle cx="-124.0" cy="0.0" r="14" fill="#c0392b"></circle><circle cx="-119.8" cy="-32.1" r="14" fill="#c0392b"></circle><circle cx="-107.4" cy="-62.0" r="14" fill="#c0392b"></circle><circle cx="-87.7" cy="-87.7" r="14" fill="#c0392b"></circle><circle cx="-62.0" cy="-107.4" r="14" fill="#c0392b"></circle><circle cx="-32.1" cy="-119.8" r="14" fill="#c0392b"></circle><circle cx="-0.0" cy="-124.0" r="14" fill="#c0392b"></circle><circle cx="32.1" cy="-119.8" r="14" fill="#c0392b"></circle><circle cx="62.0" cy="-107.4" r="14" fill="#c0392b"></circle><circle cx="87.7" cy="-87.7" r="14" fill="#c0392b"></circle><circle cx="107.4" cy="-62.0" r="14" fill="#c0392b"></circle><circle cx="119.8" cy="-32.1" r="14" fill="#c0392b"></circle><circle r="120" fill="#f6efe0"></circle><circle r="108" fill="none" stroke="#2b2b30" stroke-opacity=".4