<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 165 318 279" aria-hidden="true" focusable="false"><style>.joy .ksc-sametakeaway .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-sametakeaway .pc{transform-box:fill-box;transform-origin:0% 100%}
.joy .ksc-sametakeaway.open .pc{transform:rotate(-7deg) translate(-4px,-14px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.joy .ksc-sametakeaway .pc{transition:transform .3s}
.joy .ksc-sametakeaway .shine{opacity:0}
.joy .ksc-sametakeaway.open .shine{animation:shn_sametakeaway 1s ease-out .2s}
@keyframes shn_sametakeaway{0%{opacity:0;transform:translateX(0)}30%{opacity:.45}100%{opacity:0;transform:translateX(280px)}}
