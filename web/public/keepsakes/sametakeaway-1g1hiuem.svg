</path><path d="M-125.0 -24.0 H125.0 V24.0 Q0 30.0 -125.0 24.0 Z" fill="#843b1f"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="18.3" fill="#fbf8f1" text-anchor="middle">same order, 2 cities</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">yours was better</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
