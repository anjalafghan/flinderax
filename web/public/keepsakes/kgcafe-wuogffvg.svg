<svg xmlns="http://www.w3.org/2000/svg" viewBox="119 129 341 341" aria-hidden="true" focusable="false"><style>.joy .ksc-kgcafe .ring{opacity:0}
.joy .ksc-kgcafe.open .ring{opacity:1;transition:opacity .4s 1.1s}
.joy .ksc-kgcafe .gl{transform-box:fill-box;opacity:0}
.joy .ksc-kgcafe.open .gl{animation:gld_kgcafe 1.6s ease-in-out both}
@keyframes gld_kgcafe{0%{opacity:0;transform:translate(60px,-160px)}35%{opacity:1;transform:translate(0,0)}70%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(80px,-140px)}}
.joy .ksc-kgcafe .cs{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-kgcafe.open .cs{animation:csp_kgcafe .7s ease-out .9s}
@keyframes csp_kgcafe{40%{transform:rotate(9deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-kgcafe .ring,.joy .ksc-kgcafe .gl,.joy .ksc-kgcafe .cs{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="cs"><g transform="translate(290 300) rotate(-8)"><circle r="140" fill="#f6efe0"></circle><circle r="124" fill="none" stroke="#3a2a20" stroke-opacity=".35" stroke-width="2"></circle><text x="0" y="-30" font-family="Fraunces, serif" font-size="26.7" font-weight="800" fill="#3a2a20" text-anchor="middle">Kala Ghoda Café</text><text x="0" y="0" font-family="'Space Mono', monospace" font-size="12" fill="#3a2a20" text-anchor="middle">Ropewalk Lane, skylit</text><g transform="translate(0 70) scale(0.6)"><circle r="18" fill="#e8b923"></circle><path d="M0 -26 V-36" stroke="#e8b923" stroke-width="4" stroke-linecap="round" transform="rotate(0)"></path><path d="M0 -26 V-36" stroke="#e8b923" stroke-width="4" stroke-linecap="round" transform="rotate(45)"></path><path d="M0 -26 V-36" stroke="#e8b923" stroke-width="4" stroke-linecap="round" transform="rotate(90)"></path><path d="M0 -26 V-36" stroke="#e8b923" stroke-width="4" stroke-linecap="round" transform="rotate(135)"></path><path d="M0 -26 V-36" stroke="#e8b923" stroke-width="4" stroke-linecap="round" transform="rotate(180)"></path><path d="M0 -26 V-36" stroke="#e8b923" stroke-width="4" stroke-linecap="round" transform="rotate(225)"></path><path d="M0 -26 V-36" stroke="#e8b923" stroke-width="4" stroke-linecap="round" transform="rotate(270)"></path><path d="M0 -26 V-36" stroke="#e8b923" stroke-width="4" stroke-linecap="round" transform="rotate(315)"></path></g><circle class="ring" r="48" cx="56" cy="74" fill="none" stroke="#6b4a2a" stroke-opacity=".45" stroke-width="7"></circle></g></g><g class="gl"><g transform="translate(340 320) scale(2.4)"><path d="M-20 -14 H20 L16 18 H-16 Z" fill="#f6f3ec"></path><ellipse cy="-14" rx="20" ry="5" fill="#6b3a1f"></ellipse><path d="M20 -6 C32 -6 32 10 18 10" fill="none" stroke="#f6f3ec" stroke-width="4"></path><ellipse cy="20" rx="26" ry="5" fill="#f6f3ec" opacity=".9"></ellipse></g></g></svg>
