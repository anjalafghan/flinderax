<svg xmlns="http://www.w3.org/2000/svg" viewBox="127 55 333 480" aria-hidden="true" focusable="false"><style>.joy .ksc-mountmary .fx{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-mountmary.open .fx{animation:k133_mountmary .5s cubic-bezier(.3,1.6,.5,1) calc(0.2s + var(--d, 0s)) both}
@keyframes k133_mountmary{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
.joy .ksc-mountmary .lb{transform-box:fill-box}
.joy .ksc-mountmary.open .lb{animation:k135_mountmary .09s linear 0s 4}
@keyframes k135_mountmary{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
