<svg xmlns="http://www.w3.org/2000/svg" viewBox="145 95 310 441" aria-hidden="true" focusable="false"><style>.joy .ksc-jenga .shine{opacity:0}
.joy .ksc-jenga.open .shine{animation:shn_jenga .9s ease-out .2s}
@keyframes shn_jenga{0%{opacity:0;transform:translateX(0)}30%{opacity:.6}100%{opacity:0;transform:translateX(160px)}}
.joy .ksc-jenga .bd{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-jenga.open .bd{animation:k99_jenga 2.2s ease-in-out 0s 1}
@keyframes k99_jenga{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}45%{transform:rotate(-4.0deg)}70%{transform:rotate(2.25deg)}88%{transform:rotate(-1.0deg)}}
.joy .ksc-jenga .tails{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-jenga.open .tails{animation:flut_jenga .3s ease-in-out 5 alternate}
@keyframes flut_jenga{to{transform:skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-jenga .tails,.joy .ksc-jenga .shine,.joy .ksc-jenga .bd{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="bd"><g transform="translate(300 250) rotate(-6)"><g class="tails"><path d="M-60 80 L-90 260 L-60 236 L-36 266 L-10 96 Z" fill="#7a4a2a"></path><path d="M60 80 L90 260 L60 236 L36 266 L10 96 Z" fill="#c99c6c"></path></g><circle r="130" fill="#c99c6c"></circle><circle r="120" fill="#f6efe0"></circle><circle r="108" fill="none" stroke="#2b2b30" stroke-opacity=".4" stroke-dasharray="3 5"></circle><text x="0" y="-44" font-family="'Young Serif', serif" font-size="26" fill="#2b2b30" text-anchor="middle">Jenga</text><text x="0" y="20" font-family="Fraunces, serif" font-size="52" font-weight="800" fill="#2b2b30" text-anchor="middle">fell</text><text x="0" y="56" font-family="'Space Mono', monospace" font-size="11" fill="#2b2b30" text-anchor="middle">your tower, my words</text><path class="shine" d="M-90 -40 L-40 -110 L-20 -110 L-70 -40 Z" fill="#fff" opacity="0"></path></g></g></svg>
