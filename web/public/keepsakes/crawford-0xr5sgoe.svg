<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 96 451 447" aria-hidden="true" focusable="false"><style>.joy .ksc-crawford .pk{transform-box:fill-box;transform-origin:30% 100%;transition:transform .4s}
.joy .ksc-crawford.open .pk{transform:rotate(-35deg);transition:transform .5s}
.joy .ksc-crawford .sd{opacity:0}
.joy .ksc-crawford.open .sd{animation:sdp_crawford 1s ease-in calc(.5s + var(--d)) both}
@keyframes sdp_crawford{0%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(-80px,260px)}}
