t><text x="0" y="98" font-family="Kalam, cursive" font-size="16" fill="#fff6ea" text-anchor="middle">garam masala, the good one</text><text x="0" y="120" font-family="Kalam, cursive" font-size="16" fill="#fff6ea" text-anchor="middle">under the Victorian roof</text><text x="0" y="142" font-family="Kalam, cursive" font-size="16" fill="#fff6ea" text-anchor="middle">haggled, a bit</text></g><ellipse class="sd" style="--d:0.00s" cx="-100" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.08s" cx="-63" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.16s" cx="-86" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.24s" cx="-49" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.32s" cx="-72" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.40s" cx="-95" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.48s" cx="-58" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.56s" cx="-81" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.64s" cx="-44" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.72s" cx="-67" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.80s" cx="-90" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.88s" cx="-53" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:0.96s" cx="-76" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse><ellipse class="sd" style="--d:1.04s" cx="-99" cy="-180" rx="4" ry="6" fill="#7a3a1a"></ellipse></g></svg>
