"rotate(225)"></ellipse><ellipse cy="-14" rx="8" ry="14" fill="#f2d38c" transform="rotate(270)"></ellipse><ellipse cy="-14" rx="8" ry="14" fill="#f2d38c" transform="rotate(315)"></ellipse><circle r="8" fill="#c8312b"></circle></g><g transform="translate(0 80) scale(0.6)"><path d="M-40 26 V4 H40 V26 Z" fill="#f2d38c"></path><path d="M-22 4 C-22 -30 22 -30 22 4 Z" fill="#c8312b"></path><path d="M0 -26 V-38" stroke="#c8312b" stroke-width="3"></path><g fill="#c8312b"><path d="M-30 26 V12 a5 5 0 0 1 10 0 V26 Z"></path><path d="M-5 26 V12 a5 5 0 0 1 10 0 V26 Z"></path><path d="M20 26 V12 a5 5 0 0 1 10 0 V26 Z"></path></g></g><circle class="ring" r="48" cx="56" cy="74" fill="none" stroke="#6b4a2a" stroke-opacity=".45" stroke-width="7"></circle></g></g><g class="gl"><g transform="translate(340 320) scale(2.4)"><path d="M-20 -14 H20 L16 18 H-16 Z" fill="#f6f3ec"></path><ellipse cy="-14" rx="20" ry="5" fill="#6b3a1f"></ellipse><path d="M20 -6 C32 -6 32 10 18 10" fill="none" stroke="#f6f3ec" stroke-width="4"></path><ellipse cy="20" rx="26" ry="5" fill="#f6f3ec" opacity=".9"></ellipse></g></g></svg>
