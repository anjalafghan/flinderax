<svg xmlns="http://www.w3.org/2000/svg" viewBox="131 141 318 318" aria-hidden="true" focusable="false"><style>.joy .ksc-bhaudaji .ring{opacity:0}
.joy .ksc-bhaudaji.open .ring{opacity:1;transition:opacity .4s 1.1s}
.joy .ksc-bhaudaji .gl{transform-box:fill-box;opacity:0}
.joy .ksc-bhaudaji.open .gl{animation:gld_bhaudaji 1.6s ease-in-out both}
@keyframes gld_bhaudaji{0%{opacity:0;transform:translate(60px,-160px)}35%{opacity:1;transform:translate(0,0)}70%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(80px,-140px)}}
.joy .ksc-bhaudaji .cs{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-bhaudaji.open .cs{animation:csp_bhaudaji .7s ease-out .9s}
@keyframes csp_bhaudaji{40%{transform:rotate(9deg)}100%{transform:rotate(0)}}
