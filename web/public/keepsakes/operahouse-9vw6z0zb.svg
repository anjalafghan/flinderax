<svg xmlns="http://www.w3.org/2000/svg" viewBox="87 143 471 269" aria-hidden="true" focusable="false"><style>.joy .ksc-operahouse .tear{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-operahouse.open .tear{transform:translate(46px,22px) rotate(9deg);transition:transform 0.7s cubic-bezier(.3,1.2,.5,1) 0.2s}
.joy .ksc-operahouse .punch{opacity:0;transition:opacity .15s}
.joy .ksc-operahouse.open .punch{opacity:1;transition:opacity 0.3s ease-out calc(0.1s + var(--d, 0s))}
.joy .ksc-operahouse .tk{transform-box:fill-box;transform-origin:0% 50%}
.joy .ksc-operahouse.open .tk{animation:k47_operahouse 2.2s ease-in-out 0.2s 1}
@keyframes k47_operahouse{0%,100%{transform:rotate(0)}20%{transform:rotate(3deg)}45%{transform:rotate(-2.4000000000000004deg)}70%{transform:rotate(1.35deg)}88%{transform:rotate(-0.6000000000000001deg)}}
.joy .ksc-operahouse .note{opacity:0;transition:opacity .15s}
.joy .ksc-operahouse.open .note{opacity:1;transition:opacity 0.3s ease-out calc(0.7s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-operahouse .tear,.joy .ksc-operahouse .punch,.joy .ksc-operahouse .tk,.joy .ksc-operahouse .note{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="tk"><g transform="translate(100 190) rotate(-5)"><path d="M18 0 H382 A18 18 0 0 0 400 18 V192 A18 18 0 0 0 382 210 H18 A18 18 0 0 0 0 192 V18 A18 18 0 0 0 18 0 Z" fill="#f6eddc"></path><path d="M18 0 H382 A18 18 0 0 0 400 18 V192 A18 18 0 0 0 382 210 H18 A18 18 0 0 0 0 192 V18 A18 18 0 0 0 18 0 Z" fill="none" stroke="#00000018" stroke-width="1.2"></path><path d="M0 0 H288 V44 H0 Z" fill="#7a1a16"></path><text x="150" y="30" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">GIRGAON, SINCE 1911</text><text x="150" y="92" font-family="Fraunces, serif" font-size="27.8" font-weight="700" fill="#24303a" text-anchor="middle">Royal Opera House</text><text x="20" y="126" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">box seats, gilded</text><text x="20" y="148" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">dressed up a little</text><text x="20" y="170" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">the chandelier</text><g transform="translate(250 155) scale(0.7)"><path d="M-40 26 V4 H40 V26 Z" fill="#f1e7d0"></path><path d="M-22 4 C-22 -30 22 -30 22 4 Z" fill="#7a1a16"></path><path d="M0 -26 V-38" stroke="#7a1a16" stroke-width="3"></path><g fill="#7a1a16"><path d="M-30 26 V12 a5 5 0 0 1 10 0 V26 Z"></path><path d="M-5 26 V12 a5 5 0 0 1 10 0 V26 Z"></path><path d="M20 26 V12 a5 5 0 0 1 10 0 V26 Z"></path></g></g><path d="M300 14 V196" stroke="#5a4a3a" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="3 5"></path><g class="tear"><path d="M312 0 H400 V210 H312 A12 12 0 0 0 312 210 Z" fill="#f6eddc"></path><path d="M312 0 H400 V44 H312 Z" fill="#7a1a16"></path><g transform="translate(356 120) rotate(-90)"><text x="0" y="6" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#24303a" text-anchor="middle">BOX 2</text></g><path class="punch" d="M356 54 l3 7 l8 1 l-6 5 l2 8 l-7 -4 l-7 4 l2 -8 l-6 -5 l8 -1 Z" fill="#1d1a16"></path></g></g></g></svg>
