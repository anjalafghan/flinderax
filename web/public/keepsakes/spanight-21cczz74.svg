<svg xmlns="http://www.w3.org/2000/svg" viewBox="121 145 298 285" aria-hidden="true" focusable="false"><style>.joy .ksc-spanight .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-spanight .pc{transform-box:fill-box;transform-origin:0% 100%}
.joy .ksc-spanight.open .pc{transform:rotate(-7deg) translate(-4px,-14px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.joy .ksc-spanight .pc{transition:transform .3s}
.joy .ksc-spanight .shine{opacity:0}
.joy .ksc-spanight.open .shine{animation:shn_spanight 1s ease-out .2s}
@keyframes shn_spanight{0%{opacity:0;transform:translateX(0)}30%{opacity:.45}100%{opacity:0;transform:translateX(280px)}}
