xt x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">Spa night</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">masks, soak, slow</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
