<svg xmlns="http://www.w3.org/2000/svg" viewBox="151 128 310 312" aria-hidden="true" focusable="false"><style>.joy .ksc-onecanvas .pc{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-onecanvas.open .pc{animation:k62_onecanvas 2.2s ease-in-out 0s 1}
@keyframes k62_onecanvas{0%,100%{transform:rotate(0)}20%{transform:rotate(4deg)}45%{transform:rotate(-3.2deg)}70%{transform:rotate(1.8deg)}88%{transform:rotate(-0.8deg)}}
.joy .ksc-onecanvas .dc-e *{fill:#c9a14a!important;stroke:#c9a14a!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-onecanvas .shine{opacity:0}
.joy .ksc-onecanvas.open .shine{animation:shn_onecanvas 1s ease-out .15s}
@keyframes shn_onecanvas{0%{opacity:0;transform:translateX(0)}30%{opacity:.55}100%{opacity:0;transform:translateX(280px)}}
