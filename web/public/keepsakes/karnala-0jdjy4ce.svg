<svg xmlns="http://www.w3.org/2000/svg" viewBox="103 115 370 351" aria-hidden="true" focusable="false"><style>.joy .ksc-karnala .mk{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-karnala.open .mk{stroke-dashoffset:0;transition:stroke-dashoffset 0.3s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-karnala .mw{opacity:0;transition:opacity .15s}
.joy .ksc-karnala.open .mw{opacity:1;transition:opacity 0.15s ease-out calc(0s + var(--d, 0s))}
.joy .ksc-karnala .ring{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .2s}
.joy .ksc-karnala.open .ring{stroke-dashoffset:0;transition:stroke-dashoffset 0.6s ease-out calc(1.1s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-karnala .mk,.joy .ksc-karnala .mw,.joy .ksc-karnala .ring{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g transform="translate(115.0 145.0) rotate(-3)"><path d="M12 0 H296 L330 34 V298 Q330 310 318 310 H12 Q0 310 0 298 V12 Q0 0 12 0 Z" fill="#fbf8ef"></path><circle cx="20" cy="125.0" r="6" fill="#00000055"></circle><circle cx="20" cy="185.0" r="6" fill="#00000055"></circle><text x="20" y="46" font-family="'Young Serif', serif" font-size="24" fill="#2b2b30" text-anchor="start">Karnala birds</text><text x="20" y="70" font-family="'Space Mono', monospace" font-size="10" fill="#6b6658" text-anchor="start">up to the fort pinnacle</text><text x="240" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#1f4bb5" text-anchor="middle">saw</text><text x="290" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#c0392b" text-anchor="middle"></text><text x="34" y="130" font-family="Kalam, cursive" font-size="16.4" fill="#2b2b30" text-anchor="start">paradise flycatcher</text><path d="M16 143 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.15s" pathLength="1" d="M231 124 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><text x="34" y="170" font-family="Kalam, cursive" font-size="17.3" fill="#2b2b30" text-anchor="start">a hornbill (maybe)</text><path d="M16 183 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.35s" pathLength="1" d="M231 164 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><text x="34" y="210" font-family="Kalam, cursive" font-size="18" fill="#2b2b30" text-anchor="start">drongo</text><path d="M16 223 H314" stroke="#c9c2b0"></path><path class="mk" style="--d:0.55s" pathLength="1" d="M231 204 l6 7 l12 -16" fill="none" stroke="#1f4bb5" stroke-width="3" stroke-linecap="round"></path><text x="34" y="250" font-family="Kalam, cursive" font-size="13.0" fill="#2b2b30" text-anchor="start">kingfisher by the stream</text><path d="M16 263 H314" stroke="#c9c2b0"></path><text style="--d:0.75s" class="mw" x="240" y="250" font-family="Kalam, cursive" font-size="20" font-weight="700" fill="#1f4bb5" text-anchor="middle"></text><g transform="translate(290 40) scale(0.7)"><path d="M-20 0 C-12 -10 -4 -10 0 0 C4 -10 12 -10 20 0" fill="none" stroke="#2f6d57" stroke-width="3" stroke-linecap="round"></path></g></g></svg>
