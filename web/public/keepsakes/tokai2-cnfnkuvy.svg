<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 3 610 588" aria-hidden="true" focusable="false"><style>.joy .ksc-tokai2 .hole-fill{fill:#b77d5f}
.joy .ksc-tokai2 .hole-crease{stroke:#8f5a3f}
.joy .ksc-tokai2 .punch-me .hole-fill{fill:none;stroke:#9c8a6a;stroke-width:1.4;stroke-dasharray:3 3.5;transition:fill .05s}
.joy .ksc-tokai2 .punch-me .hole-crease{stroke:none}
.joy .ksc-tokai2 .d12{opacity:0}
.joy .ksc-tokai2 .card,.joy .ksc-tokai2 .chad{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-tokai2 .back{opacity:0}
.joy .ksc-tokai2 .chad{opacity:0}
.joy .ksc-tokai2.open .punch-me .hole-fill{fill:#b77d5f;stroke:none;transition-delay:.25s}
.joy .ksc-tokai2.open .punch-me .hole-crease{stroke:#8f5a3f;transition:stroke 0s .25s}
.joy .ksc-tokai2.open .d12{opacity:1;transition:opacity .3s .4s}
.joy .ksc-tokai2.open .chad{animation:fall_tokai2 .9s cubic-bezier(.4,0,.8,.6) .25s both}
.joy .ksc-tokai2.open .card{animation:flip_tokai2 .9s ease-in-out 1.3s both}
.joy .ksc-tokai2.open .front{animation:hideA_tokai2 .9s step-end 1.3s both}
.joy .ksc-tokai2.open .back{animation:showB_tokai2 .9s step-end 1.3s both}
@keyframes fall_tokai2{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(26px,150px) rotate(220deg)}}
@keyframes flip_tokai2{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes hideA_tokai2{0%{opacity:1}50%,100%{opacity:0}}
@keyframes showB_tokai2{0%{opacity:0}50%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.joy .ksc-tokai2.open .card,.joy .ksc-tokai2.open .chad{animation:none}
.joy .ksc-tokai2.open .front{animation:none;opacity:0}
.joy .ksc-tokai2.open .back{animation:none;opacity:1}}</style><defs>
<filter id="tokai2-b-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.25  0 0 0 0 0.18  0 0 0 0 0.08  0 0 0 0.14 0"></feColorMatrix><feComposite in2="SourceGraphic" operator="in"></feComposite></filter>
