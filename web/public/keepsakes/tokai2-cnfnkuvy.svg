<linearGradient id="tokai2-b-bread" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5e2b4"></stop><stop offset="1" stop-color="#e9cd92"></stop></linearGradient>
<clipPath id="tokai2-b-clip"><path d="M0 -205 C110 -205 160 -90 150 10 C140 130 70 205 -10 205 C-110 205 -160 100 -150 -10 C-140 -120 -90 -205 0 -205 Z"></path></clipPath>
