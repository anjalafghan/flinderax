<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 143 471 269" aria-hidden="true" focusable="false"><style>.joy .ksc-thehouse .tear{transform-box:fill-box;transition:transform .35s ease-in}
.joy .ksc-thehouse.open .tear{transform:translate(46px,22px) rotate(9deg);transition:transform 0.7s cubic-bezier(.3,1.2,.5,1) 0.2s}
.joy .ksc-thehouse .punch{opacity:0;transition:opacity .15s}
.joy .ksc-thehouse.open .punch{opacity:1;transition:opacity 0.3s ease-out calc(0.1s + var(--d, 0s))}
.joy .ksc-thehouse .tk{transform-box:fill-box;transform-origin:0% 50%}
.joy .ksc-thehouse.open .tk{animation:k117_thehouse 2.2s ease-in-out 0.2s 1}
@keyframes k117_thehouse{0%,100%{transform:rotate(0)}20%{transform:rotate(3deg)}45%{transform:rotate(-2.4000000000000004deg)}70%{transform:rotate(1.35deg)}88%{transform:rotate(-0.6000000000000001deg)}}
.joy .ksc-thehouse .note{opacity:0;transition:opacity .15s}
.joy .ksc-thehouse.open .note{opacity:1;transition:opacity 0.3s ease-out calc(0.7s + var(--d, 0s))}
@media (prefers-reduced-motion:reduce){.joy .ksc-thehouse .tear,.joy .ksc-thehouse .punch,.joy .ksc-thehouse .tk,.joy .ksc-thehouse .note{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="tk"><g transform="translate(100 190) rotate(-5)"><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="#f6eddc"></path><path d="M0 0 H288 A12 12 0 0 0 312 0 H400 V210 H312 A12 12 0 0 0 288 210 H0 Z" fill="none" stroke="#00000018" stroke-width="1.2"></path><path d="M0 0 H288 V44 H0 Z" fill="#7a1a16"></path><text x="150" y="30" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">JP ROAD, ARAM NAGAR</text><text x="150" y="92" font-family="Fraunces, serif" font-size="30" font-weight="700" fill="#24303a" text-anchor="middle">The House</text><text x="20" y="126" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">North Indian plates</text><text x="20" y="148" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">a round of drinks</text><text x="20" y="170" font-family="'Space Mono', monospace" font-size="12" fill="#24303a" text-anchor="start">stayed for the set</text><g transform="translate(260 150) scale(0.6)"><path d="M-6 -40 H6 V-6 H-6 Z" fill="#3a2414"></path><circle cy="6" r="18" fill="#c47a3a"></circle><circle cy="-8" r="13" fill="#c47a3a"></circle><circle cy="2" r="5" fill="#3a2414"></circle></g><path d="M300 14 V196" stroke="#5a4a3a" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="3 5"></path><g class="tear"><path d="M312 0 H400 V210 H312 A12 12 0 0 0 312 210 Z" fill="#f6eddc"></path><path d="M312 0 H400 V44 H312 Z" fill="#7a1a16"></path><g transform="translate(356 120) rotate(-90)"><text x="0" y="6" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#24303a" text-anchor="middle">LIVE</text></g><path class="punch" d="M356 54 l3 7 l8 1 l-6 5 l2 8 l-7 -4 l-7 4 l2 -8 l-6 -5 l8 -1 Z" fill="#1d1a16"></path></g></g></g></svg>
