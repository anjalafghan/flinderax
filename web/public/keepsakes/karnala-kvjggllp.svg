<svg xmlns="http://www.w3.org/2000/svg" viewBox="155 156 321 287" aria-hidden="true" focusable="false"><style>.joy .ksc-karnala .spk{opacity:0;transition:opacity .15s}
.joy .ksc-karnala.open .spk{opacity:1;transition:opacity 0.3s ease-out calc(0.3s + var(--d, 0s))}
.joy .ksc-karnala .dc-e *{fill:#2f6d57!important;stroke:#2f6d57!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-karnala .dc-s *{fill:none!important;stroke:#fff8e8!important;stroke-width:var(--w)!important;stroke-dasharray:4 5!important;fill-opacity:1!important;stroke-opacity:.8!important;opacity:1!important}
.joy .ksc-karnala .pc{transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-karnala.open .pc{animation:pt_karnala .5s ease-out}
@keyframes pt_karnala{40%{transform:scale(.95)}100%{transform:none}}
