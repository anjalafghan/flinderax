<svg xmlns="http://www.w3.org/2000/svg" viewBox="129 109 305 313" aria-hidden="true" focusable="false"><style>.joy .ksc-onlineclass .dc-e *{fill:#fbf8f1!important;stroke:#fbf8f1!important;stroke-width:var(--w)!important;stroke-linejoin:round!important;stroke-linecap:round!important;fill-opacity:1!important;stroke-opacity:1!important;opacity:1!important;stroke-dasharray:none!important}
.joy .ksc-onlineclass .pc{transform-box:fill-box;transform-origin:0% 100%}
.joy .ksc-onlineclass.open .pc{transform:rotate(-7deg) translate(-4px,-14px);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.joy .ksc-onlineclass .pc{transition:transform .3s}
.joy .ksc-onlineclass .shine{opacity:0}
.joy .ksc-onlineclass.open .shine{animation:shn_onlineclass 1s ease-out .2s}
@keyframes shn_onlineclass{0%{opacity:0;transform:translateX(0)}30%{opacity:.45}100%{opacity:0;transform:translateX(280px)}}
