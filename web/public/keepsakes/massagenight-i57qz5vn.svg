cy="-8" rx="12" ry="5" fill="#8f9a6a" transform="rotate(-40 6 -8)"></ellipse><ellipse cx="20" cy="-18" rx="12" ry="5" fill="#8f9a6a" transform="rotate(30 20 -18)"></ellipse><ellipse cx="-4" cy="14" rx="6" ry="8" fill="#5b6a3a"></ellipse></g><g transform="translate(40 -80) scale(1.2)"><rect x="-8" y="-6" width="16" height="36" rx="2" fill="#f6efe0"></rect><path d="M0 -8 C-7 -18 -2 -26 0 -32 C4 -24 7 -18 0 -8 Z" fill="#ffb347"></path></g><g transform="translate(0 90) rotate(-2)"><path d="M-126.84 -20.0 H126.84 L116.84 2 L126.84 28.0 H-126.84 L-116.84 2 Z" fill="#5b3a1f" opacity=".85"></path><path d="M-114.84 -24.0 H114.84 V24.0 Q0 30.0 -114.84 24.0 Z" fill="#5b3a1f"></path><text x="0" y="2" font-family="'Young Serif', serif" font-size="24" fill="#fbf8f1" text-anchor="middle">massage night</text><text x="0" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#fbf8f1" text-anchor="middle">warm oil, slow hands</text></g><path class="shine" d="M-160 -60 L-120 -160 L-96 -160 L-136 -60 Z" fill="#fff" opacity="0"></path></g></g></svg>
