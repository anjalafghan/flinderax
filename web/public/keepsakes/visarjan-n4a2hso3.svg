<svg xmlns="http://www.w3.org/2000/svg" viewBox="149 99 302 437" aria-hidden="true" focusable="false"><style>.joy .ksc-visarjan .shine{opacity:0}
.joy .ksc-visarjan.open .shine{animation:shn_visarjan .9s ease-out .2s}
@keyframes shn_visarjan{0%{opacity:0;transform:translateX(0)}30%{opacity:.6}100%{opacity:0;transform:translateX(160px)}}
.joy .ksc-visarjan .bd{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-visarjan.open .bd{animation:k149_visarjan 2.2s ease-in-out 0s 1}
@keyframes k149_visarjan{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}45%{transform:rotate(-4.0deg)}70%{transform:rotate(2.25deg)}88%{transform:rotate(-1.0deg)}}
.joy .ksc-visarjan .tails{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-visarjan.open .tails{animation:flut_visarjan .3s ease-in-out 5 alternate}
@keyframes flut_visarjan{to{transform:skewX(5deg)}}
