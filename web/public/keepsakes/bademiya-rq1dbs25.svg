<svg xmlns="http://www.w3.org/2000/svg" viewBox="57 138 455 404" aria-hidden="true" focusable="false"><style>.joy .ksc-bademiya .sm{opacity:0;transform-box:fill-box}
.joy .ksc-bademiya.open .sm{animation:k103_bademiya 1.8s ease-out var(--d, 0s) 3}
@keyframes k103_bademiya{0%{opacity:0;transform:translateY(10px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-60px)}}
.joy .ksc-bademiya .gn{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.joy .ksc-bademiya.open .gn{animation:k104_bademiya .5s cubic-bezier(.3,1.6,.5,1) calc(0.3s + var(--d, 0s)) both}
@keyframes k104_bademiya{0%{opacity:0;transform:scale(.2) rotate(-14deg)}100%{opacity:1;transform:none}}
