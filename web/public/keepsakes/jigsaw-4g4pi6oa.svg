<svg xmlns="http://www.w3.org/2000/svg" viewBox="149 99 302 437" aria-hidden="true" focusable="false"><style>.joy .ksc-jigsaw .shine{opacity:0}
.joy .ksc-jigsaw.open .shine{animation:shn_jigsaw .9s ease-out .2s}
@keyframes shn_jigsaw{0%{opacity:0;transform:translateX(0)}30%{opacity:.6}100%{opacity:0;transform:translateX(160px)}}
.joy .ksc-jigsaw .bd{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-jigsaw.open .bd{animation:k19_jigsaw 2.2s ease-in-out 0s 1}
@keyframes k19_jigsaw{0%,100%{transform:rotate(0)}20%{transform:rotate(5deg)}45%{transform:rotate(-4.0deg)}70%{transform:rotate(2.25deg)}88%{transform:rotate(-1.0deg)}}
.joy .ksc-jigsaw .tails{transform-box:fill-box;transform-origin:50% 0%}
.joy .ksc-jigsaw.open .tails{animation:flut_jigsaw .3s ease-in-out 5 alternate}
@keyframes flut_jigsaw{to{transform:skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.joy .ksc-jigsaw .tails,.joy .ksc-jigsaw .shine,.joy .ksc-jigsaw .bd{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}</style><g class="bd"><g transform="translate(300 250) rotate(-6)"><g class="tails"><path d="M-60 80 L-90 260 L-60 236 L-36 266 L-10 96 Z" fill="#e8b923"></path><path d="M60 80 L90 260 L60 236 L36 266 L10 96 Z" fill="#2f6db5"></path></g><circle cx="124.0" cy="0.0" r="14" fill="#2f6db5"></circle><circle cx="119.8" cy="32.1" r="14" fill="#2f6db5"></circle><circle cx="107.4" cy="62.0" r="14" fill="#2f6db5"></circle><circle cx="87.7" cy="87.7" r="14" fill="#2f6db5"></circle><circle cx="62.0" cy="107.4" r="14" fill="#2f6db5"></circle><circle cx="32.1" cy="119.8" r="14" fill="#2f6db5"></circle><circle cx="0.0" cy="124.0" r="14" fill="#2f6db5"></circle><circle cx="-32.1" cy="119.8" r="14" fill="#2f6db5"></circle><circle cx="-62.0" cy="107.4" r="14" fill="#2f6db5"></circle><circle cx="-87.7" cy="87.7" r="14" fill="#2f6db5"></circle><circle cx="-107.4" cy="62.0" r="14" fill="#2f6db5"></circle><circle cx="-119.8" cy="32.1" r="14" fill="#2f6db5"></circle><circle cx="-124.0" cy="0.0" r="14" fill="#2f6db5"></circle><circle cx="-119.8" cy="-32.1" r="14" fill="#2f6db5"></circle><circle cx="-107.4" cy="-62.0" r="14" fill="#2f6db5"></circle><circle cx="-87.7" cy="-87.7" r="14" fill="#2f6db5"></circle><circle cx="-62.0" cy="-107.4" r="14" fill="#2f6db5"></circle><circle cx="-32.1" cy="-119.8" r="14" fill="#2f6db5"></circle><circle cx="-0.0" cy="-124.0" r="14" fill="#2f6db5"></circle><circle cx="32.1" cy="-119.8" r="14" fill="#2f6db5"></circle><circle cx="62.0" cy="-107.4" r="14" fill="#2f6db5"></circle><circle cx="87.7" cy="-87.7" r="14" fill="#2f6db5"></circle><circle cx="107.4" cy="-62.0" r="14" fill="#2f6db5"></circle><circle cx="119.8" cy="-32.1" r="14" fill="#2f6db5"></circle><circle r="120" fill="#f6efe0"></circle><circle r="108" fill="none" stroke="#2b2b30" stroke-opacity=".4" stroke-dasharray="3 5"></circle><text x="0" y="-44" font-family="'Young Serif', serif" font-size="26" fill="#2b2b30" text-anchor="middle">piece 1000</text><text x="0" y="20" font-family="Fraunces, serif" font-size="52" font-weight="800" fill="#2b2b30" text-anchor="middle">DONE</text><text x="0" y="56" font-family="'Space Mono', monospace" font-size="11" fill="#2b2b30" text-anchor="middle">found it under the sofa</text><g transform="translate(0 86) scale(0.9)"><path d="M-24 -24 H-6 a8 8 0 1 1 12 0 H24 V-6 a8 8 0 1 0 0 12 V24 H6 a8 8 0 1 0 -12 0 H-24 Z" fill="#2f6db5"></path></g><path class="shine" d="M-90 -40 L-40 -110 L-20 -110 L-70 -40 Z" fill="#fff" opacity="0"></path></g></g></svg>
