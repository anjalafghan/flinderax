# Wakes the sleeping Fly machine twice a day and has it send the nudges: a morning one about today
# (07:30 IST) and an evening one about tomorrow (19:00 IST). Cron runs in UTC.
#
# One-time setup (see docs/notifications.md):
#   fly secrets set VAPID_PRIVATE_KEY=... PUSH_RUN_TOKEN=... -a joy
#   GitHub repo secret JOY_PUSH_TOKEN = the same PUSH_RUN_TOKEN value
name: Notify
on:
  schedule:
    - cron: "0 2 * * *"   # 07:30 IST
    - cron: "30 13 * * *" # 19:00 IST
  workflow_dispatch:
    inputs:
      slot:
        description: morning or evening
        default: morning
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the slot
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "0 2 * * *" ]; then echo "slot=morning" >> "$GITHUB_OUTPUT";
          else echo "slot=evening" >> "$GITHUB_OUTPUT"; fi
      - name: Send
        env:
          TOKEN: ${{ secrets.JOY_PUSH_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "JOY_PUSH_TOKEN is not set; skipping"; exit 0; }
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 \
            -X POST -H "Authorization: Bearer $TOKEN" \
            "https://joy.fly.dev/api/internal/push/run?slot=${{ steps.slot.outputs.slot }}"
